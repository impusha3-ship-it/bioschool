<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 300" role="img" aria-label="Три задачи наземно-воздушной среды и как их решили растения и животные. Первая задача: воздух не держит тело. Растения ответили прочным стеблем и древесиной, животные — скелетом и ногами. Вторая задача: вода всё время испаряется. Растения ответили кожицей с восковым налётом и устьицами, которые закрываются, животные — плотными покровами: чешуёй, панцирем, кожей. Третья задача: температура резко меняется. Растения ответили листопадом и зимним покоем, животные — шерстью, перьями, спячкой и перелётом. Внизу подпись: одна и та же задача решена по-разному, потому что решать её начинали с разного устройства.">
  <g class="d-head" font-size="11" font-weight="650" font-family="system-ui, sans-serif">
    <text x="8" y="13">Задача суши</text>
    <text x="16" y="46">У растений</text>
    <text x="176" y="46">У животных</text>
  </g>

  <g class="d-diff-bar">
    <rect x="8" y="20" width="304" height="22" rx="6"/>
    <rect x="8" y="112" width="304" height="22" rx="6"/>
    <rect x="8" y="204" width="304" height="22" rx="6"/>
  </g>
  <g class="d-diff" font-size="12" font-weight="700" font-family="system-ui, sans-serif">
    <text x="16" y="35">Воздух не держит тело</text>
    <text x="16" y="127">Вода всё время испаряется</text>
    <text x="16" y="219">Температура резко меняется</text>
  </g>

  <g class="d-sub">
    <rect x="8" y="52" width="144" height="52" rx="7"/>
    <rect x="8" y="144" width="144" height="52" rx="7"/>
    <rect x="8" y="236" width="144" height="52" rx="7"/>
  </g>
  <g class="d-capsule">
    <rect x="168" y="52" width="144" height="52" rx="7"/>
    <rect x="168" y="144" width="144" height="52" rx="7"/>
    <rect x="168" y="236" width="144" height="52" rx="7"/>
  </g>

  <g class="d-label" font-size="11" font-family="system-ui, sans-serif">
    <text x="16" y="70">прочный стебель,</text>
    <text x="16" y="84">древесина</text>
    <text x="16" y="162">кожица с восковым</text>
    <text x="16" y="176">налётом, устьица</text>
    <text x="16" y="190">закрываются</text>
    <text x="16" y="254">листопад,</text>
    <text x="16" y="268">зимний покой</text>
  </g>
  <g class="d-capsule-t" font-size="11" font-family="system-ui, sans-serif">
    <text x="176" y="70">скелет и ноги,</text>
    <text x="176" y="84">крылья</text>
    <text x="176" y="162">плотные покровы:</text>
    <text x="176" y="176">чешуя, панцирь,</text>
    <text x="176" y="190">кожа</text>
    <text x="176" y="254">шерсть и перья,</text>
    <text x="176" y="268">спячка, перелёт</text>
  </g>
</svg>
