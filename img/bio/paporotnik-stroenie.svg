  <!-- Корневище: подземный побег, а не корень. Оно толще всего на схеме нарочно. -->
  <g class="d-stem" stroke-width="6" fill="none" stroke-linecap="round">
    <path d="M196 280 C222 274 254 274 296 278"/>
    <path d="M251 278 V266"/>
    <path d="M229 277 V266"/>
