<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 276" role="img" aria-label="Строение цветка мотыльковых. Венчик из пяти лепестков с особыми названиями: верхний самый крупный — парус, два боковых — вёсла, два нижних сросшихся образуют лодочку. Внутри лодочки спрятан пестик, вокруг него десять тычинок: у большинства растений нити девяти тычинок срослись в трубку, а одна осталась свободной. Формула цветка Ч(5) Л1,2(2) Т(9),1 П1, плод боб, соцветия кисть и головка. Внизу вывод: цветок неправильный, у него есть верх и низ, и потому насекомое садится на него только одним способом.">
  <g class="d-head" font-size="11" font-weight="650" font-family="system-ui, sans-serif">
    <text x="8" y="14">Цветок мотыльковых: у лепестков свои названия</text>
  </g>

  <!--
    Парус, вёсла и лодочка нарисованы путями, а не эллипсами: правило
    `.d-leaf path` даёт им заливку из темы, а эллипсу пришлось бы добавлять
    своё правило. Один раз на это уже наступили.
  -->
  <g class="d-leaf">
    <path d="M96 92 C96 48 184 48 184 92 C184 100 140 108 140 108 C140 108 96 100 96 92 Z"/>
    <path d="M98 106 C70 106 62 134 92 138 C110 140 128 130 128 118 C128 110 116 106 98 106 Z"/>
    <path d="M182 106 C210 106 218 134 188 138 C170 140 152 130 152 118 C152 110 164 106 182 106 Z"/>
    <path d="M112 136 C112 136 140 130 168 136 C176 162 158 182 140 182 C122 182 104 162 112 136 Z"/>
  </g>

  <!--
    Пестик и тычинки спрятаны в лодочке — потому их и рисуем поверх неё
    просветом. Девять нитей срослись, десятая стоит отдельно: это и есть то,
    что записано в формуле как Т(9),1.
  -->
  <g class="d-stem" fill="none">
    <path d="M140 132 C140 152 142 166 149 176"/>
  </g>
  <g class="d-flow" fill="none">
    <path d="M132 134 C130 152 132 166 138 174"/>
    <path d="M136 134 C134 152 136 166 141 174"/>
    <path d="M144 134 C146 152 145 166 141 174"/>
    <path d="M148 134 C150 152 149 166 144 174"/>
    <path d="M124 132 C118 152 120 168 128 176"/>
  </g>
  <g class="d-stem-end">
    <circle cx="124" cy="131" r="2.6"/>
    <circle cx="132" cy="133" r="2.2"/>
    <circle cx="136" cy="133" r="2.2"/>
    <circle cx="144" cy="133" r="2.2"/>
    <circle cx="148" cy="133" r="2.2"/>
  </g>

  <g class="d-lead" fill="none">
    <path d="M186 70 H244"/>
    <path d="M204 122 H244"/>
    <path d="M170 168 H244"/>
  </g>
  <g class="d-label" font-size="11" font-weight="650" font-family="system-ui, sans-serif">
    <text x="250" y="74">Парус</text>
    <text x="250" y="126">Вёсла</text>
    <text x="250" y="172">Лодочка</text>
  </g>
  <g class="d-row" font-size="9.5" font-family="system-ui, sans-serif">
    <text x="250" y="88">верхний, самый</text>
    <text x="250" y="99">крупный лепесток</text>
    <text x="250" y="140">два боковых</text>
    <text x="250" y="186">два нижних,</text>
    <text x="250" y="197">они сросшиеся</text>
  </g>

  <g class="d-eq-rule">
    <line x1="8" y1="204" x2="352" y2="204"/>
  </g>

  <g class="d-number" font-size="12" font-weight="650" font-family="system-ui, sans-serif">
    <text x="8" y="222">Ч(5) Л1,2(2) Т(9),1 П1</text>
  </g>
  <g class="d-row" font-size="10" font-family="system-ui, sans-serif">
    <text x="8" y="238">Плод — боб. Соцветия: кисть у люпина и донника, головка у клевера.</text>
  </g>

  <g class="d-verdict" font-size="10" font-family="system-ui, sans-serif">
    <text x="8" y="254">Цветок неправильный: у него есть верх и низ,</text>
    <text x="8" y="266">и насекомое садится на него только одним способом.</text>
  </g>
</svg>
