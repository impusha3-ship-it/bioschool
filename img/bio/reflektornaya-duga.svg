<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 440" role="img" aria-label="Путь рефлекса по рефлекторной дуге, семь шагов подряд. Первый: раздражитель — например, горячая плита под рукой. Второй: рецептор переводит раздражение в нервный импульс. Третий: чувствительный нейрон несёт импульс в нервный центр. Четвёртый: вставочный нейрон, то есть нервный центр, переключает импульс на ответ. Пятый: двигательный нейрон несёт команду от центра к органу. Шестой: эффектор, рабочий орган — мышца сокращается или железа выделяет. Седьмой: реакция — рука отдёрнута. Внизу вывод: выключи любое звено, и рефлекса нет, дуга работает только целиком.">
  <g class="d-head" font-size="11.5" font-weight="650" font-family="system-ui, sans-serif">
    <text x="8" y="16">Путь рефлекса</text>
  </g>

  <g class="d-num-circle"><circle cx="24" cy="50" r="13"/></g>
  <text class="d-num-text" x="24" y="54" font-size="12" font-weight="650" text-anchor="middle" font-family="system-ui, sans-serif">1</text>
  <text class="d-row" x="48" y="46" font-size="12" font-weight="650" font-family="system-ui, sans-serif">Раздражитель</text>
  <text class="d-head" x="48" y="62" font-size="11.5" font-family="system-ui, sans-serif">горячая плита под рукой</text>
  <g class="d-stem" stroke-width="2" stroke-linecap="round" fill="none"><path d="M24 66 V78 M18 72 L24 78 L30 72"/></g>

  <g class="d-num-circle"><circle cx="24" cy="102" r="13"/></g>
  <text class="d-num-text" x="24" y="106" font-size="12" font-weight="650" text-anchor="middle" font-family="system-ui, sans-serif">2</text>
  <text class="d-row" x="48" y="98" font-size="12" font-weight="650" font-family="system-ui, sans-serif">Рецептор</text>
  <text class="d-head" x="48" y="114" font-size="11.5" font-family="system-ui, sans-serif">переводит раздражение в импульс</text>
  <g class="d-stem" stroke-width="2" stroke-linecap="round" fill="none"><path d="M24 118 V130 M18 124 L24 130 L30 124"/></g>

  <g class="d-num-circle"><circle cx="24" cy="154" r="13"/></g>
  <text class="d-num-text" x="24" y="158" font-size="12" font-weight="650" text-anchor="middle" font-family="system-ui, sans-serif">3</text>
  <text class="d-row" x="48" y="150" font-size="12" font-weight="650" font-family="system-ui, sans-serif">Чувствительный нейрон</text>
  <text class="d-head" x="48" y="166" font-size="11.5" font-family="system-ui, sans-serif">несёт импульс в нервный центр</text>
  <g class="d-stem" stroke-width="2" stroke-linecap="round" fill="none"><path d="M24 170 V182 M18 176 L24 182 L30 176"/></g>

  <g class="d-num-circle"><circle cx="24" cy="206" r="13"/></g>
  <text class="d-num-text" x="24" y="210" font-size="12" font-weight="650" text-anchor="middle" font-family="system-ui, sans-serif">4</text>
  <text class="d-row" x="48" y="202" font-size="12" font-weight="650" font-family="system-ui, sans-serif">Вставочный нейрон</text>
  <text class="d-head" x="48" y="218" font-size="11.5" font-family="system-ui, sans-serif">нервный центр решает, чем ответить</text>
  <g class="d-stem" stroke-width="2" stroke-linecap="round" fill="none"><path d="M24 222 V234 M18 228 L24 234 L30 228"/></g>

  <g class="d-num-circle"><circle cx="24" cy="258" r="13"/></g>
  <text class="d-num-text" x="24" y="262" font-size="12" font-weight="650" text-anchor="middle" font-family="system-ui, sans-serif">5</text>
  <text class="d-row" x="48" y="254" font-size="12" font-weight="650" font-family="system-ui, sans-serif">Двигательный нейрон</text>
  <text class="d-head" x="48" y="270" font-size="11.5" font-family="system-ui, sans-serif">несёт команду от центра к органу</text>
  <g class="d-stem" stroke-width="2" stroke-linecap="round" fill="none"><path d="M24 274 V286 M18 280 L24 286 L30 280"/></g>

  <g class="d-num-circle"><circle cx="24" cy="310" r="13"/></g>
  <text class="d-num-text" x="24" y="314" font-size="12" font-weight="650" text-anchor="middle" font-family="system-ui, sans-serif">6</text>
  <text class="d-row" x="48" y="306" font-size="12" font-weight="650" font-family="system-ui, sans-serif">Эффектор — рабочий орган</text>
  <text class="d-head" x="48" y="322" font-size="11.5" font-family="system-ui, sans-serif">мышца сокращается, железа выделяет</text>
  <g class="d-stem" stroke-width="2" stroke-linecap="round" fill="none"><path d="M24 326 V338 M18 332 L24 338 L30 332"/></g>

  <g class="d-num-circle"><circle cx="24" cy="362" r="13"/></g>
  <text class="d-num-text" x="24" y="366" font-size="12" font-weight="650" text-anchor="middle" font-family="system-ui, sans-serif">7</text>
  <text class="d-row" x="48" y="358" font-size="12" font-weight="650" font-family="system-ui, sans-serif">Реакция</text>
  <text class="d-head" x="48" y="374" font-size="11.5" font-family="system-ui, sans-serif">рука отдёрнута</text>

  <g class="d-eq-rule">
    <line x1="8" y1="394" x2="312" y2="394"/>
  </g>
  <g class="d-verdict" font-size="11" font-family="system-ui, sans-serif">
    <text x="8" y="412">Выключи любое звено — и рефлекса нет:</text>
    <text x="8" y="428">дуга работает только целиком</text>
  </g>
</svg>
