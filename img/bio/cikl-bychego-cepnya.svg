<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="Круг из шести шагов в жизненном цикле бычьего цепня. Взрослый червь живёт в кишечнике человека: человек здесь окончательный хозяин. Задние членики червя наполняются яйцами, отрываются от тела и выводятся наружу с калом. Яйца попадают на траву пастбища, и корова проглатывает их вместе с травой. В желудке коровы из яиц выходят мелкие личинки с крючьями: они пробуравливают стенку кишки, попадают в кровь и разносятся по телу. В мышцах и внутренних органах коровы личинки превращаются в финны — пузырьки величиной с горошину; корова здесь промежуточный хозяин. Если человек съест недостаточно проваренное или прожаренное мясо, из финны в его кишечнике выворачивается головка с присосками, и круг замыкается. Разорвать этот круг проще всего на кухне: мясо надо как следует проварить или прожарить.">
  <g class="d-head" font-size="11" font-weight="650" font-family="system-ui, sans-serif">
    <text x="8" y="14">Жизненный цикл бычьего цепня</text>
  </g>

  <g class="d-stem" stroke-width="1.8" fill="none">
    <path d="M154 58 H176"/>
    <path d="M310 58 H332"/>
    <path d="M396 96 V162"/>
    <path d="M332 196 H310"/>
    <path d="M170 196 H148"/>
    <path d="M84 162 V102"/>
  </g>
  <g class="d-stem-end">
    <path d="M182 58 L174 54 L174 62 Z"/>
    <path d="M338 58 L330 54 L330 62 Z"/>
    <path d="M396 170 L392 162 L400 162 Z"/>
    <path d="M304 196 L312 192 L312 200 Z"/>
    <path d="M142 196 L150 192 L150 200 Z"/>
    <path d="M84 94 L80 102 L88 102 Z"/>
  </g>

  <g class="d-capsule">
    <rect x="14" y="30" width="140" height="58" rx="8"/>
    <rect x="182" y="30" width="128" height="58" rx="8"/>
    <rect x="338" y="30" width="128" height="58" rx="8"/>
    <rect x="338" y="170" width="128" height="58" rx="8"/>
    <rect x="176" y="170" width="128" height="58" rx="8"/>
    <rect x="14" y="170" width="128" height="58" rx="8"/>
  </g>

  <g class="d-capsule-t" font-size="12" font-family="system-ui, sans-serif">
    <text x="26" y="50">Взрослый цепень</text>
    <text x="194" y="50">Членики с яйцами</text>
    <text x="350" y="50">Яйца на траве</text>
    <text x="350" y="190">Личинки с крючьями</text>
    <text x="188" y="190">Финны в мышцах</text>
    <text x="26" y="190">Сырое мясо</text>
  </g>
  <g class="d-label" font-size="10" font-family="system-ui, sans-serif">
    <text x="26" y="66">в кишечнике человека</text>
    <text x="26" y="78">окончательный хозяин</text>
    <text x="194" y="66">отрываются и выходят</text>
    <text x="194" y="78">наружу с калом</text>
    <text x="350" y="66">корова глотает их</text>
    <text x="350" y="78">вместе с травой</text>
    <text x="350" y="204">выходят в желудке,</text>
    <text x="350" y="216">с кровью — в мышцы</text>
    <text x="188" y="204">пузырьки с горошину</text>
    <text x="188" y="216">корова — промежуточный</text>
    <text x="26" y="204">человек съел мясо,</text>
    <text x="26" y="216">из финны — головка</text>
  </g>

  <!-- Единственное место, где круг рвётся без лекарств. -->
  <g class="d-warn" stroke-width="1.4" fill="none">
    <path d="M240 232 V248"/>
  </g>
  <g class="d-warn-t" font-size="11" font-weight="650" text-anchor="middle" font-family="system-ui, sans-serif">
    <text x="240" y="262">Круг рвётся на кухне: мясо надо проварить или прожарить</text>
  </g>

  <g class="d-label" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">
    <text x="240" y="282">У печёночного сосальщика промежуточный хозяин — малый прудовик.</text>
  </g>
</svg>
