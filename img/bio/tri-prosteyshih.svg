<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 330" role="img" aria-label="Сравнение трёх простейших по одним и тем же вопросам. Амёба протей: движется ложноножками, пищу захватывает ими же в любом месте клетки, непереваренные остатки удаляет в любом месте, ядро одно, форма тела непостоянная. Бодо: движется двумя жгутиками, один тянет вперёд, второй работает рулём; пища подгоняется потоком воды к клеточному рту, остатки выходят через тот же рот, ядро одно, форма овальная постоянная. Инфузория-туфелька: движется множеством ресничек, пища загоняется ими в клеточный рот, остатки выходят через особое отверстие — порошицу, ядра два, большое и малое, форма постоянная. Внизу вывод: от амёбы к инфузории у клетки появляются постоянные места для каждой работы — рот отдельно, выход отдельно, и это и есть усложнение.">
  <g class="d-head" font-size="11.5" font-weight="650" font-family="system-ui, sans-serif">
    <text x="8" y="14">Три простейших: одни вопросы, разные ответы</text>
  </g>

  <g class="d-capsule">
    <rect x="96" y="22" width="70" height="22" rx="5"/>
    <rect x="172" y="22" width="66" height="22" rx="5"/>
    <rect x="244" y="22" width="68" height="22" rx="5"/>
  </g>
  <g class="d-capsule-t" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">
    <text x="131" y="37">Амёба</text>
    <text x="205" y="37">Бодо</text>
    <text x="278" y="37">Туфелька</text>
  </g>

  <g class="d-label" font-size="11" font-weight="650" font-family="system-ui, sans-serif">
    <text x="8" y="62">Движется</text>
    <text x="8" y="106">Ест</text>
    <text x="8" y="150">Остатки</text>
    <text x="8" y="194">Ядер</text>
    <text x="8" y="222">Форма</text>
  </g>

  <g class="d-row" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">
    <text x="131" y="62">ложно-</text>
    <text x="131" y="76">ножками</text>
    <text x="205" y="62">двумя</text>
    <text x="205" y="76">жгутиками</text>
    <text x="278" y="62">ресничками</text>
    <text x="278" y="76">по всему телу</text>

    <text x="131" y="106">ложноножкой</text>
    <text x="131" y="120">где придётся</text>
    <text x="205" y="106">поток воды</text>
    <text x="205" y="120">ко рту</text>
    <text x="278" y="106">реснички</text>
    <text x="278" y="120">гонят в рот</text>

    <text x="131" y="150">в любом</text>
    <text x="131" y="164">месте</text>
    <text x="205" y="150">через тот</text>
    <text x="205" y="164">же рот</text>
    <text x="278" y="150">через</text>
    <text x="278" y="164">порошицу</text>

    <text x="131" y="194">одно</text>
    <text x="205" y="194">одно</text>
    <text x="278" y="194">два</text>

    <text x="131" y="222">меняется</text>
    <text x="205" y="222">овальная</text>
    <text x="278" y="222">постоянная</text>
  </g>

  <g class="d-grid">
    <line x1="8" y1="86" x2="312" y2="86"/>
    <line x1="8" y1="130" x2="312" y2="130"/>
    <line x1="8" y1="174" x2="312" y2="174"/>
    <line x1="8" y1="204" x2="312" y2="204"/>
  </g>

  <g class="d-eq-rule">
    <line x1="8" y1="238" x2="312" y2="238"/>
  </g>

  <g class="d-verdict" font-size="11" font-family="system-ui, sans-serif">
    <text x="8" y="258">Слева направо у клетки появляются постоянные</text>
    <text x="8" y="272">места для работы: сначала еда попадает внутрь</text>
    <text x="8" y="286">где угодно, потом появляется рот, а у туфельки</text>
    <text x="8" y="300">ещё и отдельный выход — порошица.</text>
  </g>
  <g class="d-row" font-size="11" font-family="system-ui, sans-serif">
    <text x="8" y="322">Это и есть усложнение внутри одной группы.</text>
  </g>
</svg>
