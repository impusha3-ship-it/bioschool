<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 312" role="img" aria-label="Строение злака. Стебель злака называют соломиной: междоузлия у него полые, а узлы заполнены тканями, поэтому узел заметно толще. Выше узла основание листа охватывает стебель трубкой — это влагалище, оно защищает делящиеся клетки в основании междоузлия. В том месте, где листовая пластинка отходит от влагалища, сидит плёнчатый вырост язычок: он не пускает воду между стеблем и влагалищем. Лист узкий и длинный, жилкование параллельное. Формула цветка О в скобках два плюс два, Т три, П один: околоцветник из двух цветковых чешуй и двух цветковых плёнок, три тычинки и один пестик. Внизу вывод: плод злака зерновка, у неё околоплодник сросся с семенной кожурой.">
  <g class="d-head" font-size="11.5" font-weight="650" font-family="system-ui, sans-serif">
    <text x="8" y="14">Злак: соломина, влагалище, язычок</text>
  </g>

  <!-- Стебель. Узлы нарисованы утолщениями: в этом и признак. -->
  <g class="d-stem" fill="none">
    <path d="M56 218 V52"/>
  </g>

  <!--
    Влагалище: трубка вокруг стебля выше узла. Нарисовано капсулой поверх
    стебля — стебель под ним не разрывается, потому что влагалище его именно
    охватывает, а не заменяет.
  -->
  <g class="d-capsule">
    <rect x="48" y="104" width="16" height="36" rx="5"/>
  </g>

  <!-- Узлы рисуются после влагалища: иначе трубка закрывает утолщение. -->
  <g class="d-stem-end">
    <ellipse cx="56" cy="200" rx="7" ry="3.4"/>
    <ellipse cx="56" cy="140" rx="7" ry="3.4"/>
  </g>

  <!-- Язычок — плёнчатый вырост в месте отхождения пластинки. -->
  <g class="d-leaf">
    <path d="M64 104 L77 99 L64 96 Z"/>
    <path d="M64 102 C88 95 108 84 128 66 C110 88 92 99 66 110 Z"/>
  </g>

  <g class="d-lead" fill="none">
    <path d="M60 170 H164"/>
    <path d="M66 124 H164"/>
    <path d="M70 94 V40 H164"/>
  </g>

  <g class="d-label" font-size="11.5" font-weight="650" font-family="system-ui, sans-serif">
    <text x="170" y="44">Язычок</text>
    <text x="170" y="128">Влагалище</text>
    <text x="170" y="174">Соломина</text>
  </g>
  <g class="d-row" font-size="11" font-family="system-ui, sans-serif">
    <text x="170" y="60">не пускает воду</text>
    <text x="170" y="74">под влагалище</text>
    <text x="170" y="144">трубка вокруг</text>
    <text x="170" y="158">стебля выше узла</text>
    <text x="170" y="190">междоузлия полые,</text>
    <text x="170" y="204">узлы заполнены</text>
  </g>

  <g class="d-eq-rule">
    <line x1="8" y1="228" x2="312" y2="228"/>
  </g>

  <g class="d-number" font-size="13" font-weight="650" font-family="system-ui, sans-serif">
    <text x="8" y="248">О(2)+2 Т3 П1</text>
  </g>
  <g class="d-row" font-size="11" font-family="system-ui, sans-serif">
    <text x="8" y="266">Две цветковые чешуи и две плёнки,</text>
    <text x="8" y="280">три тычинки, один пестик.</text>
  </g>

  <g class="d-verdict" font-size="11" font-family="system-ui, sans-serif">
    <text x="8" y="302">Плод — зерновка: околоплодник сросся с кожурой.</text>
  </g>
</svg>
