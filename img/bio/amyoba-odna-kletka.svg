<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 336" role="img" aria-label="Амёба протей: одна клетка делает всё, что делает организм. Справа рисунок амёбы с несколькими ложноножками. Ложноножка — вырост цитоплазмы: им амёба и передвигается, и захватывает пищу. Пищеварительная вакуоль — пузырёк, в котором переваривается захваченная частица; это внутриклеточное пищеварение. Сократительная вакуоль периодически наполняется и выбрасывает наружу лишнюю воду с ненужными веществами, а заодно участвует в дыхании, потому что поступающая вода несёт кислород. Ядро управляет клеткой и делится первым при размножении. Внизу вывод: у многоклеточного животного на каждую из этих работ есть своя система органов, а у амёбы всё это делает одна клетка с несколькими органеллами.">
  <g class="d-head" font-size="11.5" font-weight="650" font-family="system-ui, sans-serif">
    <text x="8" y="14">Амёба: одна клетка вместо всех систем</text>
  </g>

  <!--
    Тело рисуется неровным контуром с выростами: постоянной формы у амёбы
    нет, и это не художественная вольность, а признак типа Корненожки.
  -->
  <g class="d-sub">
    <path d="M196 46 C218 32 236 50 252 44 C270 38 280 54 270 70 C288 74 292 96 276 104 C284 120 270 136 252 130 C244 148 222 148 214 132 C194 140 178 124 186 106 C168 100 166 76 184 70 C180 58 188 48 196 46 Z"/>
  </g>
  <g class="d-stem-end">
    <circle cx="228" cy="86" r="9"/>
  </g>
  <g class="d-capsule">
    <circle cx="256" cy="102" r="10"/>
    <circle cx="202" cy="70" r="8"/>
  </g>
  <g class="d-stem-end">
    <circle cx="254" cy="100" r="2"/>
    <circle cx="259" cy="105" r="2"/>
  </g>

  <g class="d-lead" fill="none">
    <path d="M219 86 H150"/>
    <path d="M194 70 C176 66 168 56 150 52"/>
    <path d="M266 102 C280 130 200 136 150 122"/>
    <path d="M186 122 C176 140 164 150 150 156"/>
  </g>

  <g class="d-label" font-size="11" font-weight="650" text-anchor="end" font-family="system-ui, sans-serif">
    <text x="146" y="50">Пищеварительная</text>
    <text x="146" y="90">Ядро</text>
    <text x="146" y="126">Сократительная</text>
    <text x="146" y="160">Ложноножка</text>
  </g>
  <g class="d-row" font-size="11" text-anchor="end" font-family="system-ui, sans-serif">
    <text x="146" y="64">вакуоль: тут еда</text>
    <text x="146" y="78">переваривается</text>
    <text x="146" y="104">управляет клеткой</text>
    <text x="146" y="140">вакуоль: лишняя вода</text>
    <text x="146" y="174">движение и захват</text>
  </g>

  <g class="d-eq-rule">
    <line x1="8" y1="192" x2="312" y2="192"/>
  </g>

  <g class="d-label" font-size="11" font-weight="650" font-family="system-ui, sans-serif">
    <text x="8" y="210">Та же работа у многоклеточного</text>
  </g>
  <g class="d-row" font-size="11" font-family="system-ui, sans-serif">
    <text x="8" y="228">движение — мышцы и скелет</text>
    <text x="8" y="242">питание — пищеварительная система</text>
    <text x="8" y="256">выделение — почки и мочеточники</text>
    <text x="8" y="270">управление — нервная система</text>
  </g>

  <g class="d-verdict" font-size="11" font-family="system-ui, sans-serif">
    <text x="8" y="296">У амёбы на всё это одна клетка и несколько</text>
    <text x="8" y="310">органелл. Делить работу между клетками не с кем:</text>
    <text x="8" y="324">клетка всего одна.</text>
  </g>
</svg>
