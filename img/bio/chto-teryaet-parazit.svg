<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 288" role="img" aria-label="Что теряет и что приобретает обитатель другого организма. Теряет: глаза, потому что внутри темно; способность искать еду, потому что она вокруг; иногда даже органы пищеварения; способность самому переходить с места на место. Приобретает: крючки и присоски, чтобы удержаться; плотные покровы, чтобы не перевариться; огромное количество яиц, потому что почти все погибнут; сложный путь развития через нескольких хозяев. Внизу подпись: устройство упростилось не от слабости, а потому что среда сняла часть задач и поставила другие.">
  <g class="d-head" font-size="11" font-weight="650" font-family="system-ui, sans-serif">
    <text x="8" y="14">Теряет — стало не нужно</text>
    <text x="168" y="14">Приобретает — нужно</text>
  </g>

  <g class="d-sub">
    <rect x="8" y="22" width="144" height="182" rx="8"/>
  </g>
  <g class="d-capsule">
    <rect x="168" y="22" width="144" height="182" rx="8"/>
  </g>

  <g class="d-no" stroke-width="2.5" stroke-linecap="round" fill="none">
    <path d="M18 44 h12"/>
    <path d="M18 88 h12"/>
    <path d="M18 132 h12"/>
    <path d="M18 176 h12"/>
  </g>
  <g class="d-yes" stroke-width="2.5" stroke-linecap="round" fill="none">
    <path d="M178 40 l4 5 l9 -11"/>
    <path d="M178 84 l4 5 l9 -11"/>
    <path d="M178 128 l4 5 l9 -11"/>
    <path d="M178 172 l4 5 l9 -11"/>
  </g>

  <g class="d-vague" font-size="11" font-family="system-ui, sans-serif">
    <text x="38" y="42">Глаза</text>
    <text x="38" y="56">внутри темно</text>
    <text x="38" y="86">Поиск еды</text>
    <text x="38" y="100">она вокруг</text>
    <text x="38" y="130">Иногда кишечник</text>
    <text x="38" y="144">пища уже готова</text>
    <text x="38" y="174">Свои переходы</text>
    <text x="38" y="188">возит хозяин</text>
  </g>

  <g class="d-capsule-t" font-size="11" font-family="system-ui, sans-serif">
    <text x="192" y="42">Крючки и присоски</text>
    <text x="192" y="56">чтобы удержаться</text>
    <text x="192" y="86">Плотные покровы</text>
    <text x="192" y="100">чтобы не перевариться</text>
    <text x="192" y="130">Множество яиц</text>
    <text x="192" y="144">почти все погибнут</text>
    <text x="192" y="174">Смена хозяев</text>
    <text x="192" y="188">чтобы попасть дальше</text>
  </g>

  <g class="d-verdict" font-size="12" font-family="system-ui, sans-serif">
    <text x="8" y="234">Устройство упростилось не от слабости.</text>
    <text x="8" y="248">Среда сняла часть задач — и органы, решавшие их,</text>
    <text x="8" y="262">исчезли за ненадобностью. Взамен она поставила</text>
    <text x="8" y="276">другие задачи, и на них появились свои ответы.</text>
  </g>
</svg>
