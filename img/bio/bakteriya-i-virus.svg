<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 268" role="img" aria-label="Сравнение бактерии и вируса по признакам живого. Клеточное строение: у бактерии есть, у вируса нет. Питание: у бактерии есть, у вируса нет. Дыхание: у бактерии есть, у вируса нет. Рост: у бактерии есть, у вируса нет. Размножение: бактерия размножается сама, вирус только внутри чужой клетки, со звёздочкой. Итог: бактерия живая, вирус — спорный случай. Внизу подпись: вирус набирает один признак из пяти, и тот с оговоркой, поэтому вопрос, живой ли он, до сих пор обсуждается.">
  <g class="d-head" font-size="11" font-weight="650" font-family="system-ui, sans-serif">
    <text x="8" y="14">Признак живого</text>
    <text x="158" y="14">Бактерия</text>
    <text x="240" y="14">Вирус</text>
  </g>

  <g class="d-grid">
    <line x1="8" y1="22" x2="312" y2="22"/>
    <line x1="8" y1="50" x2="312" y2="50"/>
    <line x1="8" y1="78" x2="312" y2="78"/>
    <line x1="8" y1="106" x2="312" y2="106"/>
    <line x1="8" y1="134" x2="312" y2="134"/>
    <line x1="8" y1="176" x2="312" y2="176"/>
  </g>

  <g class="d-row" font-size="12" font-family="system-ui, sans-serif">
    <text x="8" y="40">Клеточное строение</text>
    <text x="8" y="68">Питание</text>
    <text x="8" y="96">Дыхание</text>
    <text x="8" y="124">Рост</text>
    <text x="8" y="152">Размножение</text>
  </g>

  <g class="d-yes" stroke-width="2.5" stroke-linecap="round" fill="none">
    <path d="M172 36 l5 6 l10 -13"/>
    <path d="M172 64 l5 6 l10 -13"/>
    <path d="M172 92 l5 6 l10 -13"/>
    <path d="M172 120 l5 6 l10 -13"/>
    <path d="M172 148 l5 6 l10 -13"/>
  </g>

  <g class="d-no" stroke-width="2.5" stroke-linecap="round" fill="none">
    <path d="M250 36 h14"/>
    <path d="M250 64 h14"/>
    <path d="M250 92 h14"/>
    <path d="M250 120 h14"/>
  </g>
  <g class="d-warn" stroke-width="2.5" stroke-linecap="round" fill="none">
    <path d="M250 148 l5 6 l10 -13"/>
  </g>
  <g class="d-warn-t" font-size="11" font-weight="700" font-family="system-ui, sans-serif">
    <text x="268" y="152">*</text>
    <text x="8" y="168">* только внутри чужой клетки, сам по себе не может</text>
  </g>

  <g class="d-verdict" font-size="12" font-weight="700" font-family="system-ui, sans-serif">
    <text x="8" y="196">Итог</text>
    <text x="158" y="196">Живая</text>
  </g>
  <g class="d-diff" font-size="12" font-weight="700" font-family="system-ui, sans-serif">
    <text x="240" y="196">Спорно</text>
  </g>

  <g class="d-verdict" font-size="12" font-family="system-ui, sans-serif">
    <text x="8" y="228">Вирус набирает один признак из пяти, и тот</text>
    <text x="8" y="242">с оговоркой. Поэтому вопрос, живой ли он,</text>
    <text x="8" y="256">учёные не закрыли до сих пор.</text>
  </g>
</svg>
