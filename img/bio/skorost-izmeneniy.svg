<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 300" role="img" aria-label="Что человек менял в природе и с какой скоростью. Охота, десятки тысяч лет назад: исчезли мамонт и шерстистый носорог. Земледелие, около десяти тысяч лет назад: леса вырублены под поля, степи распаханы. Промышленность, последние двести лет: загрязнение воздуха и воды, добыча полезных ископаемых. Последние пятьдесят лет: изменений больше, чем за всю прежнюю историю. Внизу подпись: природные изменения идут тысячелетиями, и организмы успевают к ним приспособиться, а человеческие — за десятилетия, и приспособиться уже нельзя.">
  <g class="d-head" font-size="11" font-weight="650" font-family="system-ui, sans-serif">
    <text x="8" y="14">Когда</text>
    <text x="128" y="14">Что человек изменил</text>
  </g>

  <g class="d-grid">
    <line x1="8" y1="20" x2="312" y2="20"/>
    <line x1="8" y1="66" x2="312" y2="66"/>
    <line x1="8" y1="112" x2="312" y2="112"/>
    <line x1="8" y1="158" x2="312" y2="158"/>
    <line x1="8" y1="204" x2="312" y2="204"/>
  </g>

  <g class="d-row" font-size="11" font-weight="650" font-family="system-ui, sans-serif">
    <text x="8" y="38">Охота</text>
    <text x="8" y="84">Земледелие</text>
    <text x="8" y="130">Заводы</text>
    <text x="8" y="176">Сейчас</text>
  </g>
  <g class="d-same" font-size="10" font-family="system-ui, sans-serif">
    <text x="8" y="52">40 000 лет</text>
    <text x="8" y="98">10 000 лет</text>
    <text x="8" y="144">200 лет</text>
    <text x="8" y="190">50 лет</text>
  </g>

  <g class="d-label" font-size="11" font-family="system-ui, sans-serif">
    <text x="128" y="38">исчезли мамонт</text>
    <text x="128" y="52">и шерстистый носорог</text>
    <text x="128" y="84">леса вырублены под поля,</text>
    <text x="128" y="98">степи распаханы</text>
    <text x="128" y="130">загрязнение воздуха</text>
    <text x="128" y="144">и воды, добыча недр</text>
  </g>
  <g class="d-diff" font-size="11" font-weight="700" font-family="system-ui, sans-serif">
    <text x="128" y="176">изменений больше, чем</text>
    <text x="128" y="190">за всю прежнюю историю</text>
  </g>

  <g class="d-head" font-size="11" font-weight="650" font-family="system-ui, sans-serif">
    <text x="8" y="224">Скорость изменений</text>
  </g>
  <g class="d-bar-most">
    <rect x="8" y="232" width="180" height="12" rx="3"/>
  </g>
  <g class="d-bar-few">
    <rect x="8" y="250" width="14" height="12" rx="3"/>
  </g>
  <g class="d-same" font-size="10" font-family="system-ui, sans-serif">
    <text x="194" y="242">природные: тысячи лет</text>
  </g>
  <g class="d-diff" font-size="10" font-weight="700" font-family="system-ui, sans-serif">
    <text x="28" y="260">человеческие: десятилетия</text>
  </g>

  <g class="d-verdict" font-size="12" font-family="system-ui, sans-serif">
    <text x="8" y="284">К медленным изменениям организмы успевают</text>
    <text x="8" y="298">приспособиться. К быстрым — уже нет.</text>
  </g>
</svg>
