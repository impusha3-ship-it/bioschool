<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 322" role="img" aria-label="Сравнение семейств Крестоцветные и Розоцветные по строению цветка и плоду. У крестоцветных четыре чашелистика, четыре лепестка, расположенных крестом, шесть тычинок — четыре длинные и две короткие — и один пестик; формула цветка Ч4 Л4 Т4+2 П1; соцветие кисть; плод стручок или стручочек. У розоцветных пять чашелистиков, пять лепестков, тычинок много и пестиков от одного до нескольких десятков; формула Ч5 Л5 Т много П много; плод костянка, яблоко, многоорешек или многокостянка. Внизу вывод: считать надо лепестки и тычинки, потому что у крестоцветных их всегда четыре и шесть, а у розоцветных пять и много.">
  <g class="d-head" font-size="11" font-weight="650" font-family="system-ui, sans-serif">
    <text x="8" y="14">Что считать в цветке, чтобы узнать семейство</text>
  </g>

  <g class="d-capsule">
    <rect x="14" y="26" width="216" height="24" rx="6"/>
    <rect x="250" y="26" width="216" height="24" rx="6"/>
  </g>
  <g class="d-capsule-t" font-size="13" text-anchor="middle" font-family="system-ui, sans-serif">
    <text x="122" y="43">Крестоцветные</text>
    <text x="358" y="43">Розоцветные</text>
  </g>

  <!--
    Лепестки крестоцветных стоят крестом — по этому признаку семейство и
    названо. У розоцветных их пять и они идут по кругу.
  -->
  <g class="d-leaf">
    <ellipse cx="122" cy="83" rx="13" ry="22"/>
    <ellipse cx="122" cy="131" rx="13" ry="22"/>
    <ellipse cx="98" cy="107" rx="22" ry="13"/>
    <ellipse cx="146" cy="107" rx="22" ry="13"/>

    <ellipse cx="358" cy="83" rx="11" ry="20"/>
    <ellipse cx="380.8" cy="99.6" rx="11" ry="20" transform="rotate(72 380.8 99.6)"/>
    <ellipse cx="372.1" cy="126.4" rx="11" ry="20" transform="rotate(144 372.1 126.4)"/>
    <ellipse cx="343.9" cy="126.4" rx="11" ry="20" transform="rotate(216 343.9 126.4)"/>
    <ellipse cx="335.2" cy="99.6" rx="11" ry="20" transform="rotate(288 335.2 99.6)"/>
  </g>

  <!--
    Тычинки нарисованы поштучно намеренно: их можно пересчитать, и в этом
    весь признак. Слева ровно шесть, справа четырнадцать — уже «много».
  -->
  <g class="d-stem-end">
    <circle cx="122" cy="95" r="2.4"/>
    <circle cx="134" cy="107" r="2.4"/>
    <circle cx="122" cy="119" r="2.4"/>
    <circle cx="110" cy="107" r="2.4"/>
    <circle cx="113.5" cy="98.5" r="2.4"/>
    <circle cx="130.5" cy="115.5" r="2.4"/>

    <circle cx="358" cy="93" r="2.2"/>
    <circle cx="364" cy="94.5" r="2.2"/>
    <circle cx="369" cy="98.5" r="2.2"/>
    <circle cx="372" cy="104" r="2.2"/>
    <circle cx="372" cy="110" r="2.2"/>
    <circle cx="369" cy="115.5" r="2.2"/>
    <circle cx="364" cy="119.5" r="2.2"/>
    <circle cx="358" cy="121" r="2.2"/>
    <circle cx="352" cy="119.5" r="2.2"/>
    <circle cx="347" cy="115.5" r="2.2"/>
    <circle cx="344" cy="110" r="2.2"/>
    <circle cx="344" cy="104" r="2.2"/>
    <circle cx="347" cy="98.5" r="2.2"/>
    <circle cx="352" cy="94.5" r="2.2"/>
  </g>
  <g class="d-sub">
    <circle cx="122" cy="107" r="6"/>
    <circle cx="358" cy="107" r="6"/>
  </g>

  <g class="d-label" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">
    <text x="122" y="152">4 лепестка крестом, 6 тычинок</text>
    <text x="358" y="152">5 лепестков по кругу, тычинок много</text>
  </g>

  <g class="d-number" font-size="12" font-weight="650" text-anchor="middle" font-family="system-ui, sans-serif">
    <text x="122" y="174">Ч4 Л4 Т4+2 П1</text>
    <text x="358" y="174">Ч5 Л5 Т(много) П(много)</text>
  </g>

  <g class="d-eq-rule">
    <line x1="8" y1="188" x2="472" y2="188"/>
  </g>

  <g class="d-row" font-size="10" font-family="system-ui, sans-serif">
    <text x="14" y="206">Пестик один</text>
    <text x="250" y="206">Пестиков от одного до нескольких десятков</text>
    <text x="14" y="224">Соцветие — кисть</text>
    <text x="250" y="224">Соцветия разные</text>
  </g>

  <g class="d-eq-rule">
    <line x1="8" y1="236" x2="472" y2="236"/>
  </g>

  <g class="d-head" font-size="10" font-weight="650" font-family="system-ui, sans-serif">
    <text x="14" y="254">Плод</text>
    <text x="250" y="254">Плод</text>
  </g>
  <g class="d-row" font-size="10" font-family="system-ui, sans-serif">
    <text x="14" y="270">стручок или стручочек</text>
    <text x="250" y="270">костянка, яблоко, многоорешек,</text>
    <text x="250" y="284">многокостянка</text>
  </g>

  <g class="d-verdict" font-size="10" font-family="system-ui, sans-serif">
    <text x="8" y="306">Считать надо лепестки и тычинки: у крестоцветных их всегда 4 и 6,</text>
    <text x="8" y="318">у розоцветных — 5 и много. Плод только подтверждает.</text>
  </g>
</svg>
