<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="Круг из шести шагов развития морского гидроидного полипа обелии. Колония обелии — кустик из полипов на общем стебельке, кишечные полости полипов соединены, поэтому добыча одного кормит всю колонию. На отдельных стебельках колонии отпочковываются маленькие медузы. Медуза отделяется и живёт самостоятельно, свободно плавая: это половое поколение. Медузы раздельнополы, одни образуют мужские половые клетки, другие женские, и оплодотворение происходит в воде. Из оплодотворённой яйцеклетки развивается планула — личинка со жгутиками; она плавает, а потом оседает на дно. Планула растёт и превращается в молодого полипа, он начинает почковаться и образует новую колонию, круг замыкается. Вывод: бесполое поколение здесь — полип, половое — медуза, и это называют чередованием поколений.">
  <g class="d-head" font-size="11" font-weight="650" font-family="system-ui, sans-serif">
    <text x="8" y="14">Чередование поколений у обелии</text>
  </g>

  <g class="d-stem" stroke-width="1.8" fill="none">
    <path d="M154 58 H176"/>
    <path d="M310 58 H332"/>
    <path d="M396 96 V162"/>
    <path d="M332 196 H310"/>
    <path d="M170 196 H148"/>
    <path d="M84 162 V102"/>
  </g>
  <g class="d-stem-end">
    <path d="M182 58 L174 54 L174 62 Z"/>
    <path d="M338 58 L330 54 L330 62 Z"/>
    <path d="M396 170 L392 162 L400 162 Z"/>
    <path d="M304 196 L312 192 L312 200 Z"/>
    <path d="M142 196 L150 192 L150 200 Z"/>
    <path d="M84 94 L80 102 L88 102 Z"/>
  </g>

  <g class="d-capsule">
    <rect x="14" y="30" width="140" height="58" rx="8"/>
    <rect x="182" y="30" width="128" height="58" rx="8"/>
    <rect x="338" y="30" width="128" height="58" rx="8"/>
    <rect x="338" y="170" width="128" height="58" rx="8"/>
    <rect x="176" y="170" width="128" height="58" rx="8"/>
    <rect x="14" y="170" width="128" height="58" rx="8"/>
  </g>

  <g class="d-capsule-t" font-size="12" font-family="system-ui, sans-serif">
    <text x="26" y="50">Колония обелии</text>
    <text x="194" y="50">Почка-медуза</text>
    <text x="350" y="50">Медуза уплыла</text>
    <text x="350" y="190">Оплодотворение</text>
    <text x="188" y="190">Планула</text>
    <text x="26" y="190">Молодой полип</text>
  </g>
  <g class="d-label" font-size="10" font-family="system-ui, sans-serif">
    <text x="26" y="66">кустик полипов, полости</text>
    <text x="26" y="78">соединены — едят все</text>
    <text x="194" y="66">на стебельках колонии</text>
    <text x="194" y="78">почкуются медузы</text>
    <text x="350" y="66">плавает сама, это</text>
    <text x="350" y="78">половое поколение</text>
    <text x="350" y="204">медузы раздельнополы,</text>
    <text x="350" y="216">оплодотворение в воде</text>
    <text x="188" y="204">личинка со жгутиками,</text>
    <text x="188" y="216">плавает и оседает</text>
    <text x="26" y="204">вырос из планулы</text>
    <text x="26" y="216">и начал почковаться</text>
  </g>

  <!-- Единственное, ради чего круг и нарисован: два поколения сменяют друг друга. -->
  <g class="d-warn" stroke-width="1.4" fill="none">
    <path d="M240 232 V248"/>
  </g>
  <g class="d-warn-t" font-size="11" font-weight="650" text-anchor="middle" font-family="system-ui, sans-serif">
    <text x="240" y="262">Бесполое поколение — полип, половое — медуза</text>
  </g>

  <g class="d-label" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">
    <text x="240" y="282">У сцифоидных наоборот: медуза живёт долго, а полип скоротечен.</text>
  </g>
</svg>
