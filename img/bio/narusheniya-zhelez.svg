<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 373" role="img" aria-label="Таблица из трёх столбцов: железа, что в её работе нарушено и какая болезнь из этого выходит. Гипофиз: мало гормона роста в детстве — гипофизарная карликовость; избыток в детстве — гипофизарный гигантизм; избыток у взрослого, когда рост уже прекратился, — акромегалия, при которой разрастаются нос, губы и пальцы. Щитовидная железа: мало гормона в детстве — кретинизм с малым ростом и отставанием в развитии; мало у взрослого — микседема с отёками, слабостью и вялостью; избыток гормона — базедова болезнь с пучеглазием и потерей веса. Поджелудочная железа: мало инсулина — сахарный диабет; слишком много инсулина — инсулиновый шок. Надпочечники: нарушение работы — аддисонова, или бронзовая, болезнь. Внизу вывод: и недостаток, и избыток одного и того же гормона дают болезнь, поэтому важно не количество само по себе, а точная мера." >
  <g class="d-head" font-size="11" font-weight="650" font-family="system-ui, sans-serif">
    <text x="8" y="14">Что бывает, когда железа работает не так</text>
  </g>
  <g class="d-capsule-t" font-size="11" font-weight="650" font-family="system-ui, sans-serif">
    <text x="8" y="46">Железа</text>
    <text x="114" y="46">Что нарушено</text>
    <text x="268" y="46">Болезнь</text>
  </g>
  <g class="d-grid">
    <line x1="8" y1="54" x2="472" y2="54"/>
    <line x1="8" y1="144" x2="472" y2="144"/>
    <line x1="8" y1="225" x2="472" y2="225"/>
    <line x1="8" y1="279" x2="472" y2="279"/>
    <line x1="106" y1="54" x2="106" y2="306"/>
    <line x1="260" y1="54" x2="260" y2="306"/>
  </g>
  <g class="d-capsule-t" font-size="10" font-family="system-ui, sans-serif">
    <text x="8" y="72">Гипофиз</text>
    <text x="8" y="153">Щитовидная</text>
    <text x="8" y="234">Поджелудочная</text>
    <text x="8" y="288">Надпочечники</text>
  </g>
  <g class="d-label" font-size="10" font-family="system-ui, sans-serif">
    <text x="114" y="72">мало гормона роста в детстве</text>
    <text x="114" y="99">избыток в детстве</text>
    <text x="114" y="126">избыток у взрослого</text>
    <text x="114" y="153">мало гормона в детстве</text>
    <text x="114" y="180">мало у взрослого</text>
    <text x="114" y="207">избыток гормона</text>
    <text x="114" y="234">мало инсулина</text>
    <text x="114" y="261">слишком много инсулина</text>
    <text x="114" y="288">нарушение работы</text>
  </g>
  <g class="d-simp-t" font-size="10" font-family="system-ui, sans-serif">
    <text x="268" y="72">гипофизарная карликовость</text>
    <text x="268" y="99">гипофизарный гигантизм</text>
    <text x="268" y="126">акромегалия: растут нос, губы, пальцы</text>
    <text x="268" y="153">кретинизм: малый рост, отставание</text>
    <text x="268" y="180">микседема: отёки, слабость, вялость</text>
    <text x="268" y="207">базедова болезнь: пучеглазие, потеря веса</text>
    <text x="268" y="234">сахарный диабет</text>
    <text x="268" y="261">инсулиновый шок</text>
    <text x="268" y="288">аддисонова (бронзовая) болезнь</text>
  </g>
  <g class="d-warn" stroke-width="1.4" fill="none">
    <path d="M240 317 V329"/>
  </g>
  <g class="d-warn-t" font-size="11" font-weight="650" text-anchor="middle" font-family="system-ui, sans-serif">
    <text x="240" y="345">Болезнь даёт и недостаток, и избыток одного и того же гормона</text>
  </g>
  <g class="d-label" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">
    <text x="240" y="363">Важно не количество само по себе, а точная мера.</text>
  </g>
</svg>
