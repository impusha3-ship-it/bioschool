<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 232" role="img" aria-label="Схема процесса в зелёном листе. Слева два входа: углекислый газ и вода — от них стрелки идут к листу. Сверху на лист падают лучи солнца. Справа два выхода: от листа отходят стрелки к кислороду и к органическим веществам. Название самого процесса на схеме не подписано.">
  <g class="d-head" font-size="11" font-weight="650" font-family="system-ui, sans-serif">
    <text x="8" y="14">Что происходит в зелёном листе</text>
  </g>

  <g class="d-sun">
    <circle cx="160" cy="46" r="15"/>
  </g>
  <g class="d-light" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M160 65 V80"/>
    <path d="M142 62 L134 76"/>
    <path d="M178 62 L186 76"/>
  </g>

  <g class="d-leaf-blade">
    <path d="M160 88 C196 96 208 118 196 140 C172 152 140 146 130 126 C124 108 138 92 160 88 z"/>
  </g>
  <g class="d-leaf-vein" stroke-width="1.4" stroke-linecap="round" fill="none">
    <path d="M140 140 C152 124 168 108 192 100"/>
    <path d="M152 132 L156 120"/>
    <path d="M164 122 L170 112"/>
    <path d="M176 112 L180 104"/>
  </g>

  <g class="d-sub">
    <rect x="8" y="86" width="104" height="30" rx="7"/>
    <rect x="8" y="126" width="104" height="30" rx="7"/>
    <rect x="212" y="86" width="100" height="30" rx="7"/>
    <rect x="212" y="126" width="100" height="42" rx="7"/>
  </g>
  <g class="d-row" font-size="11" font-weight="650" font-family="system-ui, sans-serif">
    <text x="18" y="105">Углекислый газ</text>
    <text x="18" y="145">Вода</text>
    <text x="222" y="105">Кислород</text>
    <text x="222" y="145">Органические</text>
    <text x="222" y="159">вещества</text>
  </g>

  <g class="d-stem" stroke-width="2.5" stroke-linecap="round" fill="none">
    <path d="M112 101 C124 104 126 110 130 116"/>
    <path d="M130 116 l-7 0 M130 116 l-1 -7"/>
    <path d="M112 141 C124 140 132 138 140 134"/>
    <path d="M140 134 l-7 -1 M140 134 l-2 -6"/>
    <path d="M198 108 C204 104 206 102 208 101"/>
    <path d="M208 101 l-7 0 M208 101 l1 -6"/>
    <path d="M194 136 C200 138 204 140 208 142"/>
    <path d="M208 142 l-6 -2 M208 142 l-1 -6"/>
  </g>

  <g class="d-label" font-size="10" font-family="system-ui, sans-serif">
    <text x="120" y="60">свет</text>
  </g>

  <g class="d-verdict" font-size="11" font-family="system-ui, sans-serif">
    <text x="8" y="196">Слева входит то, что лист берёт,</text>
    <text x="8" y="210">справа выходит то, что он делает.</text>
  </g>
</svg>
