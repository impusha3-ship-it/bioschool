<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 300" role="img" aria-label="Пять групп растений и что появилось у каждой следующей. Водоросли: тела ещё нет, только слоевище, живут в воде. Мхи: появились стебель и листья, но корней нет. Папоротники: появились корни и сосуды, по которым идёт вода. Голосеменные: появились семена, размножение больше не зависит от воды. Цветковые: появились цветок и плод, семя защищено. Внизу подпись: каждая следующая группа не заменила предыдущую — водоросли и мхи живут до сих пор.">
  <g class="d-head" font-size="11" font-weight="650" font-family="system-ui, sans-serif">
    <text x="8" y="13">Группа</text>
    <text x="132" y="13">Что появилось нового</text>
  </g>

  <g class="d-grid">
    <line x1="8" y1="20" x2="312" y2="20"/>
    <line x1="8" y1="66" x2="312" y2="66"/>
    <line x1="8" y1="112" x2="312" y2="112"/>
    <line x1="8" y1="158" x2="312" y2="158"/>
    <line x1="8" y1="204" x2="312" y2="204"/>
    <line x1="8" y1="250" x2="312" y2="250"/>
  </g>

  <g class="d-sub">
    <rect x="8" y="28" width="112" height="30" rx="7"/>
    <rect x="8" y="74" width="112" height="30" rx="7"/>
    <rect x="8" y="120" width="112" height="30" rx="7"/>
    <rect x="8" y="166" width="112" height="30" rx="7"/>
  </g>
  <g class="d-capsule">
    <rect x="8" y="212" width="112" height="30" rx="7"/>
  </g>

  <g class="d-row" font-size="12" font-weight="650" font-family="system-ui, sans-serif">
    <text x="18" y="47">Водоросли</text>
    <text x="18" y="93">Мхи</text>
    <text x="18" y="139">Папоротники</text>
    <text x="18" y="185" font-size="11">Голосеменные</text>
  </g>
  <g class="d-capsule-t" font-size="12" font-weight="700" font-family="system-ui, sans-serif">
    <text x="18" y="231">Цветковые</text>
  </g>

  <g class="d-number" font-size="12" font-weight="700" font-family="system-ui, sans-serif">
    <text x="132" y="42">Пока ничего</text>
    <text x="132" y="88">Стебель и листья</text>
    <text x="132" y="134">Корни и сосуды</text>
    <text x="132" y="180">Семена</text>
    <text x="132" y="226">Цветок и плод</text>
  </g>
  <g class="d-label" font-size="11" font-family="system-ui, sans-serif">
    <text x="132" y="56">слоевище, живут в воде</text>
    <text x="132" y="102">корней ещё нет</text>
    <text x="132" y="148">вода поднимается вверх</text>
    <text x="132" y="194">вода для размножения не нужна</text>
    <text x="132" y="240">семя защищено, есть плод</text>
  </g>

  <g class="d-verdict" font-size="12" font-family="system-ui, sans-serif">
    <text x="8" y="270">Новая группа не вытеснила прежние: водоросли</text>
    <text x="8" y="284">и мхи живут до сих пор и прекрасно себя чувствуют</text>
    <text x="8" y="298">там, где цветковым тесно.</text>
  </g>
</svg>
