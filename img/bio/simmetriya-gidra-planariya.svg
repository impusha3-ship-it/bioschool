<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" role="img" aria-label="Два животных, если смотреть на них сверху, и оси, которые делят тело на равные половины. Слева гидра: круглое тело, вокруг рта в середине расходятся щупальца во все стороны. Через неё проведено несколько пунктирных осей, и любая из них делит тело на одинаковые половины — это лучевая симметрия. Справа молочная планария: вытянутое листовидное тело с двумя глазками на переднем конце и заострённым задним. Через неё проходит только одна пунктирная ось, вдоль тела; поперечная ось показана перечёркнутой, потому что поперёк тело на равные половины не делится. Это двусторонняя симметрия. Вывод: гидра сидит на месте и ждёт добычу с любой стороны, поэтому все стороны у неё одинаковы, а планария ползёт вперёд, и у неё появляются перёд и зад.">
  <g class="d-head" font-size="11" font-weight="650" font-family="system-ui, sans-serif">
    <text x="8" y="14">Две симметрии: вид сверху</text>
  </g>

  <g class="d-capsule-t" font-size="12" font-family="system-ui, sans-serif">
    <text x="10" y="36">Гидра: лучевая</text>
    <text x="268" y="36">Планария: двусторонняя</text>
  </g>

  <!-- Гидра сверху: щупальца расходятся от рта во все стороны. -->
  <g class="d-mark" stroke-width="1.2" stroke-dasharray="5 4" fill="none">
    <path d="M120 54 V186 M54 120 H186 M73 73 L167 167 M167 73 L73 167"/>
  </g>
  <g class="d-stem" stroke-width="2.6" fill="none">
    <path d="M120 112 V70 M120 128 V170 M112 120 H70 M128 120 H170"/>
    <path d="M114 114 L84 84 M126 126 L156 156 M126 114 L156 84 M114 126 L84 156"/>
  </g>
  <g class="d-leaf">
    <ellipse cx="120" cy="120" rx="16" ry="16"/>
  </g>
  <g class="d-stem-end">
    <circle cx="120" cy="120" r="5"/>
  </g>
  <g class="d-label" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">
    <text x="120" y="206">Любая ось делит тело пополам.</text>
    <text x="120" y="218">Передней стороны нет вовсе.</text>
  </g>

  <!-- Планария сверху: ось одна, вдоль тела. -->
  <g class="d-mark" stroke-width="1.2" stroke-dasharray="5 4" fill="none">
    <path d="M370 48 V196"/>
  </g>
  <g class="d-no" stroke-width="1.2" stroke-dasharray="5 4" fill="none">
    <path d="M308 122 H432"/>
  </g>
  <g class="d-no" stroke-width="1.8" fill="none">
    <path d="M420 112 L436 128 M436 112 L420 128"/>
  </g>
  <g class="d-leaf">
    <path d="M370 58 C360 58 352 62 348 70 L336 76 L346 86 C343 100 342 118 342 140 C342 178 353 190 370 196 C387 190 398 178 398 140 C398 118 397 100 394 86 L404 76 L392 70 C388 62 380 58 370 58 Z"/>
  </g>
  <g class="d-stem-end">
    <circle cx="364" cy="70" r="2.6"/>
    <circle cx="376" cy="70" r="2.6"/>
  </g>
  <g class="d-label" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">
    <text x="370" y="206">Пополам делит только одна ось.</text>
    <text x="370" y="218">Есть перёд с глазками и зад.</text>
  </g>

  <g class="d-warn" stroke-width="1.4" fill="none">
    <path d="M240 228 V240"/>
  </g>
  <g class="d-warn-t" font-size="11" font-weight="650" text-anchor="middle" font-family="system-ui, sans-serif">
    <text x="240" y="254">Двусторонняя симметрия появилась вместе с движением вперёд</text>
  </g>
  <g class="d-label" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">
    <text x="240" y="268">Кто ползёт, тому нужен перёд: там глазки и нервные узлы.</text>
  </g>
</svg>
