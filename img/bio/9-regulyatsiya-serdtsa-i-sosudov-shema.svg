<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 224" role="img" aria-label="Движение мышц. Возрастает потребность в кислороде. Регуляция. Меняются ритм сердца и просвет сосудов. Доставка крови. К работающим мышцам поступает больше крови. Отдых. Пульс приближается к исходному">
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <rect x="8" y="4" width="304" height="42" rx="8" fill="none" stroke="#768a60"/>
    <text class="d-row" x="160" y="21" font-size="12" font-weight="650">Движение мышц</text>
    <text class="d-head" x="160" y="37" font-size="11">Возрастает потребность в кислороде</text>
    <path d="M160 46v10m-4-4 4 4 4-4" fill="none" stroke="#768a60" stroke-width="1.5"/>
    <rect x="8" y="59" width="304" height="42" rx="8" fill="none" stroke="#768a60"/>
    <text class="d-row" x="160" y="76" font-size="12" font-weight="650">Регуляция</text>
    <text class="d-head" x="160" y="92" font-size="11">Меняются ритм сердца и просвет сосудов</text>
    <path d="M160 101v10m-4-4 4 4 4-4" fill="none" stroke="#768a60" stroke-width="1.5"/>
    <rect x="8" y="114" width="304" height="42" rx="8" fill="none" stroke="#768a60"/>
    <text class="d-row" x="160" y="131" font-size="12" font-weight="650">Доставка крови</text>
    <text class="d-head" x="160" y="147" font-size="11">К работающим мышцам поступает больше крови</text>
    <path d="M160 156v10m-4-4 4 4 4-4" fill="none" stroke="#768a60" stroke-width="1.5"/>
    <rect x="8" y="169" width="304" height="42" rx="8" fill="none" stroke="#768a60"/>
    <text class="d-row" x="160" y="186" font-size="12" font-weight="650">Отдых</text>
    <text class="d-head" x="160" y="202" font-size="11">Пульс приближается к исходному</text>
  </g>
</svg>
