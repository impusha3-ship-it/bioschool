<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 268" role="img" aria-label="Лестница надёжности источников. Сверху вниз: учебник и научный справочник — их проверяли специалисты; сайт заповедника, музея, института — известно, кто отвечает за текст; энциклопедия в интернете — обычно верно, но правки вносят все; видео или пост без ссылок на источник — проверить негде.">
  <g class="d-axis" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M12 20 V232"/>
    <path d="M12 232 l-5 -8 M12 232 l5 -8"/>
  </g>
  <text class="d-head" x="6" y="252" font-size="10.5">надёжность падает</text>

  <g class="d-step-1">
    <rect x="28" y="14" width="286" height="52" rx="10"/>
  </g>
  <text class="d-row" x="42" y="36" font-size="12.5" font-weight="650">Учебник, научный справочник</text>
  <text class="d-head" x="42" y="53" font-size="11.5">текст проверяли специалисты</text>

  <g class="d-step-2">
    <rect x="28" y="76" width="286" height="52" rx="10"/>
  </g>
  <text class="d-row" x="42" y="98" font-size="12.5" font-weight="650">Сайт заповедника, музея, института</text>
  <text class="d-head" x="42" y="115" font-size="11.5">видно, кто отвечает за текст</text>

  <g class="d-step-3">
    <rect x="28" y="138" width="286" height="52" rx="10"/>
  </g>
  <text class="d-row" x="42" y="160" font-size="12.5" font-weight="650">Энциклопедия в интернете</text>
  <text class="d-head" x="42" y="177" font-size="11.5">обычно верно, но правит кто угодно</text>

  <g class="d-step-4">
    <rect x="28" y="200" width="286" height="52" rx="10"/>
  </g>
  <text class="d-row" x="42" y="222" font-size="12.5" font-weight="650">Видео или пост без ссылок</text>
  <text class="d-warn-t" x="42" y="239" font-size="11.5">проверить негде — само по себе не доказательство</text>
</svg>
