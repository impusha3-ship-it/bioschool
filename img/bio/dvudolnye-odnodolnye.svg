<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 418" role="img" aria-label="Сравнение двудольных и однодольных растений по четырём признакам. У двудольных зародыш семени с двумя семядолями, лист с сетчатым жилкованием, корневая система стержневая с выраженным главным корнем, цветок обычно пятичленный и в стебле есть камбий. У однодольных зародыш с одной семядолей, лист с параллельным жилкованием, корневая система мочковатая из одинаковых придаточных корней, цветок обычно трёхчленный и камбия нет. Внизу предупреждение: по одному признаку класс не определяют, у подорожника корневая система мочковатая, хотя он двудольный.">
  <g class="d-head" font-size="11" font-weight="650" font-family="system-ui, sans-serif">
    <text x="8" y="14">Двудольные и однодольные: четыре признака</text>
  </g>

  <g class="d-capsule">
    <rect x="14" y="26" width="216" height="24" rx="6"/>
    <rect x="250" y="26" width="216" height="24" rx="6"/>
  </g>
  <g class="d-capsule-t" font-size="13" text-anchor="middle" font-family="system-ui, sans-serif">
    <text x="122" y="43">Двудольные</text>
    <text x="358" y="43">Однодольные</text>
  </g>

  <!-- Семя: по числу семядолей класс и назван -->
  <g class="d-leaf">
    <path d="M98 84 C98 68 108 60 122 60 C136 60 146 68 146 84 C146 100 136 110 122 110 C108 110 98 100 98 84 Z"/>
    <path d="M334 84 C334 68 344 60 358 60 C372 60 382 68 382 84 C382 100 372 110 358 110 C344 110 334 100 334 84 Z"/>
  </g>
  <g class="d-leaf-vein">
    <path d="M122 62 V108"/>
    <path d="M358 62 C351 72 351 96 358 108"/>
  </g>
  <g class="d-label" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">
    <text x="122" y="126">две семядоли в зародыше</text>
    <text x="358" y="126">одна семядоля</text>
  </g>

  <!-- Лист -->
  <g class="d-leaf-blade">
    <path d="M122 236 C80 208 80 160 122 136 C164 160 164 208 122 236 Z"/>
    <path d="M358 236 C340 204 340 168 358 136 C376 168 376 204 358 236 Z"/>
  </g>
  <g class="d-leaf-vein">
    <path d="M122 236 C120 206 120 166 122 136 M122 150 C108.8 147 100.9 142 95.7 136 M122 150 C135.2 147 143.1 142 148.3 136 M122 162 C106 159 96.3 154 89.9 148 M122 162 C138 159 147.7 154 154.1 148 M122 174 C104.5 171 94 166 86.9 160 M122 174 C139.5 171 150 166 157.1 160 M122 186 C104 183 93.2 178 86 172 M122 186 C140 183 150.8 178 158 172 M122 198 C104.5 195 94 190 86.9 184 M122 198 C139.5 195 150 190 157.1 184 M122 210 C106 207 96.3 202 89.9 196 M122 210 C138 207 147.7 202 154.1 196 M122 222 C108.8 219 100.9 214 95.7 208 M122 222 C135.2 219 143.1 214 148.3 208"/>
    <path d="M356.7 236 C347 204 347 168 356.7 136 M357.3 236 C352.5 204 352.5 168 357.3 136 M358 236 C358 204 358 168 358 136 M358.7 236 C363.5 204 363.5 168 358.7 136 M359.3 236 C369 204 369 168 359.3 136"/>
  </g>
  <g class="d-label" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">
    <text x="122" y="252">жилкование сетчатое</text>
    <text x="358" y="252">жилкование параллельное</text>
  </g>

  <!-- Корневая система -->
  <g class="d-root" stroke-width="3.4" fill="none" stroke-linecap="round">
    <path d="M122 264 C124 294 124 320 122 340"/>
  </g>
  <g class="d-root" stroke-width="1.4" fill="none" stroke-linecap="round">
    <path d="M123 280 C110 286 102 294 96 304 M123 280 C136 286 144 294 150 304
             M123 300 C112 306 106 314 102 324 M123 300 C134 306 140 314 144 324
             M123 320 C116 326 112 332 110 340 M123 320 C130 326 134 332 136 340"/>
  </g>
  <g class="d-root" stroke-width="2.2" fill="none" stroke-linecap="round">
    <path d="M358 264 V276"/>
    <path d="M358 276 C342 292 334 314 330 340 M358 276 C346 294 342 316 342 340
             M358 276 C356 296 354 318 354 340 M358 276 C366 294 370 316 372 340
             M358 276 C374 292 382 314 386 340"/>
  </g>
  <g class="d-label" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">
    <text x="122" y="356">корневая система стержневая</text>
    <text x="358" y="356">корневая система мочковатая</text>
  </g>

  <g class="d-label" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">
    <text x="122" y="380">цветок обычно 5-членный, камбий есть</text>
    <text x="358" y="380">цветок обычно 3-членный, камбия нет</text>
  </g>
  <g class="d-warn-t" font-size="11" font-weight="650" text-anchor="middle" font-family="system-ui, sans-serif">
    <text x="240" y="404">Один признак не решает: подорожник двудольный, а корни у него мочковатые.</text>
  </g>
</svg>
