<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 296" role="img" aria-label="Биология делится надвое. По тому, кого изучают: ботаника — растения, зоология — животные, микология — грибы, микробиология — бактерии. По тому, что изучают: цитология — клетку, анатомия — строение, физиология — работу органов, экология — связи со средой.">
  <rect class="d-capsule" x="102" y="12" width="116" height="32" rx="16"/>
