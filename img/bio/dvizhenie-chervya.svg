<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 266" role="img" aria-label="Как дождевой червь делает шаг. Первый шаг: сжимаются кольцевые мышцы, продольные расслабляются, тело становится тоньше и длиннее, передний конец уходит вперёд, а сзади щетинки упираются в стенки хода и не дают телу соскользнуть назад. Второй шаг: сжимаются продольные мышцы, кольцевые расслабляются, тело становится короче и толще, задний конец подтягивается к переднему, и теперь держат передние щетинки. Пунктиром показано, где находился задний конец до этого. Попеременное сокращение двух слоёв мышц гонит по телу волну, и червь ползёт.">
  <g class="d-head" font-size="11" font-weight="650" font-family="system-ui, sans-serif">
    <text x="8" y="16">Как червь делает шаг</text>
  </g>

  <g class="d-capsule-t" font-size="12" font-family="system-ui, sans-serif">
    <text x="8" y="44">1. Сжались кольцевые, продольные расслабились</text>
  </g>
  <g class="d-leaf">
    <path d="M40 56 L340 56 A11 11 0 0 1 340 78 L40 78 A11 11 0 0 1 40 56 Z"/>
  </g>
  <g class="d-midrib">
    <line x1="80" y1="57" x2="80" y2="77"/>
    <line x1="120" y1="57" x2="120" y2="77"/>
    <line x1="160" y1="57" x2="160" y2="77"/>
    <line x1="200" y1="57" x2="200" y2="77"/>
    <line x1="240" y1="57" x2="240" y2="77"/>
    <line x1="280" y1="57" x2="280" y2="77"/>
    <line x1="310" y1="57" x2="310" y2="77"/>
  </g>
  <g class="d-stem" stroke-width="2" fill="none">
    <path d="M50 78 L46 87"/>
    <path d="M68 78 L64 87"/>
    <path d="M86 78 L82 87"/>
    <path d="M104 78 L100 87"/>
    <path d="M352 67 H378"/>
    <path d="M378 67 L370 62 M378 67 L370 72"/>
  </g>
  <g class="d-label" font-size="10" font-family="system-ui, sans-serif">
    <text x="40" y="104">тело стало тоньше и длиннее, передний конец продвинулся вперёд</text>
    <text x="40" y="118">сзади щетинки упёрлись в стенки хода и не дают соскользнуть назад</text>
  </g>

  <g class="d-capsule-t" font-size="12" font-family="system-ui, sans-serif">
    <text x="8" y="148">2. Сжались продольные, кольцевые расслабились</text>
  </g>
  <g class="d-no" stroke-width="1.2" fill="none" stroke-dasharray="5 4">
    <path d="M40 160 H120 V194 H40 Z"/>
  </g>
  <g class="d-leaf">
    <path d="M137 160 L323 160 A17 17 0 0 1 323 194 L137 194 A17 17 0 0 1 137 160 Z"/>
  </g>
  <g class="d-midrib">
    <line x1="165" y1="161" x2="165" y2="193"/>
    <line x1="193" y1="161" x2="193" y2="193"/>
    <line x1="221" y1="161" x2="221" y2="193"/>
    <line x1="249" y1="161" x2="249" y2="193"/>
    <line x1="277" y1="161" x2="277" y2="193"/>
    <line x1="301" y1="161" x2="301" y2="193"/>
  </g>
  <g class="d-stem" stroke-width="2" fill="none">
    <path d="M290 194 L286 203"/>
    <path d="M308 194 L304 203"/>
    <path d="M326 194 L322 203"/>
    <path d="M344 194 L340 203"/>
  </g>
  <g class="d-label" font-size="10" font-family="system-ui, sans-serif">
    <text x="40" y="220">тело стало короче и толще, задний конец подтянулся к переднему</text>
    <text x="40" y="234">пунктиром показано, где он был; теперь держат передние щетинки</text>
  </g>

  <g class="d-verdict" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">
    <text x="240" y="258">Два слоя мышц работают по очереди — по телу идёт волна, и червь ползёт</text>
  </g>
</svg>
