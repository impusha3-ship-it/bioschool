<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 354" role="img" aria-label="Таблица из трёх столбцов: железа, её гормон и то, что гормон делает. Гипофиз выделяет гормон роста, усиливающий рост и деление клеток; тропные гормоны, управляющие другими железами; вазопрессин, возвращающий воду из мочи обратно в кровь. Щитовидная железа выделяет тироксин, содержащий йод: он ускоряет обмен веществ и даёт тепло. Поджелудочная железа выделяет инсулин, пускающий глюкозу из крови в ткани. Надпочечники выделяют адреналин, поднимающий давление, пульс и дыхание. Яичники выделяют эстрадиол, отвечающий за созревание яйцеклеток и женский тип развития. Семенники выделяют тестостерон, отвечающий за мужской тип развития и выработку сперматозоидов. Внизу вывод: гормона в крови микроскопически мало, и этого хватает, потому что он не работает сам, а отдаёт команду органу-мишени." >
  <g class="d-head" font-size="11" font-weight="650" font-family="system-ui, sans-serif">
    <text x="8" y="14">Железа, её гормон и что он делает</text>
  </g>
  <g class="d-capsule-t" font-size="11" font-weight="650" font-family="system-ui, sans-serif">
    <text x="8" y="44">Железа</text>
    <text x="132" y="44">Гормон</text>
    <text x="252" y="44">Что он делает</text>
  </g>
  <g class="d-grid">
    <line x1="8" y1="52" x2="472" y2="52"/>
    <line x1="8" y1="145" x2="472" y2="145"/>
    <line x1="8" y1="173" x2="472" y2="173"/>
    <line x1="8" y1="201" x2="472" y2="201"/>
    <line x1="8" y1="229" x2="472" y2="229"/>
    <line x1="8" y1="257" x2="472" y2="257"/>
    <line x1="124" y1="52" x2="124" y2="285"/>
    <line x1="244" y1="52" x2="244" y2="285"/>
  </g>
  <g class="d-capsule-t" font-size="10" font-family="system-ui, sans-serif">
    <text x="8" y="70">Гипофиз</text>
    <text x="8" y="154">Щитовидная железа</text>
    <text x="8" y="182">Поджелудочная железа</text>
    <text x="8" y="210">Надпочечники</text>
    <text x="8" y="238">Яичники</text>
    <text x="8" y="266">Семенники</text>
  </g>
  <g class="d-simp-t" font-size="10" font-family="system-ui, sans-serif">
    <text x="132" y="70">гормон роста</text>
    <text x="132" y="98">тропные гормоны</text>
    <text x="132" y="126">вазопрессин</text>
    <text x="132" y="154">тироксин, в нём йод</text>
    <text x="132" y="182">инсулин</text>
    <text x="132" y="210">адреналин</text>
    <text x="132" y="238">эстрадиол</text>
    <text x="132" y="266">тестостерон</text>
  </g>
  <g class="d-label" font-size="10" font-family="system-ui, sans-serif">
    <text x="252" y="70">усиливает рост и деление клеток</text>
    <text x="252" y="98">управляют другими железами</text>
    <text x="252" y="126">возвращает воду в кровь из мочи</text>
    <text x="252" y="154">ускоряет обмен веществ, даёт тепло</text>
    <text x="252" y="182">пускает глюкозу из крови в ткани</text>
    <text x="252" y="210">поднимает давление, пульс, дыхание</text>
    <text x="252" y="238">созревание яйцеклеток, женский тип</text>
    <text x="252" y="266">мужской тип, сперматозоиды</text>
  </g>
  <g class="d-warn" stroke-width="1.4" fill="none">
    <path d="M240 296 V308"/>
  </g>
  <g class="d-warn-t" font-size="11" font-weight="650" text-anchor="middle" font-family="system-ui, sans-serif">
    <text x="240" y="324">Гормона в крови микроскопически мало — и этого хватает</text>
  </g>
  <g class="d-label" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">
    <text x="240" y="342">Он не работает сам, а отдаёт команду органу-мишени.</text>
  </g>
</svg>
