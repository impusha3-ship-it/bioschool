<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 306" role="img" aria-label="Что биология дала человеку. Медицина: вакцины, антибиотики, пересадка органов. Сельское хозяйство: новые сорта растений, породы животных, защита урожая без ядов. Охрана природы: заповедники, Красная книга, очистка воды и воздуха.">
  <rect class="d-capsule" x="102" y="10" width="116" height="30" rx="15"/>
  <text class="d-capsule-t" x="160" y="30" font-size="13.5" text-anchor="middle">БИОЛОГИЯ</text>

  <g class="d-stem" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M160 40 V56"/>
  </g>

  <g class="d-accent-bar">
    <rect x="8" y="64" width="3" height="62" rx="1.5"/>
    <rect x="8" y="146" width="3" height="62" rx="1.5"/>
    <rect x="8" y="228" width="3" height="62" rx="1.5"/>
  </g>

  <g class="d-head" font-size="11.5" font-weight="650">
    <text x="22" y="76">МЕДИЦИНА</text>
    <text x="22" y="158">СЕЛЬСКОЕ ХОЗЯЙСТВО</text>
    <text x="22" y="240">ОХРАНА ПРИРОДЫ</text>
  </g>

  <g class="d-stem-end">
    <circle cx="26" cy="94" r="2.5"/>
    <circle cx="26" cy="112" r="2.5"/>
    <circle cx="26" cy="130" r="2.5"/>
    <circle cx="26" cy="176" r="2.5"/>
    <circle cx="26" cy="194" r="2.5"/>
    <circle cx="26" cy="212" r="2.5"/>
    <circle cx="26" cy="258" r="2.5"/>
    <circle cx="26" cy="276" r="2.5"/>
    <circle cx="26" cy="294" r="2.5"/>
  </g>

  <g class="d-row" font-size="12.5">
    <text x="38" y="98">Вакцины от смертельных болезней</text>
    <text x="38" y="116">Антибиотики</text>
    <text x="38" y="134">Пересадка органов</text>

    <text x="38" y="180">Сорта, дающие больше зерна</text>
    <text x="38" y="198">Породы коров, кур, овец</text>
    <text x="38" y="216">Защита урожая без ядов</text>

    <text x="38" y="262">Заповедники и национальные парки</text>
    <text x="38" y="280">Красная книга</text>
    <text x="38" y="298">Очистка воды и воздуха</text>
  </g>
</svg>
