<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 288" role="img" aria-label="Главное деление животных по одному признаку: есть ли внутренний скелет с позвоночником. Слева беспозвоночные, у которых его нет: черви, моллюски, членистоногие — насекомые, пауки, раки. Справа позвоночные, у которых он есть: рыбы, земноводные, пресмыкающиеся, птицы, звери. Внизу полоса, показывающая соотношение: беспозвоночные составляют примерно девяносто семь видов из ста, позвоночные — около трёх. Подпись: привычные нам животные — редкое исключение среди животных вообще.">
  <g class="d-head" font-size="11" font-weight="650" font-family="system-ui, sans-serif">
    <text x="8" y="13">Есть внутренний скелет с позвоночником?</text>
  </g>

  <g class="d-sub">
    <rect x="8" y="22" width="144" height="180" rx="8"/>
  </g>
  <g class="d-capsule">
    <rect x="168" y="22" width="144" height="180" rx="8"/>
  </g>

  <g class="d-vague" font-size="13" font-weight="700" font-family="system-ui, sans-serif">
    <text x="18" y="42">Нет</text>
  </g>
  <g class="d-capsule-t" font-size="13" font-weight="700" font-family="system-ui, sans-serif">
    <text x="178" y="42">Да</text>
  </g>
  <g class="d-row" font-size="12" font-weight="650" font-family="system-ui, sans-serif">
    <text x="18" y="60">Беспозвоночные</text>
    <text x="178" y="60">Позвоночные</text>
  </g>

  <g class="d-label" font-size="11" font-family="system-ui, sans-serif">
    <text x="18" y="84">черви</text>
    <text x="18" y="102">моллюски</text>
    <text x="18" y="120">членистоногие:</text>
    <text x="26" y="138">насекомые</text>
    <text x="26" y="156">пауки</text>
    <text x="26" y="174">раки</text>
    <text x="178" y="84">рыбы</text>
    <text x="178" y="102">земноводные</text>
    <text x="178" y="120">пресмыкающиеся</text>
    <text x="178" y="138">птицы</text>
    <text x="178" y="156">звери</text>
  </g>
  <g class="d-same" font-size="10" font-family="system-ui, sans-serif">
    <text x="18" y="194">и ещё десяток групп</text>
    <text x="178" y="180">и всё</text>
  </g>

  <g class="d-head" font-size="11" font-weight="650" font-family="system-ui, sans-serif">
    <text x="8" y="226">Сколько видов приходится на каждую половину</text>
  </g>
  <g class="d-bar-most">
    <rect x="8" y="234" width="295" height="20" rx="4"/>
  </g>
  <g class="d-bar-few">
    <rect x="303" y="234" width="9" height="20" rx="2"/>
  </g>
  <g class="d-number" font-size="11" font-weight="700" font-family="system-ui, sans-serif">
    <text x="14" y="248">97 из 100 видов — беспозвоночные</text>
  </g>
  <g class="d-verdict" font-size="12" font-family="system-ui, sans-serif">
    <text x="8" y="272">Рыбы, птицы и звери, о которых обычно думают</text>
    <text x="8" y="286">при слове «животные», — редкое исключение.</text>
  </g>
</svg>
