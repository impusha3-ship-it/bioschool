  <!-- Первым Tab уводит в содержимое, мимо шапки. Кнопка, а не ссылка:
       адрес после решётки занят маршрутом, и «#app» увёл бы на «страница
       не найдена». -->
  <button class="skip-link" id="skip" type="button">К содержанию</button>
  <!-- Метка, по которой шапка узнаёт, что страница уехала вниз. Наблюдатель
       вместо обработчика прокрутки: тот считает на каждый пиксель. -->
  <div class="scroll-sentinel" id="sentinel" aria-hidden="true"></div>
  <header class="site-header" id="header">
    <a class="site-header__home" href="#/">
      <svg class="site-header__mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false">

        <path d="M12 12.6C8.1 12.6 5.9 10 5.9 6.1 9.8 6.1 12 8.7 12 12.6Z"/>

      </svg>
      Биология

    <button class="site-header__theme" id="theme" type="button">Тема</button>
    <a class="site-header__who" id="who" href="#/login">Войти</a>
  </header>
  <main id="app" class="app" tabindex="-1">
    <p class="loading">Загрузка…</p>
  </main>
  <footer class="site-footer">
    <a href="#/sources">Источники материалов</a>
  </footer>
  <script type="module" src="./js/app.js"></script>
