<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 274" role="img" aria-label="Путь воды через растение. Внизу стакан с водой, в нём корни. Вода всасывается корнями, поднимается по стеблю вверх, доходит до листьев и испаряется с их поверхности в воздух. Уровень воды в стакане за неделю заметно опускается: отметка «было» выше отметки «стало». Внизу подпись: вода не исчезает и не остаётся внутри — растение пропускает её сквозь себя.">
  <g class="d-head" font-size="11" font-weight="650" font-family="system-ui, sans-serif">
    <text x="8" y="13">Куда девается вода из стакана</text>
  </g>

  <g class="d-evap" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M112 44 c4 -6 -4 -10 0 -16"/>
    <path d="M148 38 c4 -6 -4 -10 0 -16"/>
    <path d="M184 44 c4 -6 -4 -10 0 -16"/>
  </g>
  <g class="d-evap-t" font-size="11" font-weight="650" font-family="system-ui, sans-serif">
    <text x="204" y="36">испаряется</text>
    <text x="204" y="48">с листьев</text>
  </g>

  <g class="d-stem" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M148 168 V72"/>
  </g>
  <g class="d-leaf">
    <path d="M148 96 c-22 -6 -28 -18 -28 -18 c12 -6 25 3 28 18 z"/>
    <path d="M148 84 c22 -6 28 -18 28 -18 c-12 -6 -25 3 -28 18 z"/>
    <path d="M148 122 c-20 -5 -25 -16 -25 -16 c11 -5 22 3 25 16 z"/>
  </g>

  <g class="d-flow" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M138 160 V110"/>
    <path d="M138 110 l-4 6 M138 110 l4 6"/>
    <path d="M158 160 V110"/>
    <path d="M158 110 l-4 6 M158 110 l4 6"/>
  </g>
  <g class="d-flow-t" font-size="11" font-weight="650" font-family="system-ui, sans-serif">
    <text x="176" y="132">поднимается</text>
    <text x="176" y="144">по стеблю</text>
  </g>

  <g class="d-glass">
    <path d="M100 166 h96 l-8 76 h-80 z"/>
  </g>
  <g class="d-water">
    <path d="M104 192 h88 l-6 46 h-76 z"/>
  </g>
  <g class="d-root" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M148 168 V210"/>
    <path d="M148 186 l-14 18"/>
    <path d="M148 186 l14 18"/>
    <path d="M148 200 l-9 14"/>
    <path d="M148 200 l9 14"/>
  </g>
  <g class="d-root-t" font-size="11" font-weight="650" font-family="system-ui, sans-serif">
    <text x="14" y="206">корни</text>
    <text x="14" y="218">всасывают</text>
  </g>
  <g class="d-lead" stroke-width="1" fill="none">
    <path d="M66 202 H132"/>
  </g>

  <g class="d-mark" stroke-width="1.5" stroke-dasharray="4 3" fill="none">
    <path d="M212 178 H100"/>
    <path d="M212 192 H104"/>
  </g>
  <g class="d-same" font-size="11" font-family="system-ui, sans-serif">
    <text x="216" y="182">было</text>
  </g>
  <g class="d-diff" font-size="11" font-weight="700" font-family="system-ui, sans-serif">
    <text x="216" y="196">стало</text>
  </g>

  <g class="d-verdict" font-size="12" font-family="system-ui, sans-serif">
    <text x="8" y="260">Вода не исчезает и не остаётся внутри целиком:</text>
    <text x="8" y="272">растение пропускает её сквозь себя.</text>
  </g>
</svg>
