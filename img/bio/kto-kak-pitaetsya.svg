<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 268" role="img" aria-label="Как питаются четыре группы организмов. Растения создают питательные вещества сами, на свету, из воды и углекислого газа. Животные заглатывают готовое: находят, ловят и съедают, а переваривают внутри себя. Грибы всасывают готовое всей поверхностью прямо из того, на чём растут. Бактерии по-разному: большинство всасывает готовое, а некоторые создают сами. Внизу подпись: граница проходит не между растениями и животными, а между теми, кто создаёт вещества сам, и теми, кто берёт готовое.">
  <g class="d-head" font-size="11" font-weight="650" font-family="system-ui, sans-serif">
    <text x="8" y="13">Кто</text>
    <text x="122" y="13">Как добывает вещества</text>
  </g>

  <g class="d-grid">
    <line x1="8" y1="20" x2="312" y2="20"/>
    <line x1="8" y1="74" x2="312" y2="74"/>
    <line x1="8" y1="128" x2="312" y2="128"/>
    <line x1="8" y1="176" x2="312" y2="176"/>
    <line x1="8" y1="224" x2="312" y2="224"/>
  </g>

  <g class="d-capsule">
    <rect x="8" y="30" width="104" height="34" rx="7"/>
  </g>
  <g class="d-sub">
    <rect x="8" y="84" width="104" height="34" rx="7"/>
    <rect x="8" y="134" width="104" height="32" rx="7"/>
    <rect x="8" y="182" width="104" height="32" rx="7"/>
  </g>

  <g class="d-capsule-t" font-size="13" font-weight="650" font-family="system-ui, sans-serif">
    <text x="18" y="52">Растения</text>
  </g>
  <g class="d-row" font-size="13" font-weight="650" font-family="system-ui, sans-serif">
    <text x="18" y="106">Животные</text>
    <text x="18" y="155">Грибы</text>
    <text x="18" y="203">Бактерии</text>
  </g>

  <g class="d-number" font-size="12" font-weight="700" font-family="system-ui, sans-serif">
    <text x="122" y="44">Создают сами</text>
  </g>
  <g class="d-row" font-size="12" font-weight="700" font-family="system-ui, sans-serif">
    <text x="122" y="98">Заглатывают готовое</text>
    <text x="122" y="148">Всасывают готовое</text>
    <text x="122" y="196">И так, и так</text>
  </g>

  <g class="d-label" font-size="11" font-family="system-ui, sans-serif">
    <text x="122" y="58">на свету, из воды и воздуха</text>
    <text x="122" y="112">ловят и переваривают внутри</text>
    <text x="122" y="162">всей поверхностью сразу</text>
    <text x="122" y="210">чаще готовое, иногда сами</text>
  </g>

  <g class="d-verdict" font-size="12" font-family="system-ui, sans-serif">
    <text x="8" y="242">Главная граница проходит не между растениями</text>
    <text x="8" y="254">и животными, а между теми, кто создаёт вещества</text>
    <text x="8" y="266">сам, и теми, кто берёт готовое.</text>
  </g>
</svg>
