<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 290" role="img" aria-label="Круг из шести шагов развития папоротника. Взрослый папоротник — это спорофит, бесполое и главное поколение. На нижней стороне его вайи сидят сорусы — кучки спорангиев, в них созревают споры. Спора высыпается и прорастает. Из неё вырастает заросток — зелёная пластинка в пару миллиметров, это гаметофит, половое поколение. На нижней стороне заростка образуются половые клетки, и в капле воды под заростком сперматозоид доплывает до яйцеклетки. Получается зигота, из неё вырастает зародыш, который сначала кормится за счёт заростка, а потом становится новым папоротником, и круг замыкается.">
  <g class="d-head" font-size="11" font-weight="650" font-family="system-ui, sans-serif">
    <text x="8" y="14">Как размножается папоротник</text>
  </g>

  <g class="d-stem" stroke-width="1.8" fill="none">
    <path d="M154 58 H176"/>
    <path d="M310 58 H332"/>
    <path d="M396 96 V162"/>
    <path d="M326 196 H304"/>
    <path d="M170 196 H148"/>
    <path d="M84 162 V102"/>
  </g>
  <g class="d-stem-end">
    <path d="M182 58 L174 54 L174 62 Z"/>
    <path d="M338 58 L330 54 L330 62 Z"/>
    <path d="M396 170 L392 162 L400 162 Z"/>
    <path d="M298 196 L306 192 L306 200 Z"/>
    <path d="M142 196 L150 192 L150 200 Z"/>
    <path d="M84 94 L80 102 L88 102 Z"/>
  </g>

  <g class="d-capsule">
    <rect x="14" y="30" width="140" height="58" rx="8"/>
    <rect x="182" y="30" width="128" height="58" rx="8"/>
    <rect x="338" y="30" width="128" height="58" rx="8"/>
    <rect x="338" y="170" width="128" height="58" rx="8"/>
    <rect x="176" y="170" width="128" height="58" rx="8"/>
    <rect x="14" y="170" width="128" height="58" rx="8"/>
  </g>

  <g class="d-capsule-t" font-size="12" font-family="system-ui, sans-serif">
    <text x="26" y="50">Взрослый папоротник</text>
    <text x="194" y="50">Сорусы на вайе</text>
    <text x="350" y="50">Спора</text>
    <text x="350" y="190">Заросток</text>
    <text x="188" y="190">Оплодотворение</text>
    <text x="26" y="190">Зигота и зародыш</text>
  </g>
  <g class="d-label" font-size="10" font-family="system-ui, sans-serif">
    <text x="26" y="66">спорофит, бесполое</text>
    <text x="26" y="78">поколение — главный</text>
    <text x="194" y="66">кучки спорангиев</text>
    <text x="194" y="78">на нижней стороне</text>
    <text x="350" y="66">высыпалась</text>
    <text x="350" y="78">и проросла</text>
    <text x="350" y="204">зелёная пластинка</text>
    <text x="350" y="216">в пару мм, гаметофит</text>
    <text x="188" y="204">сперматозоид плывёт</text>
    <text x="188" y="216">в капле воды</text>
    <text x="26" y="204">зародыш кормится</text>
    <text x="26" y="216">за счёт заростка</text>
  </g>

  <!-- Единственное место, где папоротник привязан к воде. У мха было то же самое. -->
  <g class="d-warn" stroke-width="1.4" fill="none">
    <path d="M240 232 V248"/>
  </g>
  <g class="d-warn-t" font-size="11" font-weight="650" text-anchor="middle" font-family="system-ui, sans-serif">
    <text x="240" y="262">Под заростком должна быть капля воды — иначе оплодотворения не будет</text>
  </g>

  <g class="d-label" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">
    <text x="240" y="282">Главное поколение здесь — спорофит, сам папоротник. У мха было наоборот.</text>
  </g>
</svg>
