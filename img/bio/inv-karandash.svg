<?xml version="1.0" encoding="UTF-8"?>
<!--
  Карандаш — значок инвентаря для сбора стола в лабораторной работе.
  Нарисован в том же языке, что остальные приборы: примитивы, три ступени
  светлоты, обводка из темы. Цвета не зашиты — приходят по классам d-eq-*.
  Узнаётся по двум концам: гранёный корпус, скошенная заточка и грифель
  с одной стороны, тупой торец с другой. В самонаблюдении из § 11 нужен
  как раз тупой конец.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 118" role="img" aria-label="Карандаш">
  <rect class="d-eq-mid" x="5" y="6" width="18" height="12" rx="2"/>
  <rect class="d-eq-light" x="5" y="18" width="18" height="74"/>
  <path class="d-eq-none" d="M11 18v74M17 18v74"/>
  <path class="d-eq-mid" d="M5 92h18l-9 14z"/>
  <path class="d-eq-accent" d="M11 100h6l-3 6z"/>
</svg>
