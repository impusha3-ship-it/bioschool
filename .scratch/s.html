<!doctype html><html lang="ru"><meta charset="utf-8"><title>Схема</title>
<link rel="stylesheet" href="/css/tokens.css"><link rel="stylesheet" href="/css/base.css">
<body style="background:var(--paper);margin:0;padding:16px;color:var(--ink)">
<figure class="figure" style="width:311px;box-sizing:border-box"><div class="figure__holder"></div>
<figcaption class="figure__caption">Проверка.</figcaption></figure>
<script>
fetch('/img/bio/'+new URLSearchParams(location.search).get('f')).then(r=>r.text()).then(t=>{
  const svg=new DOMParser().parseFromString(t,'image/svg+xml').documentElement;
  svg.setAttribute('class','figure__svg'); svg.style.width='100%'; svg.style.height='auto';
  document.querySelector('.figure__holder').append(svg);
});
</script>
