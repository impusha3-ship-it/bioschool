<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 336" role="img" aria-label="Разделы зоологии. Одна наука поделена двумя разными способами. По объекту исследования — то есть по тому, кого изучают: протозоология изучает одноклеточных, энтомология насекомых, ихтиология рыб, орнитология птиц, териология млекопитающих. По задаче исследования — то есть по тому, что именно выясняют: морфология изучает строение, физиология процессы жизнедеятельности, этология поведение, зоогеография распределение по планете, палеозоология вымерших животных. Внизу пример пересечения: человек, изучающий поведение птиц, одновременно орнитолог и этолог. Вывод: вопрос «кто этим занимается» имеет два ответа сразу, и это не противоречие, а два разреза одной науки.">
  <g class="d-head" font-size="11.5" font-weight="650" font-family="system-ui, sans-serif">
    <text x="8" y="14">Зоологию делят дважды, и оба деления верны</text>
  </g>

  <g class="d-capsule">
    <rect x="100" y="24" width="120" height="24" rx="6"/>
  </g>
  <g class="d-capsule-t" font-size="11.5" text-anchor="middle" font-family="system-ui, sans-serif">
    <text x="160" y="41">Зоология</text>
  </g>

  <!-- Две ветки от одного корня: по объекту и по задаче. -->
  <g class="d-lead" fill="none">
    <path d="M160 48 V58 H72 V70"/>
    <path d="M160 48 V58 H248 V70"/>
  </g>

  <g class="d-label" font-size="11" font-weight="650" text-anchor="middle" font-family="system-ui, sans-serif">
    <text x="72" y="84">Кого изучаю</text>
    <text x="248" y="84">Что выясняю</text>
  </g>
  <g class="d-row" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">
    <text x="72" y="98">по объекту</text>
    <text x="248" y="98">по задаче</text>
  </g>

  <g class="d-row" font-size="11" font-family="system-ui, sans-serif">
    <text x="8" y="122">протозоология —</text>
    <text x="18" y="136">одноклеточные</text>
    <text x="8" y="154">энтомология —</text>
    <text x="18" y="168">насекомые</text>
    <text x="8" y="186">ихтиология — рыбы</text>
    <text x="8" y="204">орнитология — птицы</text>
    <text x="8" y="222">териология —</text>
    <text x="18" y="236">млекопитающие</text>

    <text x="172" y="122">морфология —</text>
    <text x="182" y="136">строение</text>
    <text x="172" y="154">физиология —</text>
    <text x="182" y="168">как работает</text>
    <text x="172" y="186">этология — поведение</text>
    <text x="172" y="204">зоогеография — где</text>
    <text x="172" y="222">палеозоология —</text>
    <text x="182" y="236">кто жил раньше</text>
  </g>

  <g class="d-eq-rule">
    <line x1="8" y1="252" x2="312" y2="252"/>
  </g>

  <!--
    Пересечение веток и есть смысл схемы: один человек попадает в обе
    колонки сразу, и это не противоречие.
  -->
  <g class="d-step-1">
    <rect x="8" y="264" width="304" height="26" rx="6"/>
  </g>
  <g class="d-label" font-size="11" font-weight="650" text-anchor="middle" font-family="system-ui, sans-serif">
    <text x="160" y="281">Изучает поведение птиц = орнитолог и этолог</text>
  </g>

  <g class="d-verdict" font-size="11" font-family="system-ui, sans-serif">
    <text x="8" y="308">Вопрос «кто этим занимается» имеет два ответа сразу:</text>
    <text x="8" y="322">это не путаница, а два разреза одной науки.</text>
  </g>
</svg>
