<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 344" role="img" aria-label="Четыре хвойные ветки одна под другой. У сосны хвоинки длинные и сидят парами. У ели короткие жёсткие хвоинки сидят поодиночке и покрывают всю ветку. У лиственницы хвоинки собраны в пучки по двадцать-сорок штук, как кисточки, и мягкие. У пихты плоские хвоинки лежат в одной плоскости двумя рядами, снизу у них две светлые полоски.">
  <g class="d-head" font-size="11" font-weight="650" font-family="system-ui, sans-serif">
    <text x="8" y="14">Как отличить хвойные по хвое</text>
  </g>
