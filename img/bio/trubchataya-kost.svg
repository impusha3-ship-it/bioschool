<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" role="img" aria-label="Продольный разрез трубчатой кости на примере бедренной. Сверху и снизу расширенные концевые головки — эпифизы; они образованы губчатым веществом, промежутки которого заполнены красным костным мозгом, а снаружи покрыты очень прочным и гладким гиалиновым хрящом толщиной около половины миллиметра, который сводит к минимуму трение в суставе. Средняя часть кости — диафиз, или тело; он образован компактным веществом, внутри него проходит полость, наполненная жёлтым костным мозгом. Снаружи диафиз покрыт надкостницей — оболочкой из соединительной ткани, в которой проходит множество кровеносных сосудов и нервных окончаний. Между диафизом и эпифизами лежат шейки — зоны роста: именно там клетки делятся, и кость растёт в длину. В толщину кость растёт за счёт деления клеток надкостницы, она же обеспечивает срастание переломов.">
  <g class="d-head" font-size="11" font-weight="650" font-family="system-ui, sans-serif">
    <text x="8" y="14">Трубчатая кость в разрезе</text>
  </g>

  <!-- Тело кости: компактное вещество и полость внутри. -->
  <g class="d-wall-skin">
    <path d="M150 34 C120 34 108 54 110 76 C112 96 128 104 128 122 L128 208 C128 226 112 234 110 254 C108 276 120 296 150 296 L190 296 C220 296 232 276 230 254 C228 234 212 226 212 208 L212 122 C212 104 228 96 230 76 C232 54 220 34 190 34 Z"/>
  </g>
  <g class="d-polost">
    <path d="M152 126 L188 126 L188 204 L152 204 Z"/>
  </g>

  <!-- Губчатое вещество в эпифизах. -->
  <g class="d-parenchyma">
    <path d="M150 44 C126 44 118 58 120 74 C122 90 136 98 136 112 L204 112 C204 98 218 90 220 74 C222 58 214 44 190 44 Z"/>
    <path d="M136 218 L204 218 C204 232 218 240 220 256 C222 272 214 286 190 286 L150 286 C126 286 118 272 120 256 C122 240 136 232 136 218 Z"/>
  </g>

  <!-- Гиалиновый хрящ снаружи эпифизов. -->
  <g class="d-vessel" stroke-width="3" fill="none">
    <path d="M122 48 C132 38 148 34 170 34 C192 34 208 38 218 48"/>
    <path d="M122 282 C132 292 148 296 170 296 C192 296 208 292 218 282"/>
  </g>

  <!-- Зоны роста: шейки между диафизом и эпифизами. -->
  <g class="d-no" stroke-width="1.6" stroke-dasharray="5 4" fill="none">
    <path d="M128 116 H212"/>
    <path d="M128 214 H212"/>
  </g>

  <g class="d-lead" stroke-width="1" fill="none">
    <path d="M250 42 H222"/>
    <path d="M250 76 H208"/>
    <path d="M250 118 H214"/>
    <path d="M250 160 H190"/>
    <path d="M250 196 H214"/>
    <path d="M86 160 H126"/>
    <path d="M86 258 H124"/>
  </g>
  <g class="d-label" font-size="10" font-family="system-ui, sans-serif">
    <text x="254" y="45">гиалиновый хрящ: около 0,5 мм,</text>
    <text x="254" y="57">сводит трение в суставе к минимуму</text>
    <text x="254" y="79">губчатое вещество эпифиза,</text>
    <text x="254" y="91">в промежутках красный костный мозг</text>
    <text x="254" y="121">зона роста: здесь делятся клетки</text>
    <text x="254" y="133">и кость растёт в длину</text>
    <text x="254" y="163">полость с жёлтым костным мозгом</text>
    <text x="254" y="199">компактное вещество диафиза</text>
  </g>
  <g class="d-label" font-size="10" text-anchor="end" font-family="system-ui, sans-serif">
    <text x="82" y="151">надкостница:</text>
    <text x="82" y="163">сосуды и нервы,</text>
    <text x="82" y="175">рост в толщину,</text>
    <text x="82" y="187">а ещё срастание</text>
    <text x="82" y="199">переломов</text>
    <text x="82" y="255">эпифиз —</text>
    <text x="82" y="267">головка кости,</text>
    <text x="82" y="279">диафиз — тело</text>
  </g>

  <g class="d-warn" stroke-width="1.4" fill="none">
    <path d="M240 304 V314"/>
  </g>
  <g class="d-warn-t" font-size="11" font-weight="650" text-anchor="middle" font-family="system-ui, sans-serif">
    <text x="240" y="328">В длину кость растёт в шейках, в толщину — от надкостницы</text>
  </g>
</svg>
