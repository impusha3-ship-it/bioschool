<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 306" role="img" aria-label="Растительная клетка под световым микроскопом с пронумерованными частями. Один — клеточная оболочка снаружи, плотная и держит форму. Два — цитоплазма, полужидкое содержимое, в котором всё расположено. Три — ядро с ядрышком, хранит наследственное вещество. Четыре — вакуоль с клеточным соком, занимает почти половину клетки. Пять — хлоропласты, овальные тельца, в которых на свету образуются питательные вещества.">
  <g class="d-cell-wall">
    <rect x="20" y="26" width="280" height="186" rx="20"/>
  </g>
  <g class="d-cell-cytoplasm">
    <rect x="30" y="36" width="260" height="166" rx="14"/>
  </g>
  <g class="d-cell-vacuole">
    <rect x="150" y="76" width="126" height="104" rx="38"/>
  </g>
  <g class="d-cell-nucleus">
    <circle cx="78" cy="88" r="30"/>
  </g>
  <g class="d-cell-nucleolus">
    <circle cx="86" cy="82" r="11"/>
  </g>
  <g class="d-cell-chloroplast">
    <ellipse cx="72" cy="168" rx="15" ry="9" transform="rotate(-20 72 168)"/>
    <ellipse cx="118" cy="182" rx="15" ry="9" transform="rotate(10 118 182)"/>
    <ellipse cx="196" cy="56" rx="15" ry="9" transform="rotate(-12 196 56)"/>
    <ellipse cx="250" cy="60" rx="15" ry="9" transform="rotate(8 250 60)"/>
  </g>

  <g class="d-num-circle">
    <circle cx="160" cy="31" r="10"/>
    <circle cx="112" cy="142" r="10"/>
    <circle cx="66" cy="98" r="10"/>
    <circle cx="213" cy="128" r="10"/>
    <circle cx="250" cy="60" r="10"/>
  </g>
  <g class="d-num-text" font-size="12" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">
    <text x="160" y="35">1</text>
    <text x="112" y="146">2</text>
    <text x="66" y="102">3</text>
    <text x="213" y="132">4</text>
    <text x="250" y="64">5</text>
  </g>

  <g class="d-num-circle">
    <circle cx="16" cy="234" r="8"/>
    <circle cx="16" cy="256" r="8"/>
    <circle cx="16" cy="278" r="8"/>
    <circle cx="172" cy="234" r="8"/>
    <circle cx="172" cy="256" r="8"/>
  </g>
  <g class="d-num-text" font-size="11" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">
    <text x="16" y="238">1</text>
    <text x="16" y="260">2</text>
    <text x="16" y="282">3</text>
    <text x="172" y="238">4</text>
    <text x="172" y="260">5</text>
  </g>
  <g class="d-label" font-size="11" font-family="system-ui, sans-serif">
    <text x="30" y="238">клеточная оболочка</text>
    <text x="30" y="260">цитоплазма</text>
    <text x="30" y="282">ядро</text>
    <text x="186" y="238">вакуоль</text>
    <text x="186" y="260">хлоропласт</text>
  </g>

  <g class="d-verdict" font-size="11" font-family="system-ui, sans-serif">
    <text x="30" y="300">В школьный микроскоп надёжно видны 1, 3 и 4.</text>
  </g>
</svg>
