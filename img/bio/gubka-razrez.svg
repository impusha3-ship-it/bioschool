<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 336" role="img" aria-label="Губка в разрезе. Тело похоже на кубок, прикреплённый ко дну. Стенка тела пронизана множеством пор. Внутри — полость, наверху — широкое отверстие, устье. Полость выстлана жгутиковыми клетками: биение их жгутиков гонит воду внутрь через поры, а выходит вода через устье. Проходя мимо жгутиковых клеток, вода оставляет им мелкие частицы пищи, и клетки переваривают их внутри себя. Между наружным и внутренним слоями клеток лежит студенистое вещество с иглами скелета. Внизу вывод: у губки нет ни рта, ни кишечника, ни мышц — вода сама проходит сквозь тело, и губка всю жизнь процеживает её, не сходя с места.">
  <g class="d-head" font-size="11.5" font-weight="650" font-family="system-ui, sans-serif">
    <text x="8" y="14">Губка: тело, через которое течёт вода</text>
  </g>

  <!--
    Стенка кубка рисуется двумя контурами: наружный и внутренний слой
    клеток, между ними студенистое вещество. Разрывы в стенке — поры.
  -->
  <g class="d-sub">
    <path d="M60 234 C52 180 54 110 70 62 L96 62 C84 110 84 180 92 234 Z"/>
    <path d="M172 234 C180 180 180 110 168 62 L194 62 C210 110 212 180 204 234 Z"/>
  </g>
  <g class="d-capsule">
    <rect x="54" y="234" width="156" height="12" rx="4"/>
  </g>

  <!-- Иглы скелета в студенистом слое. -->
  <g class="d-stem" fill="none">
    <path d="M70 110 L80 124 M66 160 L78 170 M72 204 L82 214 M184 110 L176 124 M190 160 L180 170 M186 204 L178 214"/>
  </g>

  <!-- Поры и путь воды: внутрь сквозь стенку, наружу через устье. -->
  <g class="d-lead" fill="none">
    <path d="M8 100 H70 M8 150 H66 M8 196 H70"/>
    <path d="M132 150 V40"/>
    <path d="M214 100 H174 M214 146 H140 M214 192 H178"/>
    <path d="M124 50 L132 36 L140 50"/>
    <path d="M36 94 L44 100 L36 106 M36 144 L44 150 L36 156 M36 190 L44 196 L36 202"/>
  </g>
  <g class="d-stem-end">
    <circle cx="96" cy="100" r="3"/>
    <circle cx="92" cy="150" r="3"/>
    <circle cx="96" cy="196" r="3"/>
    <circle cx="168" cy="100" r="3"/>
    <circle cx="172" cy="150" r="3"/>
    <circle cx="168" cy="196" r="3"/>
  </g>

  <g class="d-label" font-size="11" font-weight="650" font-family="system-ui, sans-serif">
    <text x="146" y="32">Устье</text>
    <text x="220" y="104">Поры</text>
    <text x="220" y="150">Полость</text>
    <text x="220" y="196">Жгутиковые</text>
  </g>
  <g class="d-row" font-size="11" font-family="system-ui, sans-serif">
    <text x="220" y="118">вода входит</text>
    <text x="220" y="164">вода проходит</text>
    <text x="220" y="210">клетки: гонят</text>
    <text x="220" y="224">воду и ловят</text>
    <text x="220" y="238">частицы пищи</text>
    <text x="8" y="262">Иглы в стенке — скелет из извести или кремния.</text>
  </g>

  <g class="d-eq-rule">
    <line x1="8" y1="276" x2="312" y2="276"/>
  </g>

  <g class="d-verdict" font-size="11" font-family="system-ui, sans-serif">
    <text x="8" y="296">Ни рта, ни кишечника, ни мышц: губка всю жизнь</text>
    <text x="8" y="310">сидит на месте и процеживает воду через себя,</text>
    <text x="8" y="324">а пищу переваривает прямо в клетках.</text>
  </g>
</svg>
