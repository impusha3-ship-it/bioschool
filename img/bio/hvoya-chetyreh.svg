  <g class="d-label" font-size="10" text-anchor="end" font-family="system-ui, sans-serif">
    <text x="200" y="89">по 2 в пучке, длинные 5—7 см</text>
    <text x="200" y="163">поодиночке, короткие и жёсткие</text>
    <text x="200" y="237">пучками по 20—40, опадают на зиму</text>
    <text x="200" y="311">плоские, двумя рядами, снизу полоски</text>
  </g>
  <g class="d-label" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">
    <text x="240" y="336">Смотри не на длину, а на то, как хвоинки сидят: по одной, парами или пучком.</text>
  </g>
