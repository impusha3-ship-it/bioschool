<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 302" role="img" aria-label="Почва в разрезе, четыре слоя сверху вниз. Подстилка: опавшие листья и хвоя, здесь работают грибы и бактерии-разрушители. Перегной: тёмный слой из переработанных остатков, самый живой — здесь дождевые черви, личинки, кроты. Минеральный слой: песок и глина, живого мало, встречаются глубокие корни. Материнская порода: камень, жизни нет. Справа полосы показывают, как убывает количество живого с глубиной. Внизу подпись: почва — не земля вообще, а тонкая живая плёнка сверху, и восстанавливается она столетиями.">
  <g class="d-head" font-size="11" font-weight="650" font-family="system-ui, sans-serif">
    <text x="8" y="13">Слой</text>
    <text x="112" y="13">Что в нём</text>
    <text x="248" y="13">Живого</text>
  </g>

  <g class="d-layer-1">
    <rect x="8" y="20" width="96" height="48" rx="4"/>
  </g>
  <g class="d-layer-2">
    <rect x="8" y="68" width="96" height="70" rx="4"/>
  </g>
  <g class="d-layer-3">
    <rect x="8" y="138" width="96" height="60" rx="4"/>
  </g>
  <g class="d-layer-4">
    <rect x="8" y="198" width="96" height="42" rx="4"/>
  </g>

  <g class="d-row" font-size="11" font-weight="650" font-family="system-ui, sans-serif">
    <text x="16" y="40">Подстилка</text>
    <text x="16" y="96">Перегной</text>
    <text x="16" y="164">Песок</text>
    <text x="16" y="178">и глина</text>
    <text x="16" y="222">Камень</text>
  </g>
  <g class="d-same" font-size="10" font-family="system-ui, sans-serif">
    <text x="16" y="54">листья, хвоя</text>
    <text x="16" y="110">тёмный, рыхлый</text>
  </g>

  <g class="d-label" font-size="11" font-family="system-ui, sans-serif">
    <text x="112" y="40">грибы и бактерии</text>
    <text x="112" y="54">разбирают опад</text>
    <text x="112" y="90">дождевые черви,</text>
    <text x="112" y="104">личинки, кроты,</text>
    <text x="112" y="118">корни трав</text>
    <text x="112" y="162">глубокие корни</text>
    <text x="112" y="176">деревьев,</text>
    <text x="112" y="190">редкие бактерии</text>
    <text x="112" y="222">жизни нет</text>
  </g>

  <g class="d-bar-most">
    <rect x="248" y="30" width="60" height="14" rx="3"/>
    <rect x="248" y="88" width="64" height="14" rx="3"/>
  </g>
  <g class="d-bar-few">
    <rect x="248" y="158" width="14" height="14" rx="3"/>
    <rect x="248" y="216" width="4" height="14" rx="2"/>
  </g>

  <g class="d-verdict" font-size="12" font-family="system-ui, sans-serif">
    <text x="8" y="266">Почва — не земля вообще, а тонкая живая плёнка</text>
    <text x="8" y="280">сверху. Сантиметр перегноя нарастает около ста лет,</text>
    <text x="8" y="294">а смыть его дождём можно за один сезон.</text>
  </g>
</svg>
