<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" role="img" aria-label="Слева молочная планария, если смотреть на неё сверху: вытянутое листовидное тело с двумя небольшими выростами по бокам головного конца и заострённым задним концом. На переднем конце два глазка, под ними два головных нервных узла, от которых вдоль тела идут два нервных ствола. В середине тела лежит глотка, за ней рот; от глотки отходит сильно разветвлённый кишечник — одна ветвь вперёд и две назад. Через всё тело проведена пунктирная ось: правая половина выглядит как зеркальное отражение левой, это двусторонняя симметрия. Справа разрез стенки тела: сверху покров из клеток с ресничками, под ним три слоя мышц — кольцевые, косые и продольные, и все четыре слоя вместе называют кожно-мускульным мешком. Ещё ниже мягкая ткань с внутренними органами: полости тела у плоских червей нет. Три слоя мышц позволяют планарии вытягиваться, сжиматься и скручивать тело.">
  <g class="d-head" font-size="11" font-weight="650" font-family="system-ui, sans-serif">
    <text x="8" y="14">Молочная планария: как устроено тело</text>
  </g>

  <g class="d-capsule-t" font-size="12" font-family="system-ui, sans-serif">
    <text x="10" y="36">Вид сверху</text>
    <text x="268" y="36">Стенка тела в разрезе</text>
  </g>

  <!-- Ось симметрии: ради неё половина рисунка и сделана. -->
  <g class="d-mark" stroke-width="1.2" stroke-dasharray="5 4" fill="none">
    <path d="M80 44 V266"/>
  </g>

  <g class="d-leaf">
    <path d="M80 56 C68 56 59 61 54 71 L40 78 L52 90 C47 110 44 134 44 162 C44 212 58 248 80 266 C102 248 116 212 116 162 C116 134 113 110 108 90 L120 78 L106 71 C101 61 92 56 80 56 Z"/>
  </g>

  <!-- Кишечник: одна ветвь вперёд, две назад, и все с отростками. -->
  <g class="d-stem" stroke-width="2" fill="none">
    <path d="M80 150 V88"/>
    <path d="M80 132 L64 120 M80 132 L96 120 M80 112 L66 100 M80 112 L94 100"/>
    <path d="M74 162 C68 190 66 218 72 244"/>
    <path d="M86 162 C92 190 94 218 88 244"/>
    <path d="M72 180 L60 172 M70 204 L58 198 M88 180 L100 172 M90 204 L102 198"/>
  </g>

  <!-- Глотка: мускулистая трубка, которую планария высовывает наружу. -->
  <g class="d-capsule">
    <rect x="73" y="140" width="14" height="26" rx="6"/>
  </g>

  <!-- Нервная система: два узла в голове и два ствола вдоль тела. -->
  <g class="d-root" stroke-width="1.8" fill="none">
    <path d="M62 80 C56 120 56 200 66 250"/>
    <path d="M98 80 C104 120 104 200 94 250"/>
    <path d="M62 80 H98"/>
  </g>
  <g class="d-root-t">
    <circle cx="62" cy="80" r="4"/>
    <circle cx="98" cy="80" r="4"/>
  </g>
  <g class="d-stem-end">
    <circle cx="72" cy="68" r="3"/>
    <circle cx="88" cy="68" r="3"/>
  </g>

  <g class="d-lead" stroke-width="1" fill="none">
    <path d="M126 66 H92"/>
    <path d="M126 90 H102"/>
    <path d="M126 120 H98"/>
    <path d="M126 156 H90"/>
    <path d="M126 200 H106"/>
    <path d="M126 258 H86"/>
  </g>
  <g class="d-label" font-size="10" font-family="system-ui, sans-serif">
    <text x="130" y="69">два глазка</text>
    <text x="130" y="93">головные нервные узлы</text>
    <text x="130" y="117">разветвлённый кишечник</text>
    <text x="130" y="129">доносит пищу до всех частей</text>
    <text x="130" y="159">глотка, под ней рот</text>
    <text x="130" y="203">два нервных ствола</text>
    <text x="130" y="261">задний конец заострён</text>
  </g>

  <!-- Стенка тела: покров и три слоя мышц, под ними мягкая ткань. -->
  <g class="d-wall-skin">
    <rect x="268" y="52" width="202" height="24"/>
  </g>
  <g class="d-mark" stroke-width="1.2" fill="none">
    <path d="M276 52 V44 M288 52 V44 M300 52 V44 M312 52 V44 M324 52 V44 M336 52 V44 M348 52 V44 M360 52 V44 M372 52 V44 M384 52 V44 M396 52 V44 M408 52 V44 M420 52 V44 M432 52 V44 M444 52 V44 M456 52 V44"/>
  </g>

  <g class="d-wall-muscle">
    <rect x="268" y="76" width="202" height="30"/>
    <rect x="268" y="106" width="202" height="30"/>
    <rect x="268" y="136" width="202" height="30"/>
  </g>
  <g class="d-wall-fibre" stroke-width="1.4" fill="none">
    <path d="M280 80 V102 M296 80 V102 M312 80 V102 M328 80 V102 M344 80 V102 M360 80 V102 M376 80 V102 M392 80 V102 M408 80 V102 M424 80 V102 M440 80 V102 M456 80 V102"/>
    <path d="M274 132 L292 110 M298 132 L316 110 M322 132 L340 110 M346 132 L364 110 M370 132 L388 110 M394 132 L412 110 M418 132 L436 110 M442 132 L460 110"/>
    <path d="M276 144 H462 M276 152 H462 M276 160 H462"/>
  </g>

  <g class="d-sub">
    <rect x="268" y="166" width="202" height="56" rx="6"/>
  </g>

  <!-- Скоба: все четыре верхних слоя и есть кожно-мускульный мешок. -->
  <g class="d-mark" stroke-width="1.4" fill="none">
    <path d="M262 52 H256 V166 H262"/>
  </g>
  <g class="d-label" font-size="10" font-family="system-ui, sans-serif">
    <text x="276" y="68">покров из клеток с ресничками</text>
    <text x="276" y="95">кольцевые мышцы</text>
    <text x="276" y="125">косые мышцы</text>
    <text x="276" y="155">продольные мышцы</text>
    <text x="276" y="190">мягкая ткань и внутренние органы</text>
    <text x="276" y="206">полости тела у плоских червей нет</text>
  </g>
  <g class="d-capsule-t" font-size="11" font-family="system-ui, sans-serif">
    <text x="256" y="240">Покров и три слоя мышц вместе —</text>
    <text x="256" y="254">кожно-мускульный мешок</text>
  </g>

  <g class="d-warn" stroke-width="1.4" fill="none">
    <path d="M240 282 V294"/>
  </g>
  <g class="d-warn-t" font-size="11" font-weight="650" text-anchor="middle" font-family="system-ui, sans-serif">
    <text x="240" y="308">Правая половина — зеркало левой: это двусторонняя симметрия</text>
  </g>
  <g class="d-label" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">
    <text x="240" y="324">Три слоя мышц дают вытянуться, сжаться и скрутить тело.</text>
  </g>
</svg>
