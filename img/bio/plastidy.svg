<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 268" role="img" aria-label="Три вида пластид в клетках растений. Лейкопласты бесцветные, в них накапливается запас питательных веществ, встречаются в клубне картофеля и в корне. Хлоропласты зелёные, содержат хлорофилл, в них идёт фотосинтез; они есть в листе и в зелёном стебле. Хромопласты жёлтые и красные, дают окраску цветкам, осенним листьям и зрелым плодам. Стрелки показывают, что пластиды превращаются одна в другую: лейкопласт может стать хлоропластом, когда клубень картофеля зеленеет на свету, а хлоропласт становится хромопластом осенью, когда разрушается хлорофилл.">
  <g class="d-head" font-size="11.5" font-weight="650" font-family="system-ui, sans-serif">
    <text x="8" y="14">Три вида пластид</text>
  </g>

  <g class="d-sub">
    <ellipse cx="54" cy="52" rx="28" ry="17"/>
  </g>
  <g class="d-cell-chloroplast">
    <ellipse cx="160" cy="52" rx="28" ry="17"/>
  </g>
  <g class="d-cap">
    <path d="M266 52 m-28 0 a28 17 0 1 0 56 0 a28 17 0 1 0 -56 0"/>
  </g>

  <g class="d-label" font-size="11.5" font-weight="650" font-family="system-ui, sans-serif">
    <text x="54" y="88" text-anchor="middle">Лейкопласты</text>
    <text x="160" y="88" text-anchor="middle">Хлоропласты</text>
    <text x="266" y="88" text-anchor="middle">Хромопласты</text>
  </g>

  <g class="d-row" font-size="11" font-family="system-ui, sans-serif">
    <text x="54" y="104" text-anchor="middle">бесцветные</text>
    <text x="54" y="118" text-anchor="middle">запас веществ</text>
    <text x="54" y="132" text-anchor="middle">клубень, корень</text>
    <text x="160" y="104" text-anchor="middle">зелёные</text>
    <text x="160" y="118" text-anchor="middle">фотосинтез</text>
    <text x="160" y="132" text-anchor="middle">лист, стебель</text>
    <text x="266" y="104" text-anchor="middle">жёлтые, красные</text>
    <text x="266" y="118" text-anchor="middle">окраска</text>
    <text x="266" y="132" text-anchor="middle">плод, лепесток</text>
  </g>

  <!-- Превращения: лейкопласт — хлоропласт — хромопласт. -->
  <g class="d-stem" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M40 162 H120 M112 156 L120 162 L112 168"/>
    <path d="M200 162 H280 M272 156 L280 162 L272 168"/>
  </g>

  <g class="d-row" font-size="11" font-family="system-ui, sans-serif">
    <text x="80" y="182" text-anchor="middle">клубень позеленел</text>
    <text x="80" y="196" text-anchor="middle">на свету</text>
    <text x="240" y="182" text-anchor="middle">осенью хлорофилл</text>
    <text x="240" y="196" text-anchor="middle">разрушился</text>
  </g>

  <g class="d-eq-rule">
    <line x1="8" y1="216" x2="312" y2="216"/>
  </g>

  <g class="d-verdict" font-size="11" font-family="system-ui, sans-serif">
    <text x="8" y="234">Пластиды превращаются одна в другую</text>
    <text x="8" y="250">Зелёный клубень есть нельзя: в нём яд</text>
  </g>
</svg>
