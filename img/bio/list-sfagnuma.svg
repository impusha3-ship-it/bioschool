<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 250" role="img" aria-label="Кусочек листа сфагнума под микроскопом. Лист в одну клетку толщиной, и клетки в нём двух видов. Узкие живые клетки с хлоропластами соединены друг с другом и образуют сплошную зелёную сеть — в них идёт фотосинтез. Между ними лежат крупные пустые клетки без цитоплазмы, только оболочки: они прозрачны и набираются водой, и таких клеток две трети поверхности листа.">
  <g class="d-head" font-size="11" font-weight="650" font-family="system-ui, sans-serif">
    <text x="8" y="14">Лист сфагнума под микроскопом</text>
  </g>

  <!-- Зелёная сеть рисуется первой и сплошной: живые клетки соединены друг
       с другом, и по ним органические вещества уходят в стебель. -->
  <g class="d-cell-chloroplast">
    <rect x="20" y="30" width="290" height="180" rx="10"/>
  </g>

  <!-- Пустые водоносные клетки — дыры в этой сети. Они прозрачны, поэтому
       нарисованы цветом бумаги: в них ни цитоплазмы, ни хлоропластов. -->
  <g class="d-cell-vacuole">
    <rect x="32" y="44" width="79" height="68" rx="14"/>
    <rect x="124" y="44" width="79" height="68" rx="14"/>
    <rect x="215" y="44" width="83" height="68" rx="14"/>
    <rect x="32" y="128" width="79" height="68" rx="14"/>
    <rect x="124" y="128" width="79" height="68" rx="14"/>
    <rect x="215" y="128" width="83" height="68" rx="14"/>
  </g>

  <!-- Пора: через неё вода и входит в мёртвую клетку. Кружок цвета
       бумаги — это отверстие, а не ядро: ядра в мёртвой клетке нет. -->
  <g class="d-cell-vacuole">
    <circle cx="72" cy="78" r="7"/>
    <circle cx="163" cy="78" r="7"/>
    <circle cx="256" cy="78" r="7"/>
    <circle cx="72" cy="162" r="7"/>
    <circle cx="163" cy="162" r="7"/>
    <circle cx="256" cy="162" r="7"/>
  </g>

  <g class="d-lead" stroke-width="1.2" fill="none">
    <path d="M312 60 H332"/>
    <path d="M312 150 H332"/>
  </g>
  <g class="d-label" font-size="11" font-family="system-ui, sans-serif">
    <text x="336" y="50">живые</text>
    <text x="336" y="62">зелёные</text>
    <text x="336" y="74">клетки</text>
    <text x="336" y="140">мёртвые</text>
    <text x="336" y="152">водоносные</text>
    <text x="336" y="164">клетки</text>
  </g>

  <g class="d-label" font-size="11" font-family="system-ui, sans-serif">
    <text x="20" y="228">Зелёная сеть кормит мох, пустые клетки набирают воду —</text>
    <text x="20" y="242">в 20–25 раз больше собственной массы.</text>
  </g>
</svg>
