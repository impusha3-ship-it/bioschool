<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f7f3ea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161a16" media="(prefers-color-scheme: dark)">
  <title>Биология 5-9</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <meta name="description" content="Уроки биологии 5-9 класса: конспекты, схемы и тренажёры.">
  <meta property="og:title" content="Биология 5-9">
  <meta property="og:description" content="Уроки биологии 5-9 класса: конспекты, схемы и тренажёры.">
  <meta property="og:type" content="website">
  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/motion.css">
  <link rel="stylesheet" href="./css/games.css">
</head>
<body>
  <!-- Первым Tab уводит в содержимое, мимо шапки. Кнопка, а не ссылка:
       адрес после решётки занят маршрутом, и «#app» увёл бы на «страница
       не найдена». -->
  <button class="skip-link" id="skip" type="button">К содержанию</button>
  <!-- Метка, по которой шапка узнаёт, что страница уехала вниз. Наблюдатель
       вместо обработчика прокрутки: тот считает на каждый пиксель. -->
  <div class="scroll-sentinel" id="sentinel" aria-hidden="true"></div>
  <header class="site-header" id="header">
    <a class="site-header__home" href="#/">
      <svg class="site-header__mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M12 21V11"/>
        <path d="M12 12.6C8.1 12.6 5.9 10 5.9 6.1 9.8 6.1 12 8.7 12 12.6Z"/>
        <path d="M12 16.8c3.5 0 5.6-2.3 5.6-5.8-3.5 0-5.6 2.3-5.6 5.8Z"/>
      </svg>
      Биология
    </a>
    <!--
      Разделы — ссылками со значком, и текущий подсвечен (aria-current ставит
      app.js на каждом переходе). Почёт выделен цветом: ради него сюда и
      заходят между уроками. На узком экране подписи прячутся, значки остаются.
    -->
    <nav class="site-nav" aria-label="Разделы сайта">
      <a class="site-nav__link" href="#/" data-pages="home class lesson">
        <svg class="site-nav__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M12 6.5C10.4 5.2 8 4.5 4 4.5v14c4 0 6.4.7 8 2 1.6-1.3 4-2 8-2v-14c-4 0-6.4.7-8 2Z"/>
          <path d="M12 6.5v14"/>
        </svg>
        <span class="site-nav__text">Уроки</span>
      </a>
      <a class="site-nav__link" href="#/models" data-pages="models">
        <svg class="site-nav__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M12 3.2 20 7.6v8.8L12 20.8 4 16.4V7.6Z"/>
          <path d="M4 7.6 12 12l8-4.4M12 12v8.8"/>
        </svg>
        <span class="site-nav__text">Модели</span>
      </a>
      <a class="site-nav__link site-nav__link--honor" href="#/tablo" data-pages="tablo">
        <svg class="site-nav__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M7.5 4h9v5.5a4.5 4.5 0 0 1-9 0Z"/>
          <path d="M7.5 6H4.5c0 2.6 1.3 4.2 3.4 4.4M16.5 6h3c0 2.6-1.3 4.2-3.4 4.4"/>
          <path d="M12 14v3.5M8 20.5h8M9.5 20.5c0-1.9 1-3 2.5-3s2.5 1.1 2.5 3"/>
        </svg>
        <span class="site-nav__text">Почёт</span>
      </a>
      <a class="site-nav__link" id="level" href="#/me" data-pages="me">
        <svg class="site-nav__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M4 20h16"/>
          <path d="M7 20v-5M12 20v-9M17 20V5"/>
        </svg>
        <span class="site-nav__text" id="level-text">Прогресс</span>
      </a>
    </nav>
    <button class="site-header__theme" id="theme" type="button">Тема</button>
    <a class="site-header__who" id="who" href="#/login">Войти</a>
  </header>
  <!--
    Место для плашки «учитель проверил». Стоит над страницей, а не внутри неё:
    страница перерисовывается на каждом переходе, а новость про балл должна
    висеть, пока ученик её не тронет.
  -->
  <div id="notice"></div>
  <main id="app" class="app" tabindex="-1">
    <p class="loading">Загрузка…</p>
  </main>
  <footer class="site-footer">
    <a href="#/sources">Источники материалов</a>
  </footer>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
