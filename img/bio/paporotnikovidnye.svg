<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-label="Три отдела папоротникообразных рядом. Слева папоротник: подземное корневище с придаточными корнями, из него поднимается розетка крупных перистых вай, а рядом молодая вайя, свёрнутая спиралью-улиткой. В середине хвощ полевой: прямой членистый стебель с кольцами в узлах, от каждого узла отходит мутовка тонких веточек, направленных вверх, на верхушке спороносный колосок. Справа плаун: длинный стелющийся по земле побег с мелкими листьями и придаточными корнями, от него поднимаются два прямостоячих побега со спороносными колосками. У всех трёх есть настоящие корни, стебель и листья.">
  <g class="d-head" font-size="11" font-weight="650" font-family="system-ui, sans-serif">
    <text x="8" y="14">Папоротникообразные: три отдела, один план строения</text>
  </g>

