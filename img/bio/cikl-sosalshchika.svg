<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="Круг из шести шагов в жизненном цикле печёночного сосальщика. Взрослый червь живёт в печени коровы или овцы: рогатый скот здесь окончательный хозяин. Яйца червя поступают в кишечник хозяина и выводятся наружу с калом. Развиваются яйца только в воде: там из яйца выходит свободноплавающая личинка с ресничками. Личинка проникает в тело малого прудовика — это промежуточный хозяин; в нём она растёт и размножается, образуя новое поколение личинок. Эти личинки выходят из прудовика в воду, расселяются по водоёму, прикрепляются к листьям растений и покрываются оболочками, превращаясь в цисты. Когда скот пьёт воду или ест траву, он проглатывает цисты: в кишечнике оболочка лопается, и молодой сосальщик проникает в печень, круг замыкается. Без малого прудовика цикл обрывается.">
  <g class="d-head" font-size="11" font-weight="650" font-family="system-ui, sans-serif">
    <text x="8" y="14">Жизненный цикл печёночного сосальщика</text>
  </g>

  <g class="d-stem" stroke-width="1.8" fill="none">
    <path d="M154 58 H176"/>
    <path d="M310 58 H332"/>
    <path d="M396 96 V162"/>
    <path d="M332 196 H310"/>
    <path d="M170 196 H148"/>
    <path d="M84 162 V102"/>
  </g>
  <g class="d-stem-end">
    <path d="M182 58 L174 54 L174 62 Z"/>
    <path d="M338 58 L330 54 L330 62 Z"/>
    <path d="M396 170 L392 162 L400 162 Z"/>
    <path d="M304 196 L312 192 L312 200 Z"/>
    <path d="M142 196 L150 192 L150 200 Z"/>
    <path d="M84 94 L80 102 L88 102 Z"/>
  </g>

  <g class="d-capsule">
    <rect x="14" y="30" width="140" height="58" rx="8"/>
    <rect x="182" y="30" width="128" height="58" rx="8"/>
    <rect x="338" y="30" width="128" height="58" rx="8"/>
    <rect x="338" y="170" width="128" height="58" rx="8"/>
    <rect x="176" y="170" width="128" height="58" rx="8"/>
    <rect x="14" y="170" width="128" height="58" rx="8"/>
  </g>

  <g class="d-capsule-t" font-size="12" font-family="system-ui, sans-serif">
    <text x="26" y="50">Взрослый червь</text>
    <text x="194" y="50">Яйца наружу</text>
    <text x="350" y="50">Личинка в воде</text>
    <text x="350" y="190">Малый прудовик</text>
    <text x="188" y="190">Цисты на траве</text>
    <text x="26" y="190">Скот съел траву</text>
  </g>
  <g class="d-label" font-size="10" font-family="system-ui, sans-serif">
    <text x="26" y="66">в печени коровы</text>
    <text x="26" y="78">или овцы</text>
    <text x="194" y="66">через кишечник</text>
    <text x="194" y="78">и наружу с калом</text>
    <text x="350" y="66">вышла из яйца,</text>
    <text x="350" y="78">плавает ресничками</text>
    <text x="350" y="204">в нём она растёт</text>
    <text x="350" y="216">и даёт новых личинок</text>
    <text x="188" y="204">личинки вышли в воду</text>
    <text x="188" y="216">и осели на листьях</text>
    <text x="26" y="204">циста лопается,</text>
    <text x="26" y="216">червь идёт в печень</text>
  </g>

  <!-- Место, где круг рвётся сам собой, если прудовика в водоёме нет. -->
  <g class="d-warn" stroke-width="1.4" fill="none">
    <path d="M240 232 V248"/>
  </g>
  <g class="d-warn-t" font-size="11" font-weight="650" text-anchor="middle" font-family="system-ui, sans-serif">
    <text x="240" y="262">Без малого прудовика цикл обрывается</text>
  </g>

  <g class="d-label" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">
    <text x="240" y="282">Яйца развиваются только в воде — отсюда и опасность водопоя.</text>
  </g>
</svg>
