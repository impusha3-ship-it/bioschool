<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 350" role="img" aria-label="Строение папоротника щитовника. Под землёй лежит толстое корневище, от него вниз отходят придаточные корни. Вверх от корневища поднимаются крупные перистые листья — вайи, и одна молодая вайя, свёрнутая спиралью-улиткой. Справа под лупой показан кусочек вайи снизу: на нижней стороне рядами сидят бурые кучки — сорусы, в них лежат спорангии со спорами.">
  <g class="d-head" font-size="11" font-weight="650" font-family="system-ui, sans-serif">
    <text x="8" y="14">Папоротник: что где искать</text>
  </g>

  <g class="d-soil">
    <path d="M8 268 H472 V310 H8 Z"/>
  </g>

