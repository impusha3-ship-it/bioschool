<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 278" role="img" aria-label="Химический состав клетки двумя столбцами. Неорганические вещества: вода — от 40 до 95 процентов массы клетки, минеральные соли — 1—1,5 процента. Органические вещества: белки 10—20 процентов, жиры 1—5, нуклеиновые кислоты 1—2, углеводы 0,2—2 процента. Внизу вывод: по массе в клетке больше всего воды, а работу делают органические вещества.">
  <g class="d-head" font-size="11.5" font-weight="650" font-family="system-ui, sans-serif">
    <text x="8" y="16">Химический состав клетки</text>
  </g>
  <rect class="d-sub" x="8" y="30" width="146" height="24" rx="12"/>
  <text class="d-head" x="81" y="46" font-size="11.5" text-anchor="middle">Неорганические</text>
  <rect class="d-sub" x="166" y="30" width="146" height="24" rx="12"/>
  <text class="d-head" x="239" y="46" font-size="11.5" text-anchor="middle">Органические</text>
  <text class="d-row" x="14" y="76" font-size="12" font-weight="650" font-family="system-ui, sans-serif">Вода</text>
  <text class="d-head" x="14" y="91" font-size="11">40—95% массы клетки</text>
  <text class="d-row" x="14" y="114" font-size="12" font-weight="650" font-family="system-ui, sans-serif">Минеральные соли</text>
  <text class="d-head" x="14" y="129" font-size="11">1—1,5% массы клетки</text>
  <text class="d-row" x="172" y="76" font-size="12" font-weight="650" font-family="system-ui, sans-serif">Белки</text>
  <text class="d-head" x="172" y="91" font-size="11">10—20%</text>
  <text class="d-row" x="172" y="114" font-size="12" font-weight="650" font-family="system-ui, sans-serif">Жиры</text>
  <text class="d-head" x="172" y="129" font-size="11">1—5%</text>
  <text class="d-row" x="172" y="152" font-size="12" font-weight="650" font-family="system-ui, sans-serif">Нуклеиновые кислоты</text>
  <text class="d-head" x="172" y="167" font-size="11">1—2%</text>
  <text class="d-row" x="172" y="190" font-size="12" font-weight="650" font-family="system-ui, sans-serif">Углеводы</text>
  <text class="d-head" x="172" y="205" font-size="11">0,2—2%</text>

  <g class="d-eq-rule">
    <line x1="8" y1="230" x2="312" y2="230"/>
  </g>

  <g class="d-verdict" font-size="11" font-family="system-ui, sans-serif">
    <text x="8" y="248">Больше всего по массе — вода</text>
    <text x="8" y="264">Работу делают органические вещества</text>
  </g>
</svg>
