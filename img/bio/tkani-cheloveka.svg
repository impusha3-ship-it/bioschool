<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 440" role="img" aria-label="Четыре типа тканей человека, у каждого показано соотношение клеток и межклеточного вещества. Эпителиальная: клетки лежат вплотную в два слоя, межклеточного вещества почти нет; работа — защита и всасывание; встречается в коже, слизистых оболочках и железах. Соединительная: клеток мало, они разбросаны среди обильного межклеточного вещества и волокон; работа — опора, транспорт и защита; это кость, хрящ, жир, кровь и лимфа. Мышечная: клетки вытянуты в длинные волокна с поперечными полосками и умеют сокращаться; работа — движение тела и органов; это скелетные мышцы, сердце и стенки сосудов. Нервная: клетки с отростками, короткими и одним длинным; работа — проводить сигнал; это мозг, нервы и нервные узлы. Вывод: соотношение клеток и межклеточного вещества выдаёт тип ткани уже под микроскопом.">
  <g class="d-head" font-size="11.5" font-weight="650" font-family="system-ui, sans-serif">
    <text x="8" y="16">Четыре ткани человека</text>
  </g>

  <!-- 1. Эпителиальная: клетки вплотную, вещества между ними нет -->
  <g class="d-cell-cytoplasm">
    <rect x="10" y="44" width="20" height="18" rx="3"/>
    <rect x="31" y="44" width="20" height="18" rx="3"/>
    <rect x="52" y="44" width="20" height="18" rx="3"/>
    <rect x="73" y="44" width="20" height="18" rx="3"/>
    <rect x="10" y="63" width="20" height="18" rx="3"/>
    <rect x="31" y="63" width="20" height="18" rx="3"/>
    <rect x="52" y="63" width="20" height="18" rx="3"/>
    <rect x="73" y="63" width="20" height="18" rx="3"/>
  </g>
  <g class="d-cell-nucleus">
    <circle cx="20" cy="53" r="3"/><circle cx="41" cy="53" r="3"/>
    <circle cx="62" cy="53" r="3"/><circle cx="83" cy="53" r="3"/>
    <circle cx="20" cy="72" r="3"/><circle cx="41" cy="72" r="3"/>
    <circle cx="62" cy="72" r="3"/><circle cx="83" cy="72" r="3"/>
  </g>
  <g class="d-mark" stroke-width="1.5"><line x1="10" y1="84" x2="93" y2="84"/></g>
  <text class="d-row" x="108" y="48" font-size="12" font-weight="650" font-family="system-ui, sans-serif">Эпителиальная</text>
  <text class="d-head" x="108" y="64" font-size="11" font-family="system-ui, sans-serif">клетки вплотную, вещества нет</text>
  <text class="d-head" x="108" y="78" font-size="11" font-family="system-ui, sans-serif">защита и всасывание</text>
  <text class="d-head" x="108" y="92" font-size="10.5" font-family="system-ui, sans-serif">кожа, слизистые, железы</text>

  <!-- 2. Соединительная: клеток мало, межклеточного вещества много -->
  <g class="d-mezo"><rect x="10" y="118" width="83" height="60" rx="4"/></g>
  <g class="d-mark" stroke-width="1.2">
    <path d="M12 130 Q40 122 91 134" fill="none"/>
    <path d="M12 152 Q46 144 91 156" fill="none"/>
    <path d="M12 172 Q44 164 91 175" fill="none"/>
  </g>
  <g class="d-cell-cytoplasm">
    <rect x="18" y="134" width="16" height="12" rx="5"/>
    <rect x="57" y="126" width="16" height="12" rx="5"/>
    <rect x="30" y="158" width="16" height="12" rx="5"/>
    <rect x="66" y="156" width="16" height="12" rx="5"/>
  </g>
  <g class="d-cell-nucleus">
    <circle cx="26" cy="140" r="2.6"/><circle cx="65" cy="132" r="2.6"/>
    <circle cx="38" cy="164" r="2.6"/><circle cx="74" cy="162" r="2.6"/>
  </g>
  <text class="d-row" x="108" y="129" font-size="12" font-weight="650" font-family="system-ui, sans-serif">Соединительная</text>
  <text class="d-head" x="108" y="145" font-size="11" font-family="system-ui, sans-serif">мало клеток, много вещества</text>
  <text class="d-head" x="108" y="159" font-size="11" font-family="system-ui, sans-serif">опора, транспорт, защита</text>
  <text class="d-head" x="108" y="173" font-size="10.5" font-family="system-ui, sans-serif">кость, хрящ, жир, кровь, лимфа</text>

  <!-- 3. Мышечная: длинные волокна с поперечной исчерченностью -->
  <g class="d-cell-cytoplasm">
    <rect x="10" y="214" width="83" height="20" rx="9"/>
    <rect x="10" y="240" width="83" height="20" rx="9"/>
  </g>
  <g class="d-mark" stroke-width="1.4" opacity="0.45">
    <line x1="28" y1="219" x2="28" y2="229"/><line x1="40" y1="219" x2="40" y2="229"/>
    <line x1="64" y1="219" x2="64" y2="229"/><line x1="76" y1="219" x2="76" y2="229"/>
    <line x1="28" y1="245" x2="28" y2="255"/><line x1="40" y1="245" x2="40" y2="255"/>
    <line x1="64" y1="245" x2="64" y2="255"/><line x1="76" y1="245" x2="76" y2="255"/>
  </g>
  <g class="d-cell-nucleus">
    <circle cx="17" cy="224" r="2.6"/><circle cx="52" cy="224" r="2.6"/><circle cx="87" cy="224" r="2.6"/>
    <circle cx="17" cy="250" r="2.6"/><circle cx="52" cy="250" r="2.6"/><circle cx="87" cy="250" r="2.6"/>
  </g>
  <text class="d-row" x="108" y="224" font-size="12" font-weight="650" font-family="system-ui, sans-serif">Мышечная</text>
  <text class="d-head" x="108" y="240" font-size="11" font-family="system-ui, sans-serif">клетки-волокна, сокращаются</text>
  <text class="d-head" x="108" y="254" font-size="11" font-family="system-ui, sans-serif">движение тела и органов</text>
  <text class="d-head" x="108" y="268" font-size="10.5" font-family="system-ui, sans-serif">мышцы, сердце, сосуды</text>

  <!-- 4. Нервная: тело клетки, короткие дендриты и один длинный аксон -->
  <g class="d-lead" stroke-width="1.4" fill="none">
    <path d="M32 322 L14 306"/>
    <path d="M32 322 L12 322"/>
    <path d="M32 322 L16 340"/>
    <path d="M32 322 L30 302"/>
    <path d="M41 322 L93 322"/>
    <path d="M93 322 L88 316"/>
    <path d="M93 322 L88 328"/>
  </g>
  <g class="d-cell-cytoplasm"><rect x="23" y="313" width="18" height="18" rx="9"/></g>
  <g class="d-cell-nucleus"><circle cx="32" cy="322" r="4"/></g>
  <text class="d-row" x="108" y="319" font-size="12" font-weight="650" font-family="system-ui, sans-serif">Нервная</text>
  <text class="d-head" x="108" y="335" font-size="11" font-family="system-ui, sans-serif">клетки с отростками</text>
  <text class="d-head" x="108" y="349" font-size="11" font-family="system-ui, sans-serif">проводит сигнал</text>
  <text class="d-head" x="108" y="363" font-size="10.5" font-family="system-ui, sans-serif">мозг, нервы, нервные узлы</text>

  <g class="d-eq-rule">
    <line x1="8" y1="392" x2="312" y2="392"/>
  </g>
  <g class="d-verdict" font-size="11" font-family="system-ui, sans-serif">
    <text x="8" y="412">Соотношение клеток и вещества</text>
    <text x="8" y="428">выдаёт тип ткани под микроскопом</text>
  </g>
</svg>
