<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 296" role="img" aria-label="Пирамида питания из четырёх звеньев. Внизу трава, около тысячи килограммов. Выше кузнечики, около ста килограммов. Ещё выше лягушки, около десяти килограммов. На вершине цапля, около одного килограмма. На каждом переходе теряется примерно девять десятых вещества: оно уходит на дыхание, движение и в отходы. Внизу подпись: поэтому в цепи питания редко больше четырёх-пяти звеньев — на шестое просто не остаётся вещества.">
  <g class="d-head" font-size="11" font-weight="650" font-family="system-ui, sans-serif">
    <text x="8" y="14">Сколько остаётся на каждом следующем этаже</text>
  </g>

  <g class="d-bar-few">
    <rect x="146" y="26" width="28" height="26" rx="4"/>
  </g>
  <g class="d-bar-mid">
    <rect x="112" y="60" width="96" height="26" rx="4"/>
  </g>
  <g class="d-bar-more">
    <rect x="76" y="94" width="168" height="26" rx="4"/>
  </g>
  <g class="d-bar-most">
    <rect x="8" y="128" width="304" height="26" rx="4"/>
  </g>

  <g class="d-row" font-size="12" font-weight="650" font-family="system-ui, sans-serif" text-anchor="middle">
    <text x="160" y="44">Цапля</text>
    <text x="160" y="78">Лягушки</text>
    <text x="160" y="112">Кузнечики</text>
    <text x="160" y="146">Трава</text>
  </g>
  <g class="d-number" font-size="11" font-weight="700" font-family="system-ui, sans-serif">
    <text x="182" y="44">1 кг</text>
    <text x="216" y="78">10 кг</text>
    <text x="252" y="112">100 кг</text>
    <text x="8" y="170">1000 кг</text>
  </g>

  <g class="d-stem" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M40 126 V102"/>
    <path d="M40 102 l-4 6 M40 102 l4 6"/>
    <path d="M40 92 V68"/>
    <path d="M40 68 l-4 6 M40 68 l4 6"/>
    <path d="M40 58 V34"/>
    <path d="M40 34 l-4 6 M40 34 l4 6"/>
  </g>
  <g class="d-minus" font-size="10" font-weight="700" font-family="system-ui, sans-serif">
    <text x="8" y="116">−90%</text>
    <text x="8" y="82">−90%</text>
    <text x="8" y="48">−90%</text>
  </g>

  <g class="d-label" font-size="11" font-family="system-ui, sans-serif">
    <text x="8" y="196">Куда девается остальное: на дыхание, движение,</text>
    <text x="8" y="210">поддержание тепла и в отходы. В тело следующего</text>
    <text x="8" y="224">звена переходит примерно десятая часть.</text>
  </g>

  <g class="d-verdict" font-size="12" font-family="system-ui, sans-serif">
    <text x="8" y="252">Поэтому в цепи питания редко бывает больше</text>
    <text x="8" y="266">четырёх-пяти звеньев: на шестое уже не остаётся</text>
    <text x="8" y="280">вещества. И потому крупных хищников всегда мало:</text>
    <text x="8" y="294">их просто нечем прокормить.</text>
  </g>
</svg>
