<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 300" role="img" aria-label="Ботаника делится на разделы. О самом растении: морфология изучает внешнее строение, анатомия — внутреннее строение, физиология — работу растения. О растениях вместе: систематика разбирается в родстве и классификации, география растений — где они растут, экология растений — связи со средой и другими организмами, палеоботаника — вымершие растения. Внизу вывод: разделов много, потому что об одном растении можно спрашивать разное.">
  <rect class="d-capsule" x="102" y="12" width="116" height="32" rx="16"/>
  <text class="d-capsule-t" x="160" y="33" font-size="14" text-anchor="middle">БОТАНИКА</text>

  <g class="d-stem" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M160 44 V64"/>
    <path d="M80 64 H240"/>
    <path d="M80 64 V84"/>
    <path d="M240 64 V84"/>
  </g>

  <rect class="d-sub" x="14" y="84" width="132" height="26" rx="13"/>
  <text class="d-head" x="80" y="101" font-size="11.5" text-anchor="middle">Одно растение</text>

  <rect class="d-sub" x="174" y="84" width="132" height="26" rx="13"/>
  <text class="d-head" x="240" y="101" font-size="11.5" text-anchor="middle">Все растения вместе</text>

  <g class="d-stem-end">
    <circle cx="20" cy="134" r="2.5"/>
    <circle cx="20" cy="172" r="2.5"/>
    <circle cx="20" cy="210" r="2.5"/>
    <circle cx="180" cy="134" r="2.5"/>
    <circle cx="180" cy="172" r="2.5"/>
    <circle cx="180" cy="210" r="2.5"/>
    <circle cx="180" cy="248" r="2.5"/>
  </g>

  <g class="d-row" font-size="12.5" font-weight="650">
    <text x="30" y="138">Морфология</text>
    <text x="30" y="176">Анатомия</text>
    <text x="30" y="214">Физиология</text>
    <text x="190" y="138">Систематика</text>
    <text x="190" y="176">География</text>
    <text x="190" y="214">Экология</text>
    <text x="190" y="252">Палеоботаника</text>
  </g>

  <g class="d-head" font-size="11.5">
    <text x="30" y="152">внешнее строение</text>
    <text x="30" y="190">внутреннее строение</text>
    <text x="30" y="228">как растение работает</text>
    <text x="190" y="152">родство и группы</text>
    <text x="190" y="190">где растут</text>
    <text x="190" y="228">связи со средой</text>
    <text x="190" y="266">вымершие растения</text>
  </g>

  <g class="d-eq-rule">
    <line x1="8" y1="278" x2="312" y2="278"/>
  </g>

  <g class="d-verdict" font-size="11" font-family="system-ui, sans-serif">
    <text x="8" y="294">Об одном растении спрашивают разное</text>
  </g>
</svg>
