<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 250" role="img" aria-label="Спинной мозг на поперечном срезе. Снаружи лежит белое вещество — оно занимает всю периферию среза и образовано отростками нервных клеток и проводящими путями, идущими наверх к головному мозгу и вниз от него. В центре — серое вещество из тел нейронов; на срезе оно похоже на бабочку. Два узких рога бабочки направлены назад и вверх, это задние рога, в них лежат главным образом вставочные нейроны. Два широких рога направлены вперёд и вниз, это передние рога, в них лежат тела двигательных нейронов — мотонейронов, чьи аксоны идут к скелетным мышцам. В самой середине серого вещества виден спинномозговой канал. Внизу вывод: серое вещество отвечает за рефлексы, белое — за проведение.">
  <g class="d-layer-3">
    <rect x="13" y="52" width="132" height="136" rx="62"/>
  </g>

  <g class="d-layer-2">
    <rect x="61" y="96" width="36" height="42" rx="9"/>
    <rect x="48" y="80" width="12" height="30" rx="5" transform="rotate(-28 54 95)"/>
    <rect x="98" y="80" width="12" height="30" rx="5" transform="rotate(28 104 95)"/>
    <rect x="44" y="126" width="18" height="32" rx="7" transform="rotate(22 53 142)"/>
    <rect x="96" y="126" width="18" height="32" rx="7" transform="rotate(-22 105 142)"/>
  </g>

  <g class="d-cell-vacuole"><circle cx="79" cy="119" r="5"/></g>

  <g class="d-lead" stroke-width="1.2" fill="none">
    <path d="M154 72 L108 84"/>
    <path d="M154 112 L94 118"/>
    <path d="M154 152 L110 148"/>
    <path d="M154 192 L134 174"/>
  </g>

  <text class="d-row" x="160" y="76" font-size="10.5" font-weight="650" font-family="system-ui, sans-serif">Задний рог</text>
  <text class="d-head" x="160" y="89" font-size="10" font-family="system-ui, sans-serif">вставочные нейроны</text>

  <text class="d-row" x="160" y="116" font-size="10.5" font-weight="650" font-family="system-ui, sans-serif">Серое вещество</text>
  <text class="d-head" x="160" y="129" font-size="10" font-family="system-ui, sans-serif">тела нейронов, бабочкой</text>

  <text class="d-row" x="160" y="156" font-size="10.5" font-weight="650" font-family="system-ui, sans-serif">Передний рог</text>
  <text class="d-head" x="160" y="169" font-size="10" font-family="system-ui, sans-serif">мотонейроны к мышцам</text>

  <text class="d-row" x="160" y="196" font-size="10.5" font-weight="650" font-family="system-ui, sans-serif">Белое вещество</text>
  <text class="d-head" x="160" y="209" font-size="10" font-family="system-ui, sans-serif">отростки и пути</text>

  <g class="d-eq-rule">
    <line x1="8" y1="224" x2="312" y2="224"/>
  </g>
  <g class="d-verdict" font-size="11" font-family="system-ui, sans-serif">
    <text x="8" y="242">Серое — рефлексы, белое — проведение</text>
  </g>
</svg>
