<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 300" role="img" aria-label="Науки о человеке. О самом организме: анатомия изучает строение тела, физиология — работу органов, психология — душевную деятельность и психику. О жизни и здоровье: антропология изучает происхождение и эволюцию человека, гигиена — влияние условий жизни и труда, медицина лечит и предупреждает болезни, экология — связи человека со средой. Внизу вывод: науки развивались вместе, и медицина опирается сразу на все.">
  <rect class="d-capsule" x="98" y="12" width="124" height="32" rx="16"/>
  <text class="d-capsule-t" x="160" y="33" font-size="14" text-anchor="middle">ЧЕЛОВЕК</text>

  <g class="d-stem" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M160 44 V64"/>
    <path d="M80 64 H240"/>
    <path d="M80 64 V84"/>
    <path d="M240 64 V84"/>
  </g>

  <rect class="d-sub" x="14" y="84" width="132" height="26" rx="13"/>
  <text class="d-head" x="80" y="101" font-size="11.5" text-anchor="middle">Как устроен</text>

  <rect class="d-sub" x="174" y="84" width="132" height="26" rx="13"/>
  <text class="d-head" x="240" y="101" font-size="11.5" text-anchor="middle">Как живёт и болеет</text>

  <g class="d-stem-end">
    <circle cx="20" cy="134" r="2.5"/>
    <circle cx="20" cy="172" r="2.5"/>
    <circle cx="20" cy="210" r="2.5"/>
    <circle cx="180" cy="134" r="2.5"/>
    <circle cx="180" cy="172" r="2.5"/>
    <circle cx="180" cy="210" r="2.5"/>
    <circle cx="180" cy="248" r="2.5"/>
  </g>

  <g class="d-row" font-size="12.5" font-weight="650">
    <text x="30" y="138">Анатомия</text>
    <text x="30" y="176">Физиология</text>
    <text x="30" y="214">Психология</text>
    <text x="190" y="138">Антропология</text>
    <text x="190" y="176">Гигиена</text>
    <text x="190" y="214">Медицина</text>
    <text x="190" y="252">Экология</text>
  </g>

  <g class="d-head" font-size="11.5">
    <text x="30" y="152">строение тела</text>
    <text x="30" y="190">работа органов</text>
    <text x="30" y="228">психика</text>
    <text x="190" y="152">происхождение</text>
    <text x="190" y="190">условия жизни</text>
    <text x="190" y="228">лечение болезней</text>
    <text x="190" y="266">связи со средой</text>
  </g>

  <g class="d-eq-rule">
    <line x1="8" y1="278" x2="312" y2="278"/>
  </g>

  <g class="d-verdict" font-size="11" font-family="system-ui, sans-serif">
    <text x="8" y="294">Медицина опирается сразу на все эти науки</text>
  </g>
</svg>
