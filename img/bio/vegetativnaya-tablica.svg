<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 368" role="img" aria-label="Таблица влияния двух отделов вегетативной нервной системы на девять органов. Слева столбец органов, посередине столбец симпатического отдела, справа парасимпатического. Сердце: симпатический заставляет его биться чаще и сильнее, парасимпатический — реже и слабее. Кровеносные сосуды симпатический сужает, повышая давление, парасимпатический расширяет в некоторых органах. Зрачок симпатический расширяет, парасимпатический сужает. Слёзных и слюнных желёз симпатический убавляет секрецию, парасимпатический прибавляет. В желудке и кишечнике симпатический ослабляет выделение сока и движения, парасимпатический усиливает. Потоотделение, наоборот, симпатический усиливает, а парасимпатический уменьшает. Мочевой пузырь при симпатическом влиянии копит мочу, при парасимпатическом выводит. Вывод: симпатический отдел готовит тело к нагрузке, парасимпатический — к покою и отдыху, и почти каждый орган получает оба влияния сразу." >
  <g class="d-head" font-size="11" font-weight="650" font-family="system-ui, sans-serif">
    <text x="8" y="14">Как два отдела действуют на один и тот же орган</text>
  </g>
  <g class="d-capsule-t" font-size="11" font-family="system-ui, sans-serif">
    <text x="8" y="40">Орган</text>
  </g>
  <g class="d-simp-t" font-size="11" font-weight="650" font-family="system-ui, sans-serif">
    <text x="152" y="40">Симпатический</text>
    <text x="152" y="54">работа, тревога, нагрузка</text>
  </g>
  <g class="d-parasimp-t" font-size="11" font-weight="650" font-family="system-ui, sans-serif">
    <text x="316" y="40">Парасимпатический</text>
    <text x="316" y="54">покой, отдых, сон</text>
  </g>
  <g class="d-grid">
    <line x1="8" y1="62" x2="472" y2="62"/>
    <line x1="8" y1="90" x2="472" y2="90"/>
    <line x1="8" y1="116" x2="472" y2="116"/>
    <line x1="8" y1="142" x2="472" y2="142"/>
    <line x1="8" y1="168" x2="472" y2="168"/>
    <line x1="8" y1="194" x2="472" y2="194"/>
    <line x1="8" y1="220" x2="472" y2="220"/>
    <line x1="8" y1="246" x2="472" y2="246"/>
    <line x1="8" y1="272" x2="472" y2="272"/>
    <line x1="144" y1="62" x2="144" y2="298"/>
    <line x1="308" y1="62" x2="308" y2="298"/>
  </g>
  <g class="d-label" font-size="10" font-family="system-ui, sans-serif">
    <text x="8" y="72">Сердце</text>
    <text x="8" y="98">Кровеносные сосуды</text>
    <text x="8" y="124">Зрачок</text>
    <text x="8" y="150">Слёзные железы</text>
    <text x="8" y="176">Слюнные железы</text>
    <text x="8" y="202">Желудок</text>
    <text x="8" y="228">Кишечник</text>
    <text x="8" y="254">Потовые железы</text>
    <text x="8" y="280">Мочевой пузырь</text>
  </g>
  <g class="d-simp-t" font-size="10" font-family="system-ui, sans-serif">
    <text x="152" y="72">бьётся чаще и сильнее</text>
    <text x="152" y="98">сужаются, давление растёт</text>
    <text x="152" y="124">расширяется</text>
    <text x="152" y="150">слёз меньше</text>
    <text x="152" y="176">слюны скудно</text>
    <text x="152" y="202">сока выделяется меньше</text>
    <text x="152" y="228">движения ослабевают</text>
    <text x="152" y="254">пота больше</text>
    <text x="152" y="280">моча копится</text>
  </g>
  <g class="d-parasimp-t" font-size="10" font-family="system-ui, sans-serif">
    <text x="316" y="72">бьётся реже и слабее</text>
    <text x="316" y="98">расширяются в некоторых органах</text>
    <text x="316" y="124">сужается</text>
    <text x="316" y="150">слёз больше</text>
    <text x="316" y="176">слюны обильно</text>
    <text x="316" y="202">сока выделяется больше</text>
    <text x="316" y="228">движения усиливаются</text>
    <text x="316" y="254">пота меньше</text>
    <text x="316" y="280">моча выводится</text>
  </g>
  <g class="d-warn" stroke-width="1.4" fill="none">
    <path d="M240 312 V324"/>
  </g>
  <g class="d-warn-t" font-size="11" font-weight="650" text-anchor="middle" font-family="system-ui, sans-serif">
    <text x="240" y="338">Один отдел готовит к нагрузке, другой — к отдыху</text>
  </g>
  <g class="d-label" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">
    <text x="240" y="356">Почти каждый орган получает оба влияния, и они противоположны.</text>
  </g>
</svg>
