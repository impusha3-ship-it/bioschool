    <circle cx="372.7" cy="104" r="3.4"/>
    <circle cx="397.3" cy="104" r="3.4"/>
    <circle cx="386.7" cy="92" r="3.4"/>
    <circle cx="413.3" cy="90" r="3.4"/>
    <circle cx="402.7" cy="78" r="3.4"/>
    <circle cx="428.3" cy="76" r="3.4"/>
    <circle cx="417.7" cy="64" r="3.4"/>
  </g>

  <!-- Подписи -->
  <g class="d-lead" stroke-width="1.2" fill="none">
    <path d="M164 176 H228"/>
    <path d="M164 212 H196"/>
    <path d="M164 282 H196"/>
    <path d="M164 306 H186"/>
  </g>
  <g class="d-label" font-size="11" text-anchor="end" font-family="system-ui, sans-serif">
    <text x="160" y="172">вайя — лист папоротника,</text>
    <text x="160" y="184">крупный и перистый</text>
    <text x="160" y="208">улитка: молодая вайя</text>
    <text x="160" y="220">свёрнута спиралью</text>
    <text x="160" y="278">корневище — подземный</text>
    <text x="160" y="290">побег, а не корень</text>
    <text x="160" y="310">придаточные корни</text>
  </g>
  <g class="d-label" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">
    <text x="400" y="158">сорусы — кучки спорангиев</text>
    <text x="400" y="172">на нижней стороне вайи</text>
  </g>
  <g class="d-label" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">
    <text x="240" y="336">У папоротника, в отличие от мха, есть настоящие корни, стебель и листья.</text>
  </g>
</svg>
