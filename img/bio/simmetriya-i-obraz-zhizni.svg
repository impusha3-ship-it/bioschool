<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 300" role="img" aria-label="Симметрия тела и образ жизни животного. Слева лучевая симметрия: тело можно разделить на одинаковые части несколькими плоскостями, как у медузы и гидры. Такое животное сидит на месте или парит, еда и опасность приходят к нему с любой стороны, и переднего конца у него нет. Справа двусторонняя симметрия: плоскость симметрии только одна, левая и правая половины зеркальны, как у червя, насекомого и рыбы. Такое животное движется вперёд одним концом, и на этом конце собираются рот и органы чувств, а затем и мозг. Внизу вывод: симметрия — не украшение, а след образа жизни; кто движется в одну сторону, у того появляется голова.">
  <g class="d-head" font-size="11.5" font-weight="650" font-family="system-ui, sans-serif">
    <text x="8" y="14">Симметрия говорит, как животное живёт</text>
  </g>

  <g class="d-capsule">
    <rect x="8" y="24" width="144" height="24" rx="6"/>
    <rect x="168" y="24" width="144" height="24" rx="6"/>
  </g>
  <g class="d-capsule-t" font-size="11.5" text-anchor="middle" font-family="system-ui, sans-serif">
    <text x="80" y="41">Лучевая</text>
    <text x="240" y="41">Двусторонняя</text>
  </g>

  <!--
    Слева круг с четырьмя плоскостями: разрезать можно как угодно, и половины
    выйдут одинаковыми. Справа тот же приём, но плоскость всего одна — и
    потому у тела появляются перед и зад.
  -->
  <g class="d-sub">
    <circle cx="80" cy="104" r="34"/>
  </g>
  <g class="d-lead" fill="none">
    <path d="M80 64 V144"/>
    <path d="M40 104 H120"/>
    <path d="M52 76 L108 132"/>
    <path d="M108 76 L52 132"/>
  </g>
  <g class="d-stem-end">
    <circle cx="80" cy="104" r="5"/>
  </g>

  <g class="d-leaf">
    <path d="M196 104 C212 84 262 84 286 96 C270 104 270 104 286 112 C262 124 212 124 196 104 Z"/>
  </g>
  <g class="d-lead" fill="none">
    <path d="M196 104 H292"/>
  </g>
  <g class="d-stem-end">
    <circle cx="206" cy="98" r="2.6"/>
    <circle cx="206" cy="110" r="2.6"/>
  </g>

  <g class="d-row" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">
    <text x="80" y="158">плоскостей много</text>
    <text x="240" y="158">плоскость одна</text>
  </g>

  <g class="d-row" font-size="11" font-family="system-ui, sans-serif">
    <text x="8" y="182">Сидит или парит на месте.</text>
    <text x="168" y="182">Движется вперёд.</text>
    <text x="8" y="196">Еда и опасность приходят</text>
    <text x="168" y="196">Рот и органы чувств</text>
    <text x="8" y="210">с любой стороны.</text>
    <text x="168" y="210">собраны на переднем конце.</text>
    <text x="8" y="224">Медуза, гидра, актиния.</text>
    <text x="168" y="224">Червь, насекомое, рыба.</text>
  </g>

  <g class="d-eq-rule">
    <line x1="8" y1="242" x2="312" y2="242"/>
  </g>

  <g class="d-verdict" font-size="11" font-family="system-ui, sans-serif">
    <text x="8" y="262">Симметрия — не украшение, а след образа жизни.</text>
    <text x="8" y="276">Кто всегда движется одним концом вперёд,</text>
    <text x="8" y="290">у того на этом конце и появляется голова.</text>
  </g>
</svg>
