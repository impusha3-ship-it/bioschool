<!doctype html><html lang="ru"><meta charset="utf-8"><title>Проверка схем</title>
<link rel="stylesheet" href="/css/tokens.css"><link rel="stylesheet" href="/css/base.css">
<body style="background:var(--paper);margin:0;padding:8px">
<div id="box" style="width:311px"></div>
<script>
window.проверить=async function(files){
  const box=document.getElementById('box'); const итог=[];
  for(const f of files){
    box.innerHTML='';
    const t=await (await fetch('/img/bio/'+f)).text();
    const svg=new DOMParser().parseFromString(t,'image/svg+xml').documentElement;
    if(svg.tagName!=='svg'){итог.push({f,ошибка:'разметка не разобралась'});continue;}
    svg.setAttribute('class','figure__svg'); svg.style.width='100%'; svg.style.height='auto';
    box.append(svg);
    const vb=svg.getAttribute('viewBox').split(/[\s,]+/).map(Number);
    const плохо=[];
    svg.querySelectorAll('text').forEach(n=>{
      let b; try{b=n.getBBox()}catch(e){return}
      if(b.width===0) return;
      if(b.x+b.width>vb[2]-1) плохо.push({т:n.textContent.slice(0,30),правый:Math.round(b.x+b.width)});
      else if(b.x<vb[0]-1) плохо.push({т:n.textContent.slice(0,30),левый:Math.round(b.x)});
      else if(b.y+b.height>vb[3]+2) плохо.push({т:n.textContent.slice(0,30),низ:Math.round(b.y+b.height)});
    });
    итог.push({f, холст:vb[2]+'x'+vb[3], вылезает:плохо});
  }
  return итог;
};
</script>
