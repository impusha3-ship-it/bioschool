<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="Круг из шести шагов в жизненном цикле человеческой аскариды. Взрослые черви живут в тонком кишечнике человека; самка выделяет за сутки больше двухсот тысяч яиц. Яйца выходят с калом во внешнюю среду, и там, при свободном доступе воздуха и температуре от двадцати четырёх до тридцати градусов, за две-три недели внутри яйца развивается личинка. Такое яйцо человек проглатывает вместе с плохо вымытыми овощами, ягодами, фруктами или с некипячёной водой. В кишечнике личинка выходит из яйца, вбуравливается в стенку кишки и попадает в кровеносные сосуды, а с током крови достигает лёгких. Оттуда она поднимается по воздухоносным путям к ротовой полости, со слюной проглатывается и вновь попадает в кишечник, где превращается во взрослую аскариду. Хозяин у аскариды всего один — человек; промежуточного хозяина у неё нет.">
  <g class="d-head" font-size="11" font-weight="650" font-family="system-ui, sans-serif">
    <text x="8" y="14">Жизненный цикл человеческой аскариды</text>
  </g>

  <g class="d-stem" stroke-width="1.8" fill="none">
    <path d="M154 58 H176"/>
    <path d="M310 58 H332"/>
    <path d="M396 96 V162"/>
    <path d="M332 196 H310"/>
    <path d="M170 196 H148"/>
    <path d="M84 162 V102"/>
  </g>
  <g class="d-stem-end">
    <path d="M182 58 L174 54 L174 62 Z"/>
    <path d="M338 58 L330 54 L330 62 Z"/>
    <path d="M396 170 L392 162 L400 162 Z"/>
    <path d="M304 196 L312 192 L312 200 Z"/>
    <path d="M142 196 L150 192 L150 200 Z"/>
    <path d="M84 94 L80 102 L88 102 Z"/>
  </g>

  <g class="d-capsule">
    <rect x="14" y="30" width="140" height="58" rx="8"/>
    <rect x="182" y="30" width="128" height="58" rx="8"/>
    <rect x="338" y="30" width="128" height="58" rx="8"/>
    <rect x="338" y="170" width="128" height="58" rx="8"/>
    <rect x="176" y="170" width="128" height="58" rx="8"/>
    <rect x="14" y="170" width="128" height="58" rx="8"/>
  </g>

  <g class="d-capsule-t" font-size="12" font-family="system-ui, sans-serif">
    <text x="26" y="50">Взрослые черви</text>
    <text x="194" y="50">Яйца наружу</text>
    <text x="350" y="50">Личинка в яйце</text>
    <text x="350" y="190">Яйцо проглочено</text>
    <text x="188" y="190">Путь по крови</text>
    <text x="26" y="190">Снова в кишечник</text>
  </g>
  <g class="d-label" font-size="10" font-family="system-ui, sans-serif">
    <text x="26" y="66">в тонком кишечнике</text>
    <text x="26" y="78">человека</text>
    <text x="194" y="66">самка даёт больше</text>
    <text x="194" y="78">200 тысяч в сутки</text>
    <text x="350" y="66">нужен воздух и тепло</text>
    <text x="350" y="78">две-три недели</text>
    <text x="350" y="204">с немытыми овощами</text>
    <text x="350" y="216">или сырой водой</text>
    <text x="188" y="204">из кишки в кровь,</text>
    <text x="188" y="216">потом в лёгкие</text>
    <text x="26" y="204">из лёгких со слюной</text>
    <text x="26" y="216">проглочена обратно</text>
  </g>

  <!-- Главное отличие от сосальщика и цепня: переезжать не к кому. -->
  <g class="d-warn" stroke-width="1.4" fill="none">
    <path d="M240 232 V248"/>
  </g>
  <g class="d-warn-t" font-size="11" font-weight="650" text-anchor="middle" font-family="system-ui, sans-serif">
    <text x="240" y="262">Хозяин один — человек. Промежуточного у аскариды нет</text>
  </g>

  <g class="d-label" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">
    <text x="240" y="282">Две недели пути по телу — это жар и воспаление в лёгких.</text>
  </g>
</svg>
