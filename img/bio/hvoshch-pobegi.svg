<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-label="Два побега хвоща полевого на общем корневище. Слева весенний побег: невысокий, бурый, без веточек, на узлах бурые зубчатые влагалища, на верхушке крупный спороносный колосок. Справа летний побег: зелёный, с мутовками тонких веточек в каждом узле, колоска нет. Внизу под землёй общее ветвящееся корневище с клубеньками и придаточными корнями, от которого отходят оба побега.">
  <g class="d-head" font-size="11" font-weight="650" font-family="system-ui, sans-serif">
    <text x="8" y="14">Хвощ полевой: два разных побега на одном корневище</text>
  </g>

  <g class="d-soil">
    <path d="M8 252 H472 V300 H8 Z"/>
  </g>

  <!-- Весенний побег: бурый, потому что хлорофилла в нём нет -->
  <g class="d-root" stroke-width="3.4" fill="none" stroke-linecap="round">
    <path d="M150 252 V198"/>
  </g>
  <g class="d-cap">
    <path d="M143 238 L143 233 L157 233 L157 238 Z M143 218 L143 213 L157 213 L157 218 Z"/>
  </g>
  <g class="d-capsule">
    <ellipse cx="150" cy="174" rx="12" ry="24"/>
  </g>
  <g class="d-stem" stroke-width="1" fill="none">
    <path d="M144.4 154 H155.6 M141.5 160.7 H158.5 M140.2 167.3 H159.8 M139.8 174 H160.2 M140.2 180.7 H159.8 M141.5 187.3 H158.5 M144.4 194 H155.6"/>
  </g>

  <!-- Летний побег: зелёный, он и кормит растение -->
  <g class="d-stem" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M316 252 V140"/>
  </g>
  <g class="d-stem" stroke-width="1.2" fill="none" stroke-linecap="round">
    <path d="M316 244 Q310.3 241.2 303.4 234.7 M316 244 Q306.4 239.8 294.7 229.9 M316 244 Q302.5 238.3 286 225 M316 244 Q321.7 241.2 328.6 234.7 M316 244 Q325.6 239.8 337.3 229.9 M316 244 Q329.5 238.3 346 225 M316 222 Q311 219.5 304.9 213.8 M316 222 Q307.6 218.3 297.3 209.6 M316 222 Q304.1 217 289.6 205.3 M316 222 Q321 219.5 327.1 213.8 M316 222 Q324.4 218.3 334.7 209.6 M316 222 Q327.9 217 342.4 205.3 M316 200 Q311.7 197.9 306.4 192.9 M316 200 Q308.7 196.8 299.8 189.3 M316 200 Q305.7 195.7 293.2 185.6 M316 200 Q320.3 197.9 325.6 192.9 M316 200 Q323.3 196.8 332.2 189.3 M316 200 Q326.3 195.7 338.8 185.6 M316 178 Q312.4 176.2 307.9 172 M316 178 Q309.9 175.3 302.4 169 M316 178 Q307.4 174.4 296.8 165.9 M316 178 Q319.6 176.2 324.1 172 M316 178 Q322.1 175.3 329.6 169 M316 178 Q324.6 174.4 335.2 165.9 M316 158 Q313.1 156.5 309.4 153.2 M316 158 Q311 155.8 304.9 150.6 M316 158 Q309 155 300.4 148.1 M316 158 Q318.9 156.5 322.6 153.2 M316 158 Q321 155.8 327.1 150.6 M316 158 Q323 155 331.6 148.1"/>
  </g>
  <g class="d-root" stroke-width="1.8" fill="none" stroke-linecap="round">
    <path d="M311 244 H321 M311 222 H321 M311 200 H321 M311 178 H321 M311 158 H321"/>
  </g>

  <!-- Корневище зимует в почве: из него весной и выходят оба побега -->
  <g class="d-stem" stroke-width="5.5" fill="none" stroke-linecap="round">
    <path d="M78 276 C130 270 210 282 260 274 C310 266 360 276 402 270"/>
    <path d="M150 276 V252"/>
    <path d="M316 272 V252"/>
  </g>
  <g class="d-capsule">
    <ellipse cx="112" cy="274" rx="8" ry="5.5"/>
    <ellipse cx="220" cy="279" rx="8" ry="5.5"/>
    <ellipse cx="372" cy="273" rx="8" ry="5.5"/>
  </g>
  <g class="d-root" stroke-width="1.4" fill="none" stroke-linecap="round">
    <path d="M92 275 C88 284 86 290 84 296
             M186 278 C184 286 184 292 184 298
             M250 275 C250 284 252 290 254 296
             M344 272 C346 282 348 288 350 294"/>
  </g>

  <g class="d-capsule-t" font-size="12" text-anchor="middle" font-family="system-ui, sans-serif">
    <text x="150" y="104">Весенний побег</text>
    <text x="316" y="104">Летний побег</text>
  </g>
  <g class="d-label" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">
    <text x="150" y="118">бурый, хлорофилла нет;</text>
    <text x="150" y="130">на верхушке колосок со спорами</text>
    <text x="316" y="118">зелёный, с мутовками веточек;</text>
    <text x="316" y="130">кормит всё растение</text>
  </g>
  <!-- Клубеньки на ВПР спрашивают: ими хвощ размножается вегетативно -->
  <g class="d-lead" stroke-width="1.2" fill="none">
    <path d="M62 248 L104 270"/>
  </g>
  <g class="d-label" font-size="10" font-family="system-ui, sans-serif">
    <text x="14" y="244">клубеньки на корневище</text>
  </g>
  <g class="d-label" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">
    <text x="240" y="314">Это одно растение. Споры высыпались — весенний побег отмирает, а корневище остаётся.</text>
  </g>
</svg>
