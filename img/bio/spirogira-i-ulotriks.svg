<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 250" role="img" aria-label="Две нитчатые зелёные водоросли рядом. Слева спирогира: нить из одинаковых клеток, в каждой зелёный хроматофор лежит длинной лентой, закрученной спиралью. Справа улотрикс: такая же нить из клеток, но хроматофор в каждой клетке имеет вид незамкнутого кольца, пояска вдоль стенки. Самая нижняя клетка улотрикса бесцветная — ею нить прикрепляется к камню.">
  <g class="d-head" font-size="11" font-weight="650" font-family="system-ui, sans-serif">
    <text x="8" y="14">Две нити, а хроматофор разный</text>
  </g>

  <g class="d-cell-wall">
    <rect x="46" y="34" width="76" height="52" rx="6"/>
    <rect x="46" y="90" width="76" height="52" rx="6"/>
    <rect x="46" y="146" width="76" height="52" rx="6"/>
    <rect x="198" y="34" width="76" height="52" rx="6"/>
    <rect x="198" y="90" width="76" height="52" rx="6"/>
    <rect x="198" y="146" width="76" height="52" rx="6"/>
  </g>

  <g class="d-cell-chloroplast" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M54 78 C70 74 62 58 78 52 C92 47 104 56 114 42"/>
    <path d="M54 134 C70 130 62 114 78 108 C92 103 104 112 114 98"/>
  </g>

  <g class="d-cell-chloroplast" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M236 42 C258 42 268 52 268 60 C268 70 256 78 236 78 C216 78 204 70 204 60 C204 54 210 48 218 45"/>
    <path d="M236 98 C258 98 268 108 268 116 C268 126 256 134 236 134 C216 134 204 126 204 116 C204 110 210 104 218 101"/>
  </g>

  <!-- Ядро показано только в нижней клетке улотрикса: там оно и есть весь
       смысл — клетка живая, но хроматофора в ней нет. -->
  <g class="d-cell-nucleus">
    <circle cx="236" cy="172" r="9"/>
  </g>
  <g class="d-cell-chloroplast" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M54 190 C70 186 62 170 78 164 C92 159 104 168 114 154"/>
  </g>

  <g class="d-capsule-t" font-size="12" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">
    <text x="84" y="222">Спирогира</text>
    <text x="236" y="222">Улотрикс</text>
  </g>
  <g class="d-label" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">
    <text x="84" y="236">лента спиралью</text>
    <text x="236" y="236">поясок кольцом</text>
  </g>

  <g class="d-label" font-size="10" text-anchor="end" font-family="system-ui, sans-serif">
    <text x="192" y="176">нижняя клетка</text>
    <text x="192" y="188">бесцветная</text>
  </g>
  <g class="d-lead" stroke-width="1.2" fill="none">
    <path d="M196 180 H210"/>
  </g>
</svg>
