<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 300" role="img" aria-label="Четыре вида охраняемых природных территорий по строгости охраны, от самой строгой к самой мягкой. Заповедник: нельзя ничего — ни строить, ни рубить, ни пасти скот, ни ходить без разрешения; охраняется всё сообщество целиком. Национальный парк: охраняется тоже всё, но посетителей пускают по тропам, есть зоны разной строгости. Заказник: охраняется что-то одно — вид или место гнездования, остальное разрешено. Памятник природы: охраняется один объект, например вековое дерево, родник или скала. Внизу подпись: чем строже охрана, тем меньше таких участков; в заповедниках России около двух процентов её площади.">
  <g class="d-head" font-size="11" font-weight="650" font-family="system-ui, sans-serif">
    <text x="8" y="14">Что охраняют</text>
    <text x="150" y="14">Что там можно</text>
  </g>

  <g class="d-grid">
    <line x1="8" y1="20" x2="312" y2="20"/>
    <line x1="8" y1="76" x2="312" y2="76"/>
    <line x1="8" y1="132" x2="312" y2="132"/>
    <line x1="8" y1="182" x2="312" y2="182"/>
    <line x1="8" y1="232" x2="312" y2="232"/>
  </g>

  <g class="d-strict-1">
    <rect x="8" y="28" width="132" height="40" rx="7"/>
  </g>
  <g class="d-strict-2">
    <rect x="8" y="84" width="132" height="40" rx="7"/>
  </g>
  <g class="d-strict-3">
    <rect x="8" y="140" width="132" height="34" rx="7"/>
  </g>
  <g class="d-strict-4">
    <rect x="8" y="190" width="132" height="34" rx="7"/>
  </g>

  <g class="d-row" font-size="12" font-weight="650" font-family="system-ui, sans-serif">
    <text x="18" y="46">Заповедник</text>
    <text x="18" y="102">Нацпарк</text>
    <text x="18" y="158">Заказник</text>
    <text x="18" y="208">Памятник</text>
  </g>
  <g class="d-same" font-size="10" font-family="system-ui, sans-serif">
    <text x="18" y="60">всё сообщество</text>
    <text x="18" y="116">всё сообщество</text>
    <text x="18" y="170">вид или место</text>
    <text x="18" y="220">один объект</text>
  </g>

  <g class="d-diff" font-size="11" font-family="system-ui, sans-serif">
    <text x="150" y="42">ничего: ни строить,</text>
    <text x="150" y="56">ни рубить, ни пасти,</text>
    <text x="150" y="70">ни ходить без пропуска</text>
  </g>
  <g class="d-label" font-size="11" font-family="system-ui, sans-serif">
    <text x="150" y="98">ходить по тропам,</text>
    <text x="150" y="112">смотреть; есть зоны</text>
    <text x="150" y="126">разной строгости</text>
    <text x="150" y="154">всё, кроме того, что</text>
    <text x="150" y="168">мешает охраняемому</text>
    <text x="150" y="204">всё вокруг; нельзя</text>
    <text x="150" y="218">трогать сам объект</text>
  </g>

  <g class="d-verdict" font-size="12" font-family="system-ui, sans-serif">
    <text x="8" y="256">Чем строже охрана, тем меньше таких участков.</text>
    <text x="8" y="270">Заповедники занимают около двух сотых площади</text>
    <text x="8" y="284">России — этого мало, но именно они сохраняют</text>
    <text x="8" y="298">сообщества целиком, а не отдельные виды.</text>
  </g>
</svg>
