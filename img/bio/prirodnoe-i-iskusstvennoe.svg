<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 300" role="img" aria-label="Сравнение природного и искусственного сообщества по пяти признакам. Число видов: в природном много, в искусственном мало. Цепи питания: в природном длинные и сплетённые в сеть, в искусственном короткие, сети почти нет. Круговорот веществ: в природном замкнут, в искусственном разомкнут, потому что урожай уносят с поля. Кто поддерживает: природное держится само, искусственное держит человек. Что будет без вмешательства: природное продолжит жить, искусственное зарастёт и исчезнет за несколько лет. Внизу подпись: искусственное сообщество не хуже природного, оно просто не умеет стоять само.">
  <g class="d-head" font-size="11" font-weight="650" font-family="system-ui, sans-serif">
    <text x="8" y="14">Признак</text>
    <text x="126" y="14">Природное</text>
    <text x="226" y="14">Искусственное</text>
  </g>

  <g class="d-grid">
    <line x1="8" y1="22" x2="312" y2="22"/>
    <line x1="8" y1="60" x2="312" y2="60"/>
    <line x1="8" y1="106" x2="312" y2="106"/>
    <line x1="8" y1="152" x2="312" y2="152"/>
    <line x1="8" y1="190" x2="312" y2="190"/>
    <line x1="8" y1="236" x2="312" y2="236"/>
  </g>

  <g class="d-row" font-size="11" font-weight="650" font-family="system-ui, sans-serif">
    <text x="8" y="42">Видов</text>
    <text x="8" y="80">Цепи</text>
    <text x="8" y="126">Круговорот</text>
    <text x="8" y="172">Держится</text>
    <text x="8" y="210">Если бросить</text>
  </g>

  <g class="d-label" font-size="11" font-family="system-ui, sans-serif">
    <text x="126" y="42">много</text>
    <text x="126" y="76">длинные,</text>
    <text x="126" y="90">сплетены в сеть</text>
    <text x="126" y="122">замкнут:</text>
    <text x="126" y="136">всё возвращается</text>
    <text x="126" y="172">само</text>
    <text x="126" y="206">продолжит</text>
    <text x="126" y="220">жить</text>
  </g>

  <g class="d-diff" font-size="11" font-family="system-ui, sans-serif">
    <text x="226" y="42">мало</text>
    <text x="226" y="76">короткие,</text>
    <text x="226" y="90">сети почти нет</text>
    <text x="226" y="122">разомкнут:</text>
    <text x="226" y="136">урожай уносят</text>
    <text x="226" y="172">человеком</text>
    <text x="226" y="206">зарастёт</text>
    <text x="226" y="220">за пару лет</text>
  </g>

  <g class="d-verdict" font-size="12" font-family="system-ui, sans-serif">
    <text x="8" y="262">Искусственное сообщество не хуже природного.</text>
    <text x="8" y="276">Оно просто не умеет стоять само: всё, чего ему</text>
    <text x="8" y="290">не хватает, приходится добавлять человеку.</text>
  </g>
</svg>
