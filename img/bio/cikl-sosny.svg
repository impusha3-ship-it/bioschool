<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 290" role="img" aria-label="Круг из шести шагов развития сосны. Весной на молодых побегах сосны появляются шишки двух видов: зеленовато-жёлтые мужские у оснований побегов и красноватые женские на верхушках. В мужских шишках в пыльцевых мешочках созревает пыльца, у каждой пылинки два воздушных пузырька. Ветер переносит пыльцу на женские шишки, происходит опыление. На женской шишке пыльца прорастает в пыльцевую трубку, в которой образуются неподвижные спермии, поэтому вода для оплодотворения не нужна. В семязачатке происходит оплодотворение и получается зигота. Из зиготы развивается зародыш, из всего семязачатка — семя с запасом питательных веществ и с крылышком, и круг замыкается.">
  <g class="d-head" font-size="11" font-weight="650" font-family="system-ui, sans-serif">
    <text x="8" y="14">Как размножается сосна</text>
  </g>

  <g class="d-stem" stroke-width="1.8" fill="none">
    <path d="M154 58 H176"/>
    <path d="M310 58 H332"/>
    <path d="M396 96 V162"/>
    <path d="M326 196 H304"/>
    <path d="M170 196 H148"/>
    <path d="M84 162 V102"/>
  </g>
  <g class="d-stem-end">
    <path d="M182 58 L174 54 L174 62 Z"/>
    <path d="M338 58 L330 54 L330 62 Z"/>
    <path d="M396 170 L392 162 L400 162 Z"/>
    <path d="M298 196 L306 192 L306 200 Z"/>
    <path d="M142 196 L150 192 L150 200 Z"/>
    <path d="M84 94 L80 102 L88 102 Z"/>
  </g>

  <g class="d-capsule">
    <rect x="14" y="30" width="140" height="58" rx="8"/>
    <rect x="182" y="30" width="128" height="58" rx="8"/>
    <rect x="338" y="30" width="128" height="58" rx="8"/>
    <rect x="338" y="170" width="128" height="58" rx="8"/>
    <rect x="176" y="170" width="128" height="58" rx="8"/>
    <rect x="14" y="170" width="128" height="58" rx="8"/>
  </g>

  <g class="d-capsule-t" font-size="12" font-family="system-ui, sans-serif">
    <text x="26" y="50">Сосна весной</text>
    <text x="194" y="50">Пыльца</text>
    <text x="350" y="50">Опыление ветром</text>
    <text x="350" y="190">Пыльцевая трубка</text>
    <text x="188" y="190">Оплодотворение</text>
    <text x="26" y="190">Семя с крылышком</text>
  </g>
  <g class="d-label" font-size="10" font-family="system-ui, sans-serif">
    <text x="26" y="66">две шишки: мужские</text>
    <text x="26" y="78">и женские</text>
    <text x="194" y="66">в мужских шишках,</text>
    <text x="194" y="78">пылинка с пузырьками</text>
    <text x="350" y="66">пыльца садится</text>
    <text x="350" y="78">на женскую шишку</text>
    <text x="350" y="204">в ней спермии,</text>
    <text x="350" y="216">вода уже не нужна</text>
    <text x="188" y="204">в семязачатке;</text>
    <text x="188" y="216">получается зигота</text>
    <text x="26" y="204">зародыш и эндосперм,</text>
    <text x="26" y="216">зреет полтора года</text>
  </g>

  <!-- Ровно то место, где споровые привязаны к воде, а семенные уже нет. -->
  <g class="d-warn" stroke-width="1.4" fill="none">
    <path d="M240 232 V248"/>
  </g>
  <g class="d-warn-t" font-size="11" font-weight="650" text-anchor="middle" font-family="system-ui, sans-serif">
    <text x="240" y="262">Вода для оплодотворения не нужна: спермии доставляет пыльцевая трубка</text>
  </g>

  <g class="d-label" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">
    <text x="240" y="282">Семязачаток лежит на чешуе открыто, плода нет — отсюда и название отдела.</text>
  </g>
</svg>
