<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 262" role="img" aria-label="Пять ступеней устройства многоклеточного организма, снизу вверх. Первая ступень — клетка, пример: одна мышечная клетка. Вторая — ткань, пример: мышечная ткань, клетки одного вида работают вместе. Третья — орган, пример: сердце, из нескольких тканей. Четвёртая — система органов, пример: кровеносная система, сердце и сосуды. Пятая — организм, все системы вместе. Внизу подпись: у одноклеточных все пять ступеней умещаются в одной клетке.">
  <g class="d-head" font-size="11" font-weight="650" font-family="system-ui, sans-serif">
    <text x="8" y="13">Из чего собран многоклеточный организм</text>
  </g>

  <g class="d-axis" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M20 208 V34"/>
    <path d="M20 34 l-5 7 M20 34 l5 7"/>
  </g>

  <g class="d-num-circle">
    <circle cx="20" cy="196" r="11"/>
    <circle cx="20" cy="156" r="11"/>
    <circle cx="20" cy="116" r="11"/>
    <circle cx="20" cy="76" r="11"/>
    <circle cx="20" cy="40" r="11"/>
  </g>
  <g class="d-num-text" font-size="12" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">
    <text x="20" y="200">1</text>
    <text x="20" y="160">2</text>
    <text x="20" y="120">3</text>
    <text x="20" y="80">4</text>
    <text x="20" y="44">5</text>
  </g>

  <g class="d-capsule">
    <rect x="40" y="182" width="112" height="28" rx="7"/>
    <rect x="40" y="142" width="112" height="28" rx="7"/>
    <rect x="40" y="102" width="112" height="28" rx="7"/>
    <rect x="40" y="62" width="112" height="28" rx="7"/>
    <rect x="40" y="26" width="112" height="28" rx="7"/>
  </g>
  <g class="d-capsule-t" font-size="13" font-weight="650" font-family="system-ui, sans-serif">
    <text x="50" y="201">Клетка</text>
    <text x="50" y="161">Ткань</text>
    <text x="50" y="121">Орган</text>
    <text x="50" y="81" font-size="11">Система органов</text>
    <text x="50" y="45">Организм</text>
  </g>

  <g class="d-label" font-size="11" font-family="system-ui, sans-serif">
    <text x="160" y="194">одна мышечная</text>
    <text x="160" y="206">клетка</text>
    <text x="160" y="154">много таких клеток</text>
    <text x="160" y="166">вместе</text>
    <text x="160" y="114">сердце — из разных</text>
    <text x="160" y="126">тканей</text>
    <text x="160" y="74">сердце и сосуды</text>
    <text x="160" y="86">вместе</text>
    <text x="160" y="38">все системы</text>
    <text x="160" y="50">работают как одно</text>
  </g>

  <g class="d-verdict" font-size="12" font-family="system-ui, sans-serif">
    <text x="8" y="234">У одноклеточных все пять ступеней умещаются</text>
    <text x="8" y="246">в одной-единственной клетке — и этого хватает,</text>
    <text x="8" y="258">чтобы быть живым организмом.</text>
  </g>
</svg>
