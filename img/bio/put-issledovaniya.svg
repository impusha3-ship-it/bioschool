<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 296" role="img" aria-label="Путь научного исследования из пяти шагов на примере комнатного растения. Наблюдение: растение на подоконнике наклонилось к окну. Вопрос: почему оно тянется именно в эту сторону. Предположение: может быть, дело в свете. Опыт: поворачиваем горшок и ждём неделю. Вывод: растение снова повернулось к окну, значит дело в свете.">
  <g class="d-stem" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M20 42 V70"/>
    <path d="M20 98 V126"/>
    <path d="M20 154 V182"/>
    <path d="M20 210 V238"/>
    <path d="M20 70 l-4 -6 M20 70 l4 -6"/>
    <path d="M20 126 l-4 -6 M20 126 l4 -6"/>
    <path d="M20 182 l-4 -6 M20 182 l4 -6"/>
    <path d="M20 238 l-4 -6 M20 238 l4 -6"/>
  </g>

  <g class="d-num-circle">
    <circle cx="20" cy="26" r="13"/>
    <circle cx="20" cy="82" r="13"/>
    <circle cx="20" cy="138" r="13"/>
    <circle cx="20" cy="194" r="13"/>
    <circle cx="20" cy="250" r="13"/>
  </g>
  <g class="d-num-text" font-size="13" font-weight="700" text-anchor="middle">
    <text x="20" y="31">1</text>
    <text x="20" y="87">2</text>
    <text x="20" y="143">3</text>
    <text x="20" y="199">4</text>
    <text x="20" y="255">5</text>
  </g>

  <g class="d-row" font-size="13" font-weight="650">
    <text x="44" y="24">Наблюдение</text>
    <text x="44" y="80">Вопрос</text>
    <text x="44" y="136">Предположение</text>
    <text x="44" y="192">Опыт</text>
    <text x="44" y="248">Вывод</text>
  </g>

  <g class="d-head" font-size="11.5">
    <text x="44" y="40">Растение на окне наклонилось</text>
    <text x="44" y="96">Почему оно тянется туда?</text>
    <text x="44" y="152">Может быть, дело в свете</text>
    <text x="44" y="208">Поворачиваем горшок, ждём неделю</text>
    <text x="44" y="264">Снова повернулось — дело в свете</text>
  </g>
</svg>
