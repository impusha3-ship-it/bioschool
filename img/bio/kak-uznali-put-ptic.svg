<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 300" role="img" aria-label="Как зоология узнала, куда улетают птицы. Первый шаг: наблюдение — осенью птицы улетают, весной возвращаются, но куда именно, наблюдение не говорит. Второй шаг: мечение — на лапу птице надевают лёгкое кольцо с номером и адресом. Третий шаг: возвраты — тот, кто нашёл окольцованную птицу за тысячи километров, сообщает номер, и на карте появляется точка. Четвёртый шаг: карта путей, построенная из тысяч таких точек. Внизу вывод: один человек за жизнь не увидел бы и десятой части пути, а метод позволил собрать ответ из тысяч чужих находок.">
  <g class="d-head" font-size="11.5" font-weight="650" font-family="system-ui, sans-serif">
    <text x="8" y="14">Откуда известно, куда улетают птицы</text>
  </g>

  <!--
    Четыре шага метода. Нарисованы лестницей сверху вниз: каждый следующий
    отвечает на вопрос, который остался от предыдущего. Именно это и есть
    работа науки, а не список названий её разделов.
  -->
  <g class="d-step-3">
    <rect x="8" y="26" width="200" height="30" rx="6"/>
  </g>
  <g class="d-label" font-size="11.5" font-weight="650" font-family="system-ui, sans-serif">
    <text x="18" y="46">1. Наблюдение</text>
  </g>
  <g class="d-row" font-size="11" font-family="system-ui, sans-serif">
    <text x="216" y="40">осенью улетели,</text>
    <text x="216" y="54">весной вернулись</text>
  </g>

  <g class="d-lead" fill="none">
    <path d="M108 56 V70"/>
  </g>
  <g class="d-warn-t" font-size="11" font-family="system-ui, sans-serif">
    <text x="116" y="68">а куда — не видно</text>
  </g>

  <g class="d-step-3">
    <rect x="8" y="76" width="200" height="30" rx="6"/>
  </g>
  <g class="d-label" font-size="11.5" font-weight="650" font-family="system-ui, sans-serif">
    <text x="18" y="96">2. Мечение</text>
  </g>
  <g class="d-row" font-size="11" font-family="system-ui, sans-serif">
    <text x="216" y="90">лёгкое кольцо</text>
    <text x="216" y="104">с номером</text>
  </g>

  <g class="d-lead" fill="none">
    <path d="M108 106 V120"/>
  </g>

  <g class="d-step-3">
    <rect x="8" y="126" width="200" height="30" rx="6"/>
  </g>
  <g class="d-label" font-size="11.5" font-weight="650" font-family="system-ui, sans-serif">
    <text x="18" y="146">3. Возвраты</text>
  </g>
  <g class="d-row" font-size="11" font-family="system-ui, sans-serif">
    <text x="216" y="140">нашедший</text>
    <text x="216" y="154">шлёт номер</text>
  </g>

  <g class="d-lead" fill="none">
    <path d="M108 156 V170"/>
  </g>

  <g class="d-step-1">
    <rect x="8" y="176" width="200" height="30" rx="6"/>
  </g>
  <g class="d-label" font-size="11.5" font-weight="650" font-family="system-ui, sans-serif">
    <text x="18" y="196">4. Карта путей</text>
  </g>
  <g class="d-row" font-size="11" font-family="system-ui, sans-serif">
    <text x="216" y="190">тысячи точек</text>
    <text x="216" y="204">складываются</text>
  </g>

  <g class="d-eq-rule">
    <line x1="8" y1="224" x2="312" y2="224"/>
  </g>

  <g class="d-row" font-size="11" font-family="system-ui, sans-serif">
    <text x="8" y="244">Сегодня к кольцам добавились передатчики:</text>
    <text x="8" y="258">птицу видно каждый день, а не один раз.</text>
  </g>

  <g class="d-verdict" font-size="11" font-family="system-ui, sans-serif">
    <text x="8" y="280">Один человек за жизнь не увидел бы и десятой части</text>
    <text x="8" y="294">пути. Метод собрал ответ из тысяч чужих находок.</text>
  </g>
</svg>
