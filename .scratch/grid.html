<!doctype html><html lang="ru"><meta charset="utf-8"><title>Сетка</title>
<link rel="stylesheet" href="/css/tokens.css"><link rel="stylesheet" href="/css/base.css">
<body style="background:var(--paper);margin:0;padding:10px">
<div id="box" style="position:relative;width:340px">
  <div class="figure__holder" style="position:relative"></div>
</div>
<script>
fetch('/img/bio/mikroskop-chasti.svg').then(r=>r.text()).then(t=>{
  const svg=new DOMParser().parseFromString(t,'image/svg+xml').documentElement;
  svg.setAttribute('class','figure__svg'); svg.style.width='100%'; svg.style.height='auto';
  const h=document.querySelector('.figure__holder'); h.append(svg);
  for(let p=0;p<=100;p+=5){
    const v=document.createElement('div');
    v.style.cssText=`position:absolute;left:${p}%;top:0;bottom:0;width:1px;background:${p%25?'rgba(200,0,0,.25)':'rgba(200,0,0,.7)'};z-index:5`;
    const hz=document.createElement('div');
    hz.style.cssText=`position:absolute;top:${p}%;left:0;right:0;height:1px;background:${p%25?'rgba(0,0,200,.25)':'rgba(0,0,200,.7)'};z-index:5`;
    h.append(v,hz);
    if(p%25===0){
      const lx=document.createElement('div'); lx.textContent=p;
      lx.style.cssText=`position:absolute;left:${p}%;top:-2px;font:10px system-ui;color:#c00;z-index:6`;
      const ly=document.createElement('div'); ly.textContent=p;
      ly.style.cssText=`position:absolute;top:${p}%;left:0;font:10px system-ui;color:#00c;z-index:6`;
      h.append(lx,ly);
    }
  }
});
</script>
