<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 296" role="img" aria-label="Деление клетки в четыре шага. Первый: ядро увеличивается, в нём становятся хорошо видны хромосомы. Второй: каждая хромосома копирует себя, получаются две одинаковые части. Третий: копии расходятся к разным полюсам клетки. Четвёртый: в середине клетки образуется перегородка, и возникают две дочерние клетки. Внизу вывод: в каждой новой клетке хромосом столько же, сколько было в материнской, поэтому дочерние клетки наследственно сходны с исходной.">
  <g class="d-head" font-size="11.5" font-weight="650" font-family="system-ui, sans-serif">
    <text x="8" y="16">Как делится клетка</text>
  </g>
  <g class="d-num-circle"><circle cx="24" cy="50" r="13"/></g>
  <text class="d-num-text" x="24" y="54" font-size="12" font-weight="650" text-anchor="middle" font-family="system-ui, sans-serif">1</text>
  <text class="d-row" x="48" y="46" font-size="12" font-weight="650" font-family="system-ui, sans-serif">Ядро увеличивается,</text>
  <text class="d-head" x="48" y="62" font-size="11.5" font-family="system-ui, sans-serif">в нём видны хромосомы</text>
  <g class="d-stem" stroke-width="2" stroke-linecap="round" fill="none"><path d="M24 66 V78 M18 72 L24 78 L30 72"/></g>
  <g class="d-num-circle"><circle cx="24" cy="102" r="13"/></g>
  <text class="d-num-text" x="24" y="106" font-size="12" font-weight="650" text-anchor="middle" font-family="system-ui, sans-serif">2</text>
  <text class="d-row" x="48" y="98" font-size="12" font-weight="650" font-family="system-ui, sans-serif">Каждая хромосома</text>
  <text class="d-head" x="48" y="114" font-size="11.5" font-family="system-ui, sans-serif">копирует себя</text>
  <g class="d-stem" stroke-width="2" stroke-linecap="round" fill="none"><path d="M24 118 V130 M18 124 L24 130 L30 124"/></g>
  <g class="d-num-circle"><circle cx="24" cy="154" r="13"/></g>
  <text class="d-num-text" x="24" y="158" font-size="12" font-weight="650" text-anchor="middle" font-family="system-ui, sans-serif">3</text>
  <text class="d-row" x="48" y="150" font-size="12" font-weight="650" font-family="system-ui, sans-serif">Копии расходятся</text>
  <text class="d-head" x="48" y="166" font-size="11.5" font-family="system-ui, sans-serif">к полюсам клетки</text>
  <g class="d-stem" stroke-width="2" stroke-linecap="round" fill="none"><path d="M24 170 V182 M18 176 L24 182 L30 176"/></g>
  <g class="d-num-circle"><circle cx="24" cy="206" r="13"/></g>
  <text class="d-num-text" x="24" y="210" font-size="12" font-weight="650" text-anchor="middle" font-family="system-ui, sans-serif">4</text>
  <text class="d-row" x="48" y="202" font-size="12" font-weight="650" font-family="system-ui, sans-serif">Возникает перегородка,</text>
  <text class="d-head" x="48" y="218" font-size="11.5" font-family="system-ui, sans-serif">клеток стало две</text>

  <g class="d-eq-rule">
    <line x1="8" y1="248" x2="312" y2="248"/>
  </g>

  <g class="d-verdict" font-size="11" font-family="system-ui, sans-serif">
    <text x="8" y="266">Хромосом в новой клетке столько же,</text>
    <text x="8" y="282">сколько было в материнской</text>
  </g>
</svg>
