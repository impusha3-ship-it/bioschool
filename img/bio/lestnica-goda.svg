<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 300" role="img" aria-label="Шесть ступеней, по которым шёл весь курс пятого класса, снизу вверх. Первая: клетка — из чего построено живое. Вторая: организм — тот, у кого все признаки живого есть сразу. Третья: вид — организмы, дающие общее потомство. Четвёртая: сообщество — виды, связанные друг с другом. Пятая: природная зона — сообщества в сходных условиях. Шестая: биосфера — всё живое Земли вместе. Внизу подпись: каждая следующая ступень собрана из предыдущих, и на каждой появляется то, чего на предыдущей не было.">
  <g class="d-head" font-size="11" font-weight="650" font-family="system-ui, sans-serif">
    <text x="8" y="13">По этой лестнице мы шли весь год</text>
  </g>

  <g class="d-axis" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M20 216 V32"/>
    <path d="M20 32 l-5 7 M20 32 l5 7"/>
  </g>

  <g class="d-num-circle">
    <circle cx="20" cy="206" r="10"/>
    <circle cx="20" cy="172" r="10"/>
    <circle cx="20" cy="138" r="10"/>
    <circle cx="20" cy="104" r="10"/>
    <circle cx="20" cy="70" r="10"/>
    <circle cx="20" cy="38" r="10"/>
  </g>
  <g class="d-num-text" font-size="11" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">
    <text x="20" y="210">1</text>
    <text x="20" y="176">2</text>
    <text x="20" y="142">3</text>
    <text x="20" y="108">4</text>
    <text x="20" y="74">5</text>
    <text x="20" y="42">6</text>
  </g>

  <g class="d-capsule">
    <rect x="38" y="194" width="104" height="24" rx="6"/>
    <rect x="38" y="160" width="104" height="24" rx="6"/>
    <rect x="38" y="126" width="104" height="24" rx="6"/>
    <rect x="38" y="92" width="104" height="24" rx="6"/>
    <rect x="38" y="58" width="104" height="24" rx="6"/>
    <rect x="38" y="26" width="104" height="24" rx="6"/>
  </g>
  <g class="d-capsule-t" font-size="12" font-weight="650" font-family="system-ui, sans-serif">
    <text x="46" y="211">Клетка</text>
    <text x="46" y="177">Организм</text>
    <text x="46" y="143">Вид</text>
    <text x="46" y="109">Сообщество</text>
    <text x="46" y="75" font-size="11">Природная зона</text>
    <text x="46" y="43">Биосфера</text>
  </g>

  <g class="d-label" font-size="11" font-family="system-ui, sans-serif">
    <text x="152" y="211">из чего построено живое</text>
    <text x="152" y="177">у кого признаки сразу</text>
    <text x="152" y="143">кто даёт общее потомство</text>
    <text x="152" y="109">кто с кем связан</text>
    <text x="152" y="75">где какие условия</text>
    <text x="152" y="43">всё живое Земли</text>
  </g>

  <g class="d-verdict" font-size="12" font-family="system-ui, sans-serif">
    <text x="8" y="248">Каждая ступень собрана из предыдущих, и на каждой</text>
    <text x="8" y="262">появляется то, чего ниже не было: одна клетка не ест,</text>
    <text x="8" y="276">один организм не образует цепи питания, одно</text>
    <text x="8" y="290">сообщество не делает природную зону.</text>
  </g>
</svg>
